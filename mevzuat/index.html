<style id="mz-std">
header nav{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}header nav::-webkit-scrollbar{display:none}
header nav a{white-space:nowrap}header nav a.opt{display:inline-block!important}
/* Üye girişi kutusu */
.mzg-card{max-width:460px!important;margin:44px auto!important;padding:38px 26px 30px!important;text-align:center!important;border-radius:30px!important;position:relative;overflow:hidden;display:flex!important;flex-direction:column;align-items:stretch!important;gap:14px!important;
 background:linear-gradient(165deg,var(--surf,#1c1328),var(--soft,#241a33))!important;border:1px solid var(--line,#2f2340)!important;box-shadow:0 26px 60px -28px rgba(196,32,46,.55)!important}
.mzg-card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--g1,#c4202e),var(--g2,#ff7a45))}
.mzg-card :is(h1,h2,h3,h4){margin:0!important;font-size:clamp(23px,6vw,30px)!important;line-height:1.15!important}
.mzg-card p{margin:0!important;line-height:1.6;color:var(--mut,#b6a8c8)!important;font-size:16px}
.mzg-card .mzg-row{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.mzg-card .mzg-primary{display:block;width:100%;padding:15px 20px!important;border:0!important;border-radius:999px!important;font:700 17px system-ui,sans-serif!important;color:#fff!important;text-decoration:none;text-align:center;cursor:pointer;background:linear-gradient(120deg,var(--g1,#c4202e),var(--g2,#ff7a45))!important;box-shadow:0 12px 28px -12px rgba(196,32,46,.8)}
.mzg-card .mzg-secondary{display:block;width:100%;padding:13px 20px!important;border-radius:999px!important;font:600 15px system-ui,sans-serif!important;color:var(--ink,#f6f0fb)!important;text-decoration:none;text-align:center;cursor:pointer;background:transparent!important;border:1px solid var(--line,#2f2340)!important}
</style>
</head><body>

<script src="data/index.js?v=3"></script>

<script id="mz-ictihat-btn">
/* Mevzuat sayfasının içine "İçtihatlar" düğmesi koyar; ictihat.html'i açar (kanun/madde sayfasındaysa filtreli). */
(()=>{
const css=document.createElement('style');
css.textContent='#mz-ic{display:inline-flex;align-items:center;gap:8px;margin:18px 0 6px;padding:13px 22px;border-radius:999px;font:700 16px "Instrument Sans",system-ui,sans-serif;color:#fff;text-decoration:none;background:linear-gradient(120deg,var(--g1,#c4202e),var(--g2,#ff7a45));box-shadow:0 12px 28px -12px rgba(196,32,46,.8)}#mz-ic:hover{filter:brightness(1.08)}';
document.head.appendChild(css);
const href=()=>{
  let p=[];try{p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean)}catch(e){}
  let u='ictihat.html';
  if(/^\d+$/.test(p[0]||'')){u+='?kanun='+encodeURIComponent(p[0]);if(p[1])u+='&madde='+encodeURIComponent(p[1].replace(/^m\.?/i,''))}
  return u;
};
const put=()=>{
  const app=document.getElementById('app');if(!app)return;
  let a=document.getElementById('mz-ic');
  if(app.querySelector('.mzg-card')||/Üye girişi gerekli/.test(app.textContent)){if(a)a.remove();return}
  if(!a||!app.contains(a)){
    a=document.createElement('a');a.id='mz-ic';a.textContent='⚖ İçtihatlar';
    const w=app.querySelector('.wrap');(w||app).prepend(a);
  }
  const h=href();if(a.getAttribute('href')!==h)a.setAttribute('href',h);
};
document.addEventListener('DOMContentLoaded',()=>{const app=document.getElementById('app');if(app)new MutationObserver(put).observe(app,{childList:true,subtree:true});put()});
window.addEventListener('hashchange',put);
})();
</script>
<script id="mz-gate-ui">
/* "Üye girişi gerekli" kutusunu bulup yeniden biçimlendirir; düğmelerin işlevine dokunmaz. */
(()=>{
const find=()=>{
  const app=document.getElementById('app');if(!app)return;
  const hs=[...app.querySelectorAll('h1,h2,h3,h4,b,strong,div,p,span')].filter(e=>e.children.length<=1&&/Üye girişi gerekli/.test(e.textContent)&&e.textContent.length<60);
  const h=hs[0];if(!h)return;
  let card=h;
  for(let i=0;i<6&&card&&card!==app;i++){ if(card.querySelectorAll('button,a').length>=2)break; card=card.parentElement }
  if(!card||card===app||card.classList.contains('mzg-card'))return;
  const btns=[...card.querySelectorAll('button,a')];if(btns.length<2)return;
  card.classList.add('mzg-card');
  btns[0].classList.add('mzg-primary');btns[1].classList.add('mzg-secondary');
  const row=btns[0].parentElement;if(row&&row!==card&&row.contains(btns[1]))row.classList.add('mzg-row');
};
const go=()=>{try{find()}catch(e){}};
document.addEventListener('DOMContentLoaded',()=>{const a=document.getElementById('app');if(a)new MutationObserver(go).observe(a,{childList:true,subtree:true});go()});
setTimeout(go,300);setTimeout(go,1200);
})();
</script>
</body></html>
