    tg.type='button';tg.setAttribute('aria-controls',id);tg.innerHTML=DOWN;ul.id=id;
    kids.forEach(function(k){
      var l=mk('li'),b=mk('a');b.textContent=k.text;setHref(b,k);
      if(k.sub)b.className='dm-k';
      if(k.on){b.className=(b.className?b.className+' ':'')+'on';b.setAttribute('aria-current','page');anyOn=true}
      l.appendChild(b);ul.appendChild(l);
    });
    wrap.appendChild(ul);li.appendChild(wrap);row.appendChild(tg);
    li.setAttribute('data-l',o.text);
    tg.addEventListener('click',function(){
      var will=!li.classList.contains('open');
      if(will)[].forEach.call(list.querySelectorAll('.dm-item.open'),function(x){var t=x.querySelector('.dm-tg');if(t)setSub(x,t,x.getAttribute('data-l'),false)});
      setSub(li,tg,o.text,will);
    });
    setSub(li,tg,o.text,!!(o.open||anyOn));
  }
  if(o.on||anyOn){a.className='on';if(o.on)a.setAttribute('aria-current','page')}
  list.appendChild(li);
}
function build(){
  list.textContent='';uid=0;
  var member=isMember();lastM=member;
  /* 1) Bu laboratuvarın kendi sekmeleri */
  var tabs=[];try{tabs=(CFG.tabs&&CFG.tabs())||[]}catch(e){tabs=[]}
  if(tabs.length){
    var kids=[];
    tabs.forEach(function(t){
      kids.push({text:t.text,click:t.click,href:t.href,on:t.on});
      (t.kids||[]).forEach(function(k){kids.push({text:k.text,click:k.click,href:k.href,on:k.on,sub:true})});
    });
    var m0=CFG.main||{click:tabs[0].click,href:tabs[0].href};
    addItem({text:CFG.title||'Laboratuvar',click:m0.click,href:m0.href,kids:kids,open:true});
  }
  /* 2) Site menüsü (ana sayfadakiyle aynı) */
  addItem({text:'Ana Sayfa',href:'../'});
  SITE.forEach(function(it){
    var t=it[0],h=it[1];
    if(t==='Üye Alanı'){
      if(!member)return;                       /* yalnızca onaylı üye */
      var lab=inLab();
      addItem({text:t,href:h,on:false,open:true,kids:EP.map(function(e){return{text:e[0],href:e[1],on:false}})});
      return;
    }
    if(t==='Katıl')addItem({text:'Eko Can',click:function(){if(window.EkoBotAc)EkoBotAc(U('../eko-bot.html'));else location.href=U('../eko-bot.html')}});
    var base=h.split('#')[0],sub=SUB[t];
    addItem({text:t,href:h,on:t==='Mevzuat',kids:sub?sub.map(function(k){return{text:k[1],href:base+'#/'+k[0]}}):null});
  });
}
function openM(){
  if(isOpen)return;build();isOpen=true;lastF=D.activeElement;
  root.classList.add('open');D.body.classList.add('dm-lock');
  btn.setAttribute('aria-expanded','true');btn.setAttribute('aria-label','Menüyü kapat');
  setTimeout(function(){var x=root.querySelector('.dm-x');if(x)x.focus()},60);
}
function closeM(restore){
  if(!isOpen)return;isOpen=false;
  root.classList.remove('open');D.body.classList.remove('dm-lock');
  btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Menüyü aç');
  if(restore&&lastF&&lastF.focus)lastF.focus();
}
btn.addEventListener('click',function(){isOpen?closeM(true):openM()});
root.querySelector('.dm-ov').addEventListener('click',function(){closeM(true)});
root.querySelector('.dm-x').addEventListener('click',function(){closeM(true)});
root.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('.dm-list a');if(a)closeM(false)});
D.addEventListener('keydown',function(e){
  if(!isOpen)return;
  if(e.key==='Escape'){e.preventDefault();closeM(true);return}
  if(e.key==='Tab'){
    var f=[].slice.call(root.querySelectorAll('.dm-x,.dm-list a,.dm-tg')).filter(function(x){return getComputedStyle(x).visibility!=='hidden'}),i=f.indexOf(D.activeElement);
    if(!f.length)return;
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&(i===-1||i===f.length-1)){e.preventDefault();f[0].focus()}
  }
});
var sx=0,sy=0;
panel.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
panel.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);if(dx>70&&dy<50)closeM(true)},{passive:true});
addEventListener('hashchange',function(){closeM(false)});

/* Üyelik durumu değişince menü kendini günceller */
function refresh(){var m=isMember();if(m!==lastM){lastM=m;if(isOpen)build()}}
addEventListener('storage',function(e){if(!e.key||e.key==='eko_uye'||e.key==='eko_uye_ok')refresh()});
addEventListener('pageshow',refresh);
addEventListener('focus',refresh);
/* Laboratuvar çerçevesinde üst sayfa üyelik bilgisini mesajla da gönderir */
addEventListener('message',function(e){var d=e.data;if(d&&d.eko==='uye'&&d.o&&d.o.ok){flag=true;refresh()}});
window.EkoMenu={open:openM,close:function(){closeM(false)}};
R.classList.add('dm-on');
})();
</script>

<script id="mz-ictihat-btn">
/* Mevzuat sayfasının içine "İçtihatlar" düğmesi koyar; ictihat.html'i açar (kanun/madde sayfasındaysa filtreli). */
(()=>{
const ACIK=false; /* İçtihatlar şimdilik kapalı: açmak için true yapın */
if(!ACIK)return;
const css=document.createElement('style');
css.textContent='#mz-ic{display:inline-flex;align-items:center;gap:8px;margin:18px 0 6px;padding:13px 22px;border-radius:999px;font:700 16px "Instrument Sans",system-ui,sans-serif;color:#fff;text-decoration:none;background:linear-gradient(120deg,var(--g1,#c4202e),var(--g2,#ff7a45));box-shadow:0 12px 28px -12px rgba(196,32,46,.8)}#mz-ic:hover{filter:brightness(1.08)}';
document.head.appendChild(css);
const href=()=>{
  let p=[];try{p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean)}catch(e){}
  let u='ictihat.html';
  if(/^\d+$/.test(p[0]||'')){u+='?kanun='+encodeURIComponent(p[0]);if(p[1])u+='&madde='+encodeURIComponent(p[1].replace(/^m\.?/i,''))}
  return u;
};
const put=()=>{
  const app=document.getElementById('app');if(!app)return;
  let a=document.getElementById('mz-ic');
  if(app.querySelector('.mzg-card')||/Üye girişi gerekli/.test(app.textContent)){if(a)a.remove();return}
  if(!a||!app.contains(a)){
    a=document.createElement('a');a.id='mz-ic';a.textContent='⚖ İçtihatlar';
    const w=app.querySelector('.wrap');(w||app).prepend(a);
  }
  const h=href();if(a.getAttribute('href')!==h)a.setAttribute('href',h);
};
document.addEventListener('DOMContentLoaded',()=>{const app=document.getElementById('app');if(app)new MutationObserver(put).observe(app,{childList:true,subtree:true});put()});
window.addEventListener('hashchange',put);
})();
</script>
<script id="mz-gate-ui">
/* "Üye girişi gerekli" kutusunu bulup yeniden biçimlendirir; düğmelerin işlevine dokunmaz. */
(()=>{
const find=()=>{
  const app=document.getElementById('app');if(!app)return;
  const hs=[...app.querySelectorAll('h1,h2,h3,h4,b,strong,div,p,span')].filter(e=>e.children.length<=1&&/Üye girişi gerekli/.test(e.textContent)&&e.textContent.length<60);
  const h=hs[0];if(!h)return;
  let card=h;
  for(let i=0;i<6&&card&&card!==app;i++){ if(card.querySelectorAll('button,a').length>=2)break; card=card.parentElement }
  if(!card||card===app||card.classList.contains('mzg-card'))return;
  const btns=[...card.querySelectorAll('button,a')];if(btns.length<2)return;
  card.classList.add('mzg-card');
  btns[0].classList.add('mzg-primary');btns[1].classList.add('mzg-secondary');
  const row=btns[0].parentElement;if(row&&row!==card&&row.contains(btns[1]))row.classList.add('mzg-row');
};
const go=()=>{try{find()}catch(e){}};
document.addEventListener('DOMContentLoaded',()=>{const a=document.getElementById('app');if(a)new MutationObserver(go).observe(a,{childList:true,subtree:true});go()});
setTimeout(go,300);setTimeout(go,1200);
})();
</script>
<script id="ekobot-overlay">
/* Eko Can / Eko Bot bağlantıları: tam ekran katmanda açılır */
(function(){
var D=document,ov=null,fr=null,prevF=null;
function css(){if(D.getElementById('ekobot-css'))return;var st=D.createElement('style');st.id='ekobot-css';
st.textContent='#ekobot{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;background:#120c1a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#ekobot[hidden]{display:none}#ekobot .eb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#1c1328;color:#f6f0fb;font:700 15px "Instrument Sans",system-ui,sans-serif}#ekobot .eb-bar a,#ekobot .eb-bar button{font:600 14px "Instrument Sans",system-ui,sans-serif;color:#f6f0fb;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none}#ekobot iframe{flex:1 1 auto;width:100%;border:0;min-height:0;background:#120c1a}';
D.head.appendChild(st)}
function kapat(){if(!ov)return;ov.hidden=true;D.documentElement.style.overflow=ov._o||'';if(prevF&&prevF.focus)prevF.focus()}
function ac(url){
  prevF=D.activeElement;css();
  if(!ov){
    ov=D.createElement('div');ov.id='ekobot';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Eko Can');
    var bar=D.createElement('div');bar.className='eb-bar';var b=D.createElement('b');b.textContent='Eko Can';
    var r=D.createElement('span');r.style.cssText='display:flex;gap:8px';
    var nw=D.createElement('a');nw.target='_blank';nw.rel='noopener';nw.textContent='Yeni sekmede aç';nw.id='eb-new';
    var x=D.createElement('button');x.type='button';x.textContent='\u2715 Kapat';x.addEventListener('click',kapat);
    r.appendChild(nw);r.appendChild(x);bar.appendChild(b);bar.appendChild(r);
    fr=D.createElement('iframe');fr.title='Eko Can';fr.setAttribute('allow','clipboard-write; microphone');
    ov.appendChild(bar);ov.appendChild(fr);D.body.appendChild(ov);
    D.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov&&!ov.hidden)kapat()});
  }
  if(fr.getAttribute('src')!==url)fr.src=url;
  D.getElementById('eb-new').href=url;
  ov._o=D.documentElement.style.overflow;D.documentElement.style.overflow='hidden';ov.hidden=false;
}
window.EkoBotAc=ac;
D.addEventListener('click',function(e){
  if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  var a=e.target.closest&&e.target.closest('a[href]');
  if(!a||a.target==='_blank'||a.closest('#ekobot'))return;
  var h=a.getAttribute('href')||'';
  if(!/(^|\/)eko-bot\.html(#.*)?$/.test(h))return;
  e.preventDefault();e.stopPropagation();ac(a.href);
},true);
})();
</script>
