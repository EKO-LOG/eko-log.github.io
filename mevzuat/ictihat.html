 const ok=()=>{try{sessionStorage.setItem("mz_ok",JSON.stringify({u:S.uid,t:Date.now()}))}catch(e){}return"ok"};
 try{
  try{await dbg("uyeler",t,"shallow=true");return ok()}catch(e){if(e.message!=="perm")throw e}
  const hk=String(S.e||"").trim().toLowerCase().replace(/\./g,",");
  try{if(await dbg("hoca/"+hk,t))return ok()}catch(e){if(e.message!=="perm")throw e}
  const lk=await(await fetch("https://identitytoolkit.googleapis.com/v1/accounts:lookup?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken:t})})).json();
  const ver=!!(lk.users&&lk.users[0]&&lk.users[0].emailVerified),rec=await dbg("uyeler/"+S.uid,t);
  if(rec&&rec.s==="onay"&&ver)return ok();
  if(rec&&rec.s==="red")return"red";
  return ver?"wait":"verify"
 }catch(e){return"net"}}
const MSG={none:["Üye girişi gerekli","İçtihatlar yalnızca onaylı Eko-Log üyelerine açıktır. Mevzuat sayfasından giriş yaptıktan sonra bu sayfaya dön."],wait:["Onay bekleniyor","Üyeliğin henüz yönetici tarafından onaylanmadı."],verify:["E-posta doğrulaması gerekli","Kullanabilmek için e-postana gelen doğrulama bağlantısına tıkla, sonra tekrar kontrol et."],red:["Başvuru onaylanmadı","Sorular için topluluğa yazabilirsin."],net:["Bağlantı sorunu","Üyelik kontrol edilemedi. İnternetini kontrol edip tekrar dene."]};
function gate(st){const M=MSG[st]||MSG.net;
 app.innerHTML=hero(`<h1 class="rise">İçtihatlar</h1><p class="rise">Eko-Log üyelerine özel.</p>`)+`<div class="wrap"><div class="card gate"><h2>🔒 ${esc(M[0])}</h2><p>${esc(M[1])}</p><div class="acts"><a class="btn grad" href="./">Mevzuat sayfasında giriş yap</a><button class="btn sm" id="gr">Tekrar kontrol et</button></div></div></div>`;
 $("#gr").onclick=start}

/* ---- İçtihat listesi ---- */
const fmtT=t=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t||"");return m?`${m[3]}.${m[2]}.${m[1]}`:(t||"")};
function show(){
 const D=(window.ICTIHAT||[]).slice(),P=new URLSearchParams(location.search);
 const st={q:"",k:P.get("kanun")||"",m:"",madde:P.get("madde")||""};
 const kanunlar=[...new Map(D.map(d=>[d.kanun,d.kanunAdi||d.kanun])).entries()];
 if(st.k&&!kanunlar.some(([n])=>n===st.k))kanunlar.push([st.k,st.k]);
 const mahk=[...new Set(D.map(d=>d.mahkeme).filter(Boolean))];
 const ad=(kanunlar.find(([n])=>n===st.k)||[])[1];
 const title=st.k?`${ad||st.k}${st.madde?" · m. "+st.madde:""}`:"İçtihat Kararları";
 document.title=title+" · İçtihatlar · Eko-Log";
 app.innerHTML=hero(`<span class="pill">İçtihatlar</span><h1 class="rise">${esc(title)}</h1><p class="rise">Kanun maddelerine bağlı yargı kararları. Karar metni için kaynak bağlantısına bakınız.</p><a class="btn line" href="${st.k?"./#/"+encodeURIComponent(st.k):"./"}">‹ ${st.k?"Kanuna dön":"Mevzuat"}</a>`,1)
 +`<div class="wrap"><div class="sbar"><div class="ic-tools"><input id="q" type="search" placeholder="Ara: özet, daire, esas/karar no…" aria-label="İçtihatlarda ara"><div class="ic-row"><select id="fk" aria-label="Kanun"><option value="">Tüm kanunlar</option>${kanunlar.map(([n,a])=>`<option value="${esc(n)}">${esc(n)} · ${esc(a)}</option>`).join("")}</select><select id="fm" aria-label="Mahkeme"><option value="">Tüm mahkemeler</option>${mahk.map(m=>`<option>${esc(m)}</option>`).join("")}</select></div></div></div><div class="cnt" id="say"></div><div id="liste"></div></div>`;
 $("#fk").value=st.k;
 const draw=()=>{
  const q=st.q.toLocaleLowerCase("tr");
  let r=D.filter(d=>(!st.k||d.kanun===st.k)&&(!st.m||d.mahkeme===st.m)&&(!st.madde||String(d.madde)===st.madde));
  if(q)r=r.filter(d=>[d.mahkeme,d.daire,d.esas,d.karar,d.ozet,d.kanunAdi,d.kanun,d.madde].join(" ").toLocaleLowerCase("tr").includes(q));
  r.sort((a,b)=>String(b.tarih||"").localeCompare(String(a.tarih||"")));
  $("#say").textContent=r.length+" karar";
  $("#liste").innerHTML=r.length?r.map(d=>{
   const kunye=[d.mahkeme,d.daire].filter(Boolean).join(" · "),no=[d.esas&&"E. "+d.esas,d.karar&&"K. "+d.karar,fmtT(d.tarih)].filter(Boolean).join(" · ");
   return `<details class="case"><summary><span class="no">${esc(d.kanun)}${d.madde?" · m. "+esc(d.madde):""}${d.ornek?" · ÖRNEK KAYIT":""}</span><span class="bs">${esc(kunye)}</span><span class="am">${esc(no)}</span></summary><div class="body">${d.kanunAdi?`<span class="ic-tag">${esc(d.kanunAdi)}</span>`:""}<p>${esc(d.ozet)}</p>${d.link?`<a class="ic-link" href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">Kaynağa git →</a>`:""}</div></details>`}).join(""):'<div class="empty">Bu seçime uygun içtihat kararı bulunamadı.</div>'};
 $("#q").addEventListener("input",e=>{st.q=e.target.value;draw()});
 $("#fk").addEventListener("change",e=>{st.k=e.target.value;st.madde="";draw()});
 $("#fm").addEventListener("change",e=>{st.m=e.target.value;draw()});
 draw()}

let busy=false;
async function start(){
 if(busy)return;busy=true;
 app.innerHTML=hero(`<h1 class="rise">İçtihatlar</h1><p class="rise">Üyeliğin kontrol ediliyor…</p>`);
 const s=await verify();busy=false;
 if(s!=="ok"){gate(s);return}
 show()}
window.addEventListener("focus",()=>{if(!busy&&document.querySelector(".gate"))start()});
start();
})();
</script>
</body></html>
