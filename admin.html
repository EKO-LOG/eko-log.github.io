<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Yayın masası · Eko-Log</title>
<style>
:root{
  --bg:#f1f3f8;--surf:#fff;--ink:#0f1936;--mut:#56617f;--line:#dde2ee;--soft:#eaeef7;
  --red:#c8202f;--navy:#1d2d6b;--ok:#0f7a56;--warn:#9a5200;--bad:#b42318;
  --pub:linear-gradient(100deg,#b91c2c,#d8481e);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a0f20;--surf:#121a33;--ink:#eef1fb;--mut:#9ba7c7;--line:#243056;--soft:#1a2446;
  --red:#ff6a5e;--navy:#a9baff;--ok:#4cd6a0;--warn:#ffb454;--bad:#ff8b80;
  --pub:linear-gradient(100deg,#c4202e,#e8541f);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--navy) 70%,transparent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- giriş ---- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{width:min(460px,100%);background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:30px 28px;display:grid;gap:18px}
.lcard h1{font-size:34px}
.lcard .lead{color:var(--mut)}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--surf));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:600}
details.how{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details.how summary{cursor:pointer;font-weight:600}
details.how ol{margin:10px 0 2px;padding-left:20px;color:var(--mut)}
details.how li{margin:4px 0}

/* ---- kabuk ---- */
#app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
#rail{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--surf);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:20px}
.brand{padding:0 8px}
.brand b{font:700 25px/1 var(--serif);letter-spacing:-.02em;display:block}
.brand span{color:var(--mut);font-size:13px}
nav.menu{display:grid;gap:16px}
nav.menu h3{font:600 13px var(--sans);color:var(--mut);padding:0 10px 4px;letter-spacing:0}
nav.menu a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.menu a:hover{background:var(--soft)}
nav.menu a[aria-current=page]{background:var(--ink);color:var(--surf)}
nav.menu .cnt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
nav.menu a[aria-current=page] .cnt{color:inherit;opacity:.75}
.dot{width:8px;height:8px;border-radius:50%;background:#e8741f;flex:none}
.railfoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:grid;gap:6px;font-size:13px;color:var(--mut)}
.railfoot b{color:var(--ink)}
.conn{display:flex;align-items:center;gap:7px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#scrim{display:none}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
#top h1{font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none}
@media(min-width:901px){#top h1{visibility:hidden}}
#main{padding:26px 28px 80px;max-width:1120px}
.pagehead{margin-bottom:20px;display:grid;gap:6px}
.pagehead h2{font-size:30px}
.pagehead p{color:var(--mut);max-width:62ch}

/* ---- düğmeler ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.solid{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.btn.solid:hover{opacity:.9}
.btn.pub{background:var(--pub);border-color:transparent;color:#fff;padding:8px 18px}
.btn.pub:hover{filter:brightness(1.06)}
.btn.pub[disabled]{background:var(--soft);color:var(--mut);border-color:var(--line);filter:none}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13.5px}
#pubShort{display:none}
.badge{background:#fff;color:#b91c2c;border-radius:99px;font-size:12.5px;padding:0 8px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- formlar ---- */
.fld{display:grid;gap:6px;margin-bottom:16px}
.fld>label,.lab{font-weight:600}
.hint{color:var(--mut);font-size:13.5px}
input[type=text],input[type=password],input[type=search],input[type=url],textarea,select{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px}
input:hover,textarea:hover,select:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
textarea{resize:vertical;line-height:1.5}
input.bad,.bad-in{border-color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--soft)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surf))}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surf))}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0}
.switch .tr{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+.tr{background:var(--ok)}
.switch input:checked+.tr::after{transform:translateX(18px)}
.switch input:focus-visible+.tr{outline:3px solid color-mix(in srgb,var(--navy) 70%,transparent);outline-offset:2px}

/* ---- paneller ---- */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel+.panel{margin-top:16px}
.panel h3{font-size:19px;margin-bottom:10px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mut);display:grid;gap:12px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--serif);font-size:18px}

/* ---- genel bakış ---- */
.changes{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.changes li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.changes li:last-child{border-bottom:0}
.changes li::before{content:"";width:7px;height:7px;border-radius:50%;background:#e8741f;flex:none;transform:translateY(-1px)}
.clean{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:600}
.index{width:100%;border-collapse:collapse}
.index td{padding:11px 4px;border-bottom:1px solid var(--line)}
.index tr:last-child td{border-bottom:0}
.index td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:22px;font-weight:700}
.index td:last-child{text-align:right;width:1%;white-space:nowrap}

/* ---- ana-detay ---- */
.split{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:20px;align-items:start}
.listcol{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:78px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.listhead b{font-family:var(--serif);font-size:17px}
.items{overflow:auto;margin:0;padding:0;list-style:none}
.it{display:grid;grid-template-columns:46px minmax(0,1fr);gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.it:hover{background:var(--soft)}
.it[aria-current=true]{background:var(--soft);border-left-color:var(--red)}
.thumb{width:46px;height:46px;border-radius:8px;background:var(--soft);object-fit:cover;display:grid;place-items:center;color:var(--mut);font:700 18px var(--serif);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.t2{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.detail .panel{padding:22px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.backbtn{display:none}
.media{display:grid;gap:10px;justify-items:start}
.mimg{max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--line);object-fit:cover}
.mempty{width:100%;border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mut)}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.filechip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:var(--bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

/* ---- duyuru önizleme ---- */
.annprev{border-radius:10px;padding:10px 14px;text-align:center;font-weight:600;color:#fff;background:linear-gradient(90deg,#c4202e,#ff5f8f);min-height:42px;overflow-wrap:anywhere}
.annprev.off{opacity:.4}

/* ---- PPK ---- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.ppk{width:100%;border-collapse:collapse;min-width:560px}
table.ppk th{font-size:13px;text-align:left;color:var(--mut);padding:9px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
table.ppk td{padding:6px;border-bottom:1px solid var(--line)}
table.ppk tr:last-child td{border-bottom:0}
table.ppk input{min-height:36px;padding:6px 9px}
.bignum{font:700 54px/1 var(--serif);letter-spacing:-.02em}

/* ---- metinler ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:2 1 220px}
.toolbar select{flex:1 1 200px}
.tx{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}
.tx.chg{border-left-color:#e8741f}
.tx .meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut)}
.tx textarea{min-height:40px;resize:vertical}
.grouph{font:700 18px var(--serif);margin:22px 0 10px}
.bk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.bk.hid{opacity:.6}

/* ---- bileşenler ---- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);padding:0;width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,12,28,.55)}
.dbody{padding:24px;display:grid;gap:14px;max-height:calc(100vh - 160px);overflow:auto}
.dbody h2{font-size:25px}
.dfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 14px 14px}
.probs{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.probs li{display:flex;gap:10px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pub);transition:width .25s}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(480px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--surf);border-radius:10px;padding:11px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.skel{height:64px;border-radius:10px;background:linear-gradient(90deg,var(--soft),var(--bg),var(--soft));background-size:200% 100%;animation:sk 1.3s linear infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---- dar ekran ---- */
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:60;transform:translateX(-104%);visibility:hidden;transition:transform .2s,visibility 0s .2s;box-shadow:none}
  #rail.open{transform:none;visibility:visible;transition:transform .2s,visibility 0s;box-shadow:0 0 50px rgba(0,0,0,.4)}
  #scrim.on{display:block;position:fixed;inset:0;background:rgba(8,12,28,.5);z-index:55}
  #menuBtn{display:inline-flex}
  #top{padding:10px 14px}
  #main{padding:18px 14px 90px}
  .pagehead h2{font-size:26px}
  .split{grid-template-columns:1fr}
  .listcol{position:static;max-height:none}
  .split[data-mode=list] .detail{display:none}
  .split[data-mode=detail] .listcol{display:none}
  .backbtn{display:inline-flex}
  .grid2{grid-template-columns:1fr}
  .bk{grid-template-columns:1fr}
  .publbl{display:none}
  #pubShort{display:inline}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="login" hidden></div>

<div id="app" hidden>
  <aside id="rail" aria-label="Bölümler">
    <div class="brand"><b>Eko-Log</b><span>Yayın masası</span></div>
    <nav class="menu" id="menu"></nav>
    <div class="railfoot">
      <div class="conn"><i></i><span id="connTxt">Bağlı</span></div>
      <span id="railState"></span>
    </div>
  </aside>
  <div id="scrim"></div>
  <div id="stage">
    <header id="top">
      <button class="btn sm" id="menuBtn" type="button" aria-label="Menüyü aç">Menü</button>
      <h1 id="vtitle">Yayın masası</h1>
      <button class="btn pub" id="pubBtn" type="button"><span class="publbl">Gözden geçir ve yayınla</span><span class="publbl" hidden></span><span id="pubShort">Yayınla</span><span class="badge" id="pubCnt" hidden>0</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   Eko-Log Yayın masası: content.json dosyasını GitHub üzerinden yönetir.
   Site (index.html) bu dosyayı okur; bu sayfa aynı veri yapısını yazar.
   ===================================================================== */
const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)];
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props)for(const[k,v]of Object.entries(props)){
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(k==='checked')el.checked=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}
  return el;
}
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
let _u=0;const uid=()=>String(Date.now())+String(++_u%100).padStart(2,'0');
const trNum=s=>parseFloat(String(s==null?'':s).replace(',','.'));

/* ---------- durum ---------- */
const S={cfg:null,token:null,remember:true,remote:null,work:null,
  pending:new Map(),preview:new Map(),uploaded:new Set(),
  site:null,siteP:null,view:'home',sel:{},mode:{},filter:{page:'',q:''},busy:false};

const DEF=()=>({fb:{db:'',key:''},f:{cur:'40',k:'0.25',rows:[]},w:'',ig:'',li:'',t:{},i:{},n:[],d:[],e:[],c:{team:[],gallery:[],archive:[]},b:{on:false,text:''},ar:[]});
function norm(src){
  const s=src&&typeof src==='object'?src:{},x=DEF();
  for(const k of Object.keys(s))x[k]=s[k];
  x.f=Object.assign({cur:'40',k:'0.25',rows:[]},s.f);
  x.f.cur=String(x.f.cur??'40');x.f.k=String(x.f.k??'0.25');
  x.f.rows=(Array.isArray(x.f.rows)?x.f.rows:[]).map(r=>[0,1,2,3].map(i=>String((r||[])[i]??'')));
  x.fb=Object.assign({db:'',key:''},s.fb);x.fb.db=String(x.fb.db||'');x.fb.key=String(x.fb.key||'');
  x.c=Object.assign({team:[],gallery:[],archive:[]},s.c);
  ['team','gallery','archive'].forEach(k=>{if(!Array.isArray(x.c[k]))x.c[k]=[]});
  x.b=Object.assign({on:false,text:''},s.b);x.b.on=!!x.b.on;x.b.text=String(x.b.text||'');
  ['t','i'].forEach(k=>{if(!x[k]||typeof x[k]!=='object'||Array.isArray(x[k]))x[k]={}});
  ['n','e','d','ar'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
  x.ar=x.ar.filter(it=>it&&typeof it==='object').map(it=>({id:it.id||uid(),fid:it.fid||'',title:String(it.title||''),author:String(it.author||''),cat:String(it.cat||''),text:String(it.text||''),date:String(it.date||'')}));
  ['w','ig','li'].forEach(k=>x[k]=String(x[k]||''));
  [...x.n,...x.e,...x.c.gallery,...x.c.archive].forEach(it=>{if(it.id==null||it.id==='')it.id=uid();it.id=String(it.id)});
  return x;
}

/* ---------- saklama ---------- */
const tryS=(st,f)=>{try{return f(st)}catch(e){return null}};
const store={
  tok:()=>tryS(sessionStorage,s=>s.getItem('eko_t'))||tryS(localStorage,s=>s.getItem('eko_t')),
  setTok(t,remember){this.clearTok();tryS(remember?localStorage:sessionStorage,s=>s.setItem('eko_t',t))},
  clearTok(){tryS(localStorage,s=>s.removeItem('eko_t'));tryS(sessionStorage,s=>s.removeItem('eko_t'))},
  cfg:()=>{try{return JSON.parse(localStorage.getItem('eko_adm_cfg')||'null')}catch(e){return null}},
  setCfg:c=>tryS(localStorage,s=>s.setItem('eko_adm_cfg',JSON.stringify(c)))
};
function detectRepo(){
  const host=location.hostname,seg=location.pathname.split('/').filter(Boolean);
  if(host.endsWith('.github.io')){
    const o=host.split('.')[0],first=seg[0];
    return{owner:o,repo:(first&&!/\.[a-z0-9]+$/i.test(first))?first:o+'.github.io',branch:'main'};
  }
  return{owner:'eko-log',repo:'eko-log.github.io',branch:'main'};
}

/* ---------- GitHub ---------- */
const API='https://api.github.com';
function gh(path,{method='GET',body,raw}={}){
  const{owner,repo}=S.cfg;
  return fetch(`${API}/repos/${owner}/${repo}${path?'/'+path:''}`,{
    method,cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+S.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
    body:body?JSON.stringify(body):undefined
  });
}
const enc=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function ghMsg(res){try{const j=await res.clone().json();return j&&j.message?j.message:''}catch(e){return''}}
function httpErr(status,extra){
  if(status===401)return'Erişim anahtarı geçersiz ya da süresi dolmuş. Yeni bir anahtar oluşturup tekrar dene.';
  if(status===403)return'Anahtarın bu depoya yazma izni yok. Anahtarda “Contents: Read and write” izni olmalı.'+(extra?' ('+extra+')':'');
  if(status===404)return'Depo ya da dosya bulunamadı. Depo adını ve anahtarın bu depoya erişimini kontrol et.';
  if(status===409||status===422)return'Dosya başka biri tarafından değiştirilmiş olabilir. Sayfayı yenileyip tekrar dene.'+(extra?' ('+extra+')':'');
  return'GitHub beklenmedik bir yanıt verdi ('+status+').'+(extra?' '+extra:'');
}

function modal({title,body,actions=[{label:'Tamam',value:'ok',cls:'solid'}],lock}){
  return new Promise(res=>{
    const d=h('dialog',null,
      h('div',{class:'dbody'},title?h('h2',{text:title}):null,body),
      h('div',{class:'dfoot'},actions.map(a=>h('button',{type:'button',class:'btn '+(a.cls||''),text:a.label,onclick:()=>d.close(a.value)}))));
    if(lock)d.addEventListener('cancel',e=>e.preventDefault());

    document.body.append(d);d.showModal();

}

async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,1200/Math.max(img.naturalWidth,1)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',.82),path='images/'+uid()+'.jpg';
    S.pending.set(path,{b64:data.split(',')[1]});S.preview.set(path,data);
    return path;
  }finally{URL.revokeObjectURL(url)}
}
function processPdf(file){
  return new Promise((ok,no)=>{
    if(file.size>20*1024*1024)return no(new Error('big'));
    const r=new FileReader();
    r.onload=()=>{const path='pdf/'+uid()+'.pdf';S.pending.set(path,{b64:String(r.result).split(',')[1]});ok(path)};
    r.onerror=no;r.readAsDataURL(file);
  });
}

function diffList(a,b){
  const am=new Map(a.map(x=>[String(x.id),x])),bm=new Map(b.map(x=>[String(x.id),x]));
  return{add:b.filter(x=>!am.has(String(x.id))),del:a.filter(x=>!bm.has(String(x.id))),
    edit:b.filter(x=>am.has(String(x.id))&&!same(am.get(String(x.id)),x)),
    moved:a.filter(x=>bm.has(String(x.id))).map(x=>x.id).join()!==b.filter(x=>am.has(String(x.id))).map(x=>x.id).join()};
}
function summarize(){
  if(!S.remote||!S.work)return[];
  const a=S.remote.data,b=S.work,out=[];
  const nm=(C,x)=>'“'+((C.label(x)||'').trim()||'başlıksız')+'”';
  for(const k of['n','e','archive','gallery']){
    const C=COLS[k],d=diffList(C.get(a),C.get(b));
    const push=(arr,verb)=>{arr.slice(0,5).forEach(x=>out.push(`${C.noun} ${verb}: ${nm(C,x)}`));if(arr.length>5)out.push(`${C.noun} ${verb}: ${arr.length-5} kayıt daha`)};
    push(d.add,'eklendi');push(d.edit,'düzenlendi');push(d.del,'silindi');
    if(d.moved)out.push(`${C.title} sırası değişti`);
  }
  {const d=diffList(a.ar,b.ar),nm=x=>'“'+((x.title||'').trim()||'başlıksız')+'”';d.add.slice(0,5).forEach(x=>out.push('Makale yayına alındı: '+nm(x)));d.edit.slice(0,5).forEach(x=>out.push('Makale düzenlendi: '+nm(x)));d.del.slice(0,5).forEach(x=>out.push('Makale yayından kaldırıldı: '+nm(x)));if(d.moved)out.push('Makale sırası değişti')}
  if(a.b.on!==b.b.on)out.push(b.b.on?'Duyuru şeridi açıldı':'Duyuru şeridi kapatıldı');
  if(a.b.text!==b.b.text)out.push('Duyuru metni değişti');
  const tk=new Set([...Object.keys(a.t),...Object.keys(b.t)]);let tc=0;tk.forEach(k=>{if(a.t[k]!==b.t[k])tc++});
  if(tc)out.push(`${tc} site metni değişti`);
  [['w','WhatsApp grup bağlantısı'],['ig','Instagram bağlantısı'],['li','LinkedIn bağlantısı']].forEach(([k,n])=>{if(a[k]!==b[k])out.push(n+' değişti')});
  const hid=b.d.filter(x=>!a.d.includes(x)).length,shown=a.d.filter(x=>!b.d.includes(x)).length;
  if(hid)out.push(`${hid} örnek içerik gizlendi`);if(shown)out.push(`${shown} örnek içerik yeniden gösterilecek`);
  const sk=o=>JSON.stringify(Object.keys(o).filter(k=>k.startsWith('sim-')).sort().map(k=>[k,o[k]])),ok=o=>JSON.stringify(Object.keys(o).filter(k=>!k.startsWith('sim-')).sort().map(k=>[k,o[k]]));
  if(sk(a.i)!==sk(b.i))out.push('Simülasyon fotoğrafları değişti');
  if(ok(a.i)!==ok(b.i))out.push('Örnek içerik fotoğrafları değişti');
  if(!same(a.fb,b.fb))out.push('Yorum ve katılım veritabanı ayarları değişti');
  if(!out.length&&!same(a,b))out.push('Diğer değişiklikler');
  return out;
}

const MONTHS='ocak|şubat|mart|nisan|mayıs|haziran|temmuz|ağustos|eylül|ekim|kasım|aralık';
const calOK=s=>new RegExp('(\\d{1,2})\\s+('+MONTHS+')(?:\\s+(\\d{4}))?(?:[^\\d]+(\\d{1,2})[:.](\\d{2}))?').test(String(s||'').toLocaleLowerCase('tr'));
const httpsOK=s=>!s||/^https:\/\/\S+$/.test(s);
function validate(){
  const w=S.work,p=[];
  for(const k of['n','e','archive','gallery']){
    const C=COLS[k];
    C.get(w).forEach(x=>{
      const t=C.fields.find(f=>f.req);
      if(t&&!String(x[t.k]||'').trim())p.push({text:`${C.noun} kaydında ${t.l.toLowerCase()} boş`,view:k,id:x.id});
      else if(C.imgReq&&!x.img)p.push({text:`“${C.label(x)}” için fotoğraf seçilmemiş`,view:k,id:x.id});
    });
  }
  if(w.fb.db&&!dbOK(w.fb.db))p.push({text:'Veritabanı adresi geçersiz görünüyor',view:'settings'});
  if(w.b.on&&!w.b.text.trim())p.push({text:'Duyuru şeridi açık ama metni boş',view:'banner'});

  return p;
}

function loadSite(){
  if(S.site)return Promise.resolve(S.site);

    const lastSec={};
    const texts=[...doc.querySelectorAll('[data-k]')].map(el=>{
      const page=pageOf(el);

const SIMS=[['vaka','Vaka Analizi'],['ppk','Başkan Simülasyonu'],['borsa','Borsa Simülasyonu'],['bakan','Bakanlık Simülasyonu'],['girisim','Girişimci'],['kur','Dış Ticaret'],['burokrat','Kamu Bürokratı'],['muzakere','Müzakere Masası'],['ihale','Kamu İhalesi'],['hakimlik','Hâkimlik Simülasyonu'],['valilik','Kaymakamlık ve Valilik'],['smmm','Mali Müşavirlik']];
const dbOK=s=>/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(String(s||'').trim());

/* ---------- Firebase (REST) ---------- */
const FB={
  cfg:()=>(S.work&&S.work.fb)||{},
  ok(){const c=this.cfg();return dbOK(c.db)&&!!String(c.key||'').trim()},
  base(){return String(this.cfg().db||'').trim().replace(/\/+$/,'')},
  sess:()=>{try{return JSON.parse(sessionStorage.getItem('eko_fbs')||'null')}catch(e){return null}},
  save(o){tryS(sessionStorage,s=>s.setItem('eko_fbs',JSON.stringify(o)))},
  out(){tryS(sessionStorage,s=>s.removeItem('eko_fbs'))},
  email:()=>tryS(localStorage,s=>s.getItem('eko_fb_email'))||'',
  msg(code){
    code=String(code||'');
    if(/INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_EMAIL/.test(code))return'E-posta ya da parola hatalı.';
    if(/TOO_MANY_ATTEMPTS/.test(code))return'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.';
    if(/API_KEY|API key/i.test(code))return'API anahtarı geçersiz. Ayarlar sayfasından kontrol et.';
    if(/OPERATION_NOT_ALLOWED/.test(code))return'Firebase’de E-posta/Parola girişi açık değil. Kurulum adımlarındaki 3. adıma bak.';
    return'Giriş yapılamadı ('+code+').';
  },
  async signIn(email,pw){
    let r;try{r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(this.cfg().key.trim()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})})}
    catch(e){throw new Error('Firebase’e ulaşılamadı. İnternetini kontrol et.')}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(this.msg(j.error&&j.error.message));
    this.save({idToken:j.idToken,refresh:j.refreshToken,exp:Date.now()+(Number(j.expiresIn||3600)-90)*1000,email});
    tryS(localStorage,s=>s.setItem('eko_fb_email',email));
  },
  async token(){
    const s=this.sess();if(!s)throw new Error('auth');
    if(Date.now()<s.exp)return s.idToken;
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(this.cfg().key.trim()),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.refresh)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){this.out();throw new Error('auth')}
    this.save({idToken:j.id_token,refresh:j.refresh_token,exp:Date.now()+(Number(j.expires_in||3600)-90)*1000,email:s.email});
    return j.id_token;
  },
  async req(path,{method='GET',body,q}={}){
    const tok=await this.token();
    const qs=Object.entries(q||{}).map(([k,v])=>k+'='+encodeURIComponent(v));qs.push('auth='+encodeURIComponent(tok));
    let r;try{r=await fetch(this.base()+'/'+path+'.json?'+qs.join('&'),{method,cache:'no-store',headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined})}
    catch(e){throw new Error('Veritabanına ulaşılamadı. İnternetini kontrol et.')}
    if(r.status===401||r.status===403){throw new Error('perm')}
    if(!r.ok)throw new Error('Veritabanı beklenmedik bir yanıt verdi ('+r.status+').');
    return r.json();
  }
};

const csvCell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
function downloadCsv(name,rows){
  const head=['Etkinlik','Tarih','Yer','Ad soyad','Bölüm','Sınıf','İletişim','Kayıt zamanı'];
  const body=rows.map(r=>[r.et,r.ed,r.ep,r.n,r.b,r.s,r.c,fmtTs(r.d)].map(csvCell).join(';'));
  const blob=new Blob(['﻿'+[head.map(csvCell).join(';'),...body].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

    const secs=[];items.forEach(t=>{let s=secs[secs.length-1];if(!s||s.name!==t.sec){s={name:t.sec,items:[]};secs.push(s)}s.items.push(t)});

        tx=h('textarea',{rows:10,'aria-label':'Metin'});tx.value=x.text;
      const sum=h('summary',{style:'cursor:pointer;font-weight:600',text:(x.title||'(başlıksız)')+(x.author?' · '+x.author:'')});
      const bind=(el,k)=>el.addEventListener('input',()=>{x[k]=el.value;sum.textContent=(x.title||'(başlıksız)')+(x.author?' · '+x.author:'');touch()});
      bind(ti,'title');bind(au,'author');bind(ct,'cat');bind(tx,'text');
      const del=h('button',{class:'btn sm danger',type:'button',text:'Yayından kaldır',onclick:async()=>{
        if(!(await ask('Yayından kaldır','“'+(x.title||'başlıksız')+'” Makale sayfasından kalkar. Yayınla düğmesine basana kadar sitede kalır.','Yayından kaldır',true)))return;
        w.ar.splice(w.ar.indexOf(x),1);render();toast('Makale yayından kaldırıldı.')}});
      p.append(h('details',{class:'tx',style:'margin-top:10px'},sum,
        h('div',{class:'stack',style:'margin-top:12px'},lab('Başlık',ti),lab('Yazar',au),lab('Kategori',ct),lab('Metin',tx),h('div',{class:'row'},del))));
    });
    return p;
  };
  let pubEl=pubPanel();
  const refreshPub=()=>{const n=pubPanel();pubEl.replaceWith(n);pubEl=n;drawNav();refreshChrome()};
  const root=fbGate('Makaleler','Siteye gönderilen yazılar burada toplanır. “Yayına al” dediğin yazı Makale sayfasındaki “Yayınlanan yazılar” bölümünde görünür. Yazarın adı yazının altında çıkar, iletişim bilgisini yalnızca sen görürsün.',box=>{
    const st={rows:[]},list=h('div'),stat=h('p',{class:'hint'});
    box.append(h('div',{class:'row'},h('b',{text:'Gelen yazılar'}),h('button',{class:'btn sm',type:'button',text:'Yenile',onclick:()=>load()}),stat),list);
    const used=r=>w.ar.some(x=>String(x.fid)===String(r.id));
    const draw=()=>{
      list.replaceChildren();
      stat.textContent=st.rows.length?`${st.rows.length} yazı, ${st.rows.filter(r=>!used(r)).length} tanesi yayına alınmadı.`:'';
      if(!st.rows.length){list.append(h('div',{class:'empty'},h('b',{text:'Henüz yazı gelmedi'}),h('span',{text:'Ziyaretçiler Makale sayfasından yazı gönderince burada görünür.'})));return}
      st.rows.forEach(r=>{
        const on=used(r);
        const acts=h('div',{class:'row',style:'margin-top:10px'},
          on?h('span',{class:'chip ok',text:'Yayın taslağında'}):h('button',{class:'btn sm solid',type:'button',text:'Yayına al',onclick:()=>{
            w.ar.unshift({id:uid(),fid:r.id,title:r.t,author:r.n,cat:r.k||'',text:r.b,date:new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})});
            touch();refreshPub();draw();toast('Yayın taslağına eklendi. Üstteki Yayınla düğmesiyle siteye çıkar.')}}),
          h('span',{style:'flex:1'}),
          h('button',{class:'btn sm ghost danger',type:'button',text:'Sil',onclick:async()=>{
            if(!(await ask('Yazıyı sil','Gelen kutusundan kalıcı olarak silinir. Yayındaki kopyası etkilenmez.','Yazıyı sil',true)))return;
            try{await FB.req('articles/'+r.id,{method:'DELETE'});st.rows=st.rows.filter(x=>x.id!==r.id);draw();toast('Yazı silindi.')}
            catch(e){if(e&&e.message==='auth'){FB.out();render()}else toast('Silinemedi.')}}}));
        list.append(h('div',{class:'tx'+(on?'':' chg')},
          h('div',{class:'meta'},h('span',{text:[r.k,r.n].filter(Boolean).join(' · ')}),h('span',{text:fmtTs(r.d)})),
          h('b',{text:r.t}),
          h('p',{class:'hint',text:'İletişim: '+r.c+' · '+r.b.trim().split(/\s+/).length+' kelime'}),
          h('details',null,h('summary',{style:'cursor:pointer',text:'Metni oku'}),h('p',{style:'white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px',text:r.b})),
          acts));
      });
    };
    async function load(){
      list.replaceChildren(h('div',{class:'skel'}),h('div',{class:'skel'}));
      try{
        const j=await FB.req('articles',{q:{orderBy:'"$key"',limitToLast:'200'}})||{};
        st.rows=Object.entries(j).filter(([,x])=>x&&x.t&&x.b).map(([id,x])=>Object.assign({id},x)).sort((p,q)=>(q.d||0)-(p.d||0));
        draw();
      }catch(e){dbFail(list,e,load)}
    }
    load();
  });
  root.insertBefore(pubEl,root.children[1]||null);
  return root;
};

/* ---------- yayınlama ---------- */
function collectRefs(w){
  const s=new Set();
  [...w.n,...w.e,...w.c.gallery,...w.c.archive,...w.c.team].forEach(x=>{if(x&&x.img)s.add(x.img);if(x&&x.pdf)s.add(x.pdf)});
  Object.values(w.i).forEach(p=>p&&s.add(p));
  return[...s].filter(isSafePath);
}
async function startPublish(){
  if(S.busy)return;
  const probs=validate();
  if(probs.length){
    const v=await modal({title:'Yayınlamadan önce düzelt',
      body:h('div',{class:'stack'},h('p',{class:'mut',text:'Şu kayıtlar eksik ya da hatalı:'}),
        h('ul',{class:'probs'},probs.map((p,i)=>h('li',null,h('span',{text:p.text}),h('button',{class:'btn sm',type:'button',onclick:()=>$('dialog[open]').close('fix:'+i),text:'Düzelt'}))))),
      actions:[{label:'Kapat',value:'x',cls:'ghost'}]});
    if(v.startsWith('fix:')){const p=probs[+v.slice(4)];if(p.id)S.sel[p.view]=p.id,S.mode[p.view]='detail';go(p.view)}
    return;
  }
  const sum=summarize();if(!sum.length)return;
  const v=await modal({title:'Bunlar yayına çıkacak',
    body:h('div',{class:'stack'},h('ul',{class:'changes'},sum.map(s=>h('li',{text:s}))),
      h('p',{class:'hint',text:'Değişiklikler GitHub’a kaydedilir. Site genellikle 1–2 dakika içinde güncellenir.'})),
    actions:[{label:'Vazgeç',value:'no',cls:'ghost'},{label:'Yayınla',value:'go',cls:'pub'}]});
  if(v!=='go')return;
  await doPublish(sum.length);
}
async function doPublish(count){
  S.busy=true;$('#pubBtn').disabled=true;
  const msg=h('p',{text:'Hazırlanıyor…'}),bar=h('i'),foot=h('div',{class:'dfoot',hidden:true});
  const d=h('dialog',null,h('div',{class:'dbody'},h('h2',{text:'Yayınlanıyor'}),msg,h('div',{class:'prog'},bar)),foot);
  d.addEventListener('cancel',e=>e.preventDefault());document.body.append(d);d.showModal();
  const prog=x=>bar.style.width=Math.round(x*100)+'%';
  const finish=(title,text)=>{d.querySelector('h2').textContent=title;msg.textContent=text;foot.hidden=false;
    foot.replaceChildren(h('button',{class:'btn solid',type:'button',text:'Tamam',onclick:()=>{d.close();d.remove()}}))};
  try{
    const refs=collectRefs(S.work),up=refs.filter(p=>S.pending.has(p)&&!S.uploaded.has(p)),total=up.length+1;
    for(let i=0;i<up.length;i++){
      msg.textContent=`Dosyalar yükleniyor (${i+1}/${up.length})`;prog(i/total);
      const r=await gh('contents/'+up[i],{method:'PUT',body:{message:'Yönetim paneli: dosya yüklendi',content:S.pending.get(up[i]).b64,branch:S.cfg.branch}});
      if(!r.ok&&r.status!==422)throw new Error(httpErr(r.status,await ghMsg(r)));
      S.uploaded.add(up[i]);
    }
    msg.textContent='İçerik kaydediliyor…';prog(up.length/total);
    const g=await gh('contents/content.json?ref='+encodeURIComponent(S.cfg.branch));
    let sha;
    if(g.ok){sha=(await g.json()).sha;
      if(S.remote.sha&&sha!==S.remote.sha){
        const go=await modal({title:'Site içeriği değişmiş',body:h('p',{text:'Bu sayfayı açtığından beri content.json başka bir yerden güncellenmiş. Devam edersen o değişikliklerin üzerine yazarsın.'}),
          actions:[{label:'Vazgeç',value:'no',cls:'ghost'},{label:'Üzerine yaz',value:'go',cls:'danger'}]});
        if(go!=='go'){d.close();d.remove();return}
      }}
    else if(g.status!==404)throw new Error(httpErr(g.status,await ghMsg(g)));
    const out=clone(S.work);
    const body={message:`Yönetim paneli: içerik güncellendi (${count} değişiklik)`,content:enc(JSON.stringify(out,null,2)),branch:S.cfg.branch};
    if(sha)body.sha=sha;
    const r=await gh('contents/content.json',{method:'PUT',body});
    if(!r.ok)throw new Error(httpErr(r.status,await ghMsg(r)));
    const j=await r.json();
    S.remote={data:norm(out),sha:j.content&&j.content.sha};
    prog(1);finish('Yayınlandı','Değişiklikler GitHub’a kaydedildi. Sitede görünmesi 1–2 dakika sürebilir.');
  }catch(e){
    finish('Yayınlanamadı',e&&e.message?e.message:'Bağlantı hatası. İnternetini kontrol edip tekrar dene.');
  }finally{S.busy=false;render()}
}

/* ---------- giriş ve bağlanma ---------- */
async function connect(token,cfg,remember){
  S.token=token;S.cfg=cfg;
  let r;try{r=await gh('')}catch(e){throw new Error('GitHub’a ulaşılamadı. İnternet bağlantını kontrol et.')}
  if(!r.ok)throw new Error(httpErr(r.status));
  const info=await r.json();
  if(info.permissions&&info.permissions.push===false)throw new Error('Anahtarın bu depoya yazma izni yok. Anahtarda “Contents: Read and write” izni olmalı.');
  let data=null,sha;
  const c=await gh('contents/content.json?ref='+encodeURIComponent(cfg.branch));
  if(c.ok){const j=await c.json();sha=j.sha;try{data=JSON.parse(dec(j.content))}catch(e){throw new Error('content.json okunamadı: dosya bozuk görünüyor.')}}
  else if(c.status!==404)throw new Error(httpErr(c.status,await ghMsg(c)));
  S.remote={data:norm(data),sha};S.work=clone(S.remote.data);
  store.setTok(token,remember);store.setCfg(cfg);
}
function showLogin(err){
  S.work=null;$('#app').hidden=true;
  const L=$('#login');L.hidden=false;L.replaceChildren();
  const d=store.cfg()||detectRepo(),det=detectRepo(),cfg=Object.assign({},det,d);
  const tok=h('input',{type:'password',id:'tok',autocomplete:'off',spellcheck:'false',placeholder:'github_pat_…'});
  const show=h('button',{class:'btn sm',type:'button',text:'Göster',onclick:()=>{const p=tok.type==='password';tok.type=p?'text':'password';show.textContent=p?'Gizle':'Göster'}});
  const rem=h('input',{type:'checkbox',checked:true,id:'rem'});
  const io=h('input',{type:'text',value:cfg.owner,id:'lo',autocomplete:'off'}),ir=h('input',{type:'text',value:cfg.repo,id:'lr',autocomplete:'off'}),ib=h('input',{type:'text',value:cfg.branch,id:'lb',autocomplete:'off'});
  const errBox=h('div',{class:'err',role:'alert',hidden:!err,text:err||''});
  const go=h('button',{class:'btn solid',type:'submit',text:'Bağlan'});
  const form=h('form',{class:'lcard',novalidate:true},
    h('div',null,h('h1',{text:'Yayın masası'}),h('p',{class:'lead',style:'margin-top:8px',text:'Eko-Log sitesinin haberlerini, etkinliklerini ve metinlerini buradan yönet. Başlamak için GitHub erişim anahtarını gir.'})),
    errBox,
    h('div',{class:'fld',style:'margin:0'},h('label',{for:'tok',text:'Erişim anahtarı'}),h('div',{class:'row',style:'flex-wrap:nowrap'},tok,show)),
    h('label',{class:'row',style:'gap:8px;cursor:pointer'},rem,h('span',{text:'Bu cihazda hatırla'})),
    h('details',{class:'how'},h('summary',{text:'Depo ayarları'}),
      h('div',{class:'stack',style:'margin-top:12px'},h('div',{class:'fld',style:'margin:0'},h('label',{for:'lo',text:'Hesap ya da kuruluş'}),io),h('div',{class:'fld',style:'margin:0'},h('label',{for:'lr',text:'Depo adı'}),ir),h('div',{class:'fld',style:'margin:0'},h('label',{for:'lb',text:'Dal'}),ib))),
    go,
    h('details',{class:'how'},h('summary',{text:'Erişim anahtarını nasıl alırım?'}),
      h('ol',null,h('li',{text:'GitHub’da Settings, Developer settings, Personal access tokens, Fine-grained tokens yolunu aç.'}),
        h('li',{text:'“Generate new token” de. Repository access olarak yalnızca sitenin deposunu seç.'}),
        h('li',{text:'Permissions bölümünde Contents iznini “Read and write” yap.'}),
        h('li',{text:'Oluşan anahtarı kopyalayıp buraya yapıştır. Anahtar sadece bir kez gösterilir.'}))));
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const t=tok.value.trim();if(!t){errBox.hidden=false;errBox.textContent='Erişim anahtarını yapıştır.';tok.focus();return}
    go.disabled=true;go.textContent='Bağlanıyor…';errBox.hidden=true;
    try{await connect(t,{owner:io.value.trim(),repo:ir.value.trim(),branch:ib.value.trim()||'main'},rem.checked);L.hidden=true;enterApp()}
    catch(x){errBox.hidden=false;errBox.textContent=x.message;go.disabled=false;go.textContent='Bağlan';S.token=null}
  });
  L.append(form);if(!err)tok.focus();
}
function enterApp(){
  $('#login').hidden=true;$('#app').hidden=false;
  $('#connTxt').textContent=`${S.cfg.owner}/${S.cfg.repo}`;
  if(!location.hash)location.hash='#/home';
  route();
}

/* ---------- başlangıç ---------- */
(function boot(){
  window.addEventListener('hashchange',()=>{if(S.work)route()});
  $('#pubBtn').addEventListener('click',startPublish);
  const rail=$('#rail'),scrim=$('#scrim');
  const setDrawer=o=>{rail.classList.toggle('open',o);scrim.classList.toggle('on',o)};
  $('#menuBtn').addEventListener('click',()=>setDrawer(!rail.classList.contains('open')));
  scrim.addEventListener('click',()=>setDrawer(false));
  addEventListener('keydown',e=>{if(e.key==='Escape')setDrawer(false)});
  addEventListener('beforeunload',e=>{if(S.work&&S.remote&&summarize().length){e.preventDefault();e.returnValue=''}});
  const tok=store.tok();
  if(!tok){showLogin();return}
  const L=$('#login');L.hidden=false;L.append(h('div',{class:'lcard'},h('h1',{text:'Yayın masası'}),h('p',{class:'lead',text:'Bağlanılıyor…'})));
  connect(tok,Object.assign({},detectRepo(),store.cfg()||{}),!!tryS(localStorage,s=>s.getItem('eko_t')))
    .then(()=>{L.hidden=true;enterApp()}).catch(e=>showLogin(e.message));
})();
