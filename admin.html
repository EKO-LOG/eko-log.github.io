<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Yayın masası · Eko-Log</title>
<style>
:root{
  --bg:#f1f3f8;--surf:#fff;--ink:#0f1936;--mut:#56617f;--line:#dde2ee;--soft:#eaeef7;
  --red:#c8202f;--navy:#1d2d6b;--ok:#0f7a56;--warn:#9a5200;--bad:#b42318;
  --pub:linear-gradient(100deg,#b91c2c,#d8481e);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a0f20;--surf:#121a33;--ink:#eef1fb;--mut:#9ba7c7;--line:#243056;--soft:#1a2446;
  --red:#ff6a5e;--navy:#a9baff;--ok:#4cd6a0;--warn:#ffb454;--bad:#ff8b80;
  --pub:linear-gradient(100deg,#c4202e,#e8541f);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--navy) 70%,transparent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- giriş ---- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{width:min(460px,100%);background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:30px 28px;display:grid;gap:18px}
.lcard h1{font-size:34px}
.lcard .lead{color:var(--mut)}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--surf));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:600}
details.how{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
details.how summary{cursor:pointer;font-weight:600}
details.how ol{margin:10px 0 2px;padding-left:20px;color:var(--mut)}
details.how li{margin:4px 0}

/* ---- kabuk ---- */
#app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
#rail{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--surf);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:20px}
.brand{padding:0 8px}
.brand b{font:700 25px/1 var(--serif);letter-spacing:-.02em;display:block}
.brand span{color:var(--mut);font-size:13px}
nav.menu{display:grid;gap:16px}
nav.menu h3{font:600 13px var(--sans);color:var(--mut);padding:0 10px 4px;letter-spacing:0}
nav.menu a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.menu a:hover{background:var(--soft)}
nav.menu a[aria-current=page]{background:var(--ink);color:var(--surf)}
nav.menu .cnt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
nav.menu a[aria-current=page] .cnt{color:inherit;opacity:.75}
.newbadge{background:#d92d20;color:#fff;border-radius:99px;font:700 12px var(--sans);padding:1px 9px;line-height:18px;animation:nbp 1.6s ease-in-out infinite}@keyframes nbp{50%{opacity:.55}}
.reader{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surf);display:grid;gap:10px}.reader h3{margin:0;font-size:20px}.reader .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:14px}.reader .art{white-space:pre-wrap;line-height:1.7;font-size:16px;max-height:60vh;overflow:auto;border-top:1px solid var(--line);padding-top:12px}
.inbox{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start}
@media(max-width:860px){.inbox{grid-template-columns:1fr}}
.inbox .ilist{display:grid;gap:8px;max-height:72vh;overflow:auto}
.inbox .item{display:grid;gap:3px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.inbox .item:hover{border-color:var(--ink)}.inbox .item[aria-current=true]{border-color:#d92d20;box-shadow:0 0 0 2px #d92d2033}
.inbox .item b{font-size:15.5px;line-height:1.3}.inbox .item small{color:var(--mut);font-size:13px}
.inbox .item .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.inbox .item.isnew b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#d92d20;margin-right:7px}
.inbox .view{position:sticky;top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#e8741f;flex:none}
.railfoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:grid;gap:6px;font-size:13px;color:var(--mut)}
.railfoot b{color:var(--ink)}
.conn{display:flex;align-items:center;gap:7px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#scrim{display:none}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
#top h1{font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none}
@media(min-width:901px){#top h1{visibility:hidden}}
#main{padding:26px 28px 80px;max-width:1120px}
.pagehead{margin-bottom:20px;display:grid;gap:6px}
.pagehead h2{font-size:30px}
.pagehead p{color:var(--mut);max-width:62ch}

/* ---- düğmeler ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.solid{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.btn.solid:hover{opacity:.9}
.btn.pub{background:var(--pub);border-color:transparent;color:#fff;padding:8px 18px}
.btn.pub:hover{filter:brightness(1.06)}
.btn.pub[disabled]{background:var(--soft);color:var(--mut);border-color:var(--line);filter:none}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13.5px}
#pubShort{display:none}
.badge{background:#fff;color:#b91c2c;border-radius:99px;font-size:12.5px;padding:0 8px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- formlar ---- */
.fld{display:grid;gap:6px;margin-bottom:16px}
.fld>label,.lab{font-weight:600}
.hint{color:var(--mut);font-size:13.5px}
input[type=text],input[type=password],input[type=search],input[type=url],textarea,select{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px}
input:hover,textarea:hover,select:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
textarea{resize:vertical;line-height:1.5}
input.bad,.bad-in{border-color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--soft)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surf))}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surf))}
.xp-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.xp-row:first-of-type{border-top:0}
.xp-txt{display:grid;gap:2px;min-width:0}.xp-txt small{color:var(--mut);font-size:13.5px}.xp-txt code{font-size:12.5px;color:var(--mut)}
.xp-st{min-width:46px}.xp-st.on{color:var(--ok)}.xp-st.off{color:var(--mut)}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0}
.switch .tr{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+.tr{background:var(--ok)}
.switch input:checked+.tr::after{transform:translateX(18px)}
.switch input:focus-visible+.tr{outline:3px solid color-mix(in srgb,var(--navy) 70%,transparent);outline-offset:2px}

/* ---- paneller ---- */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel+.panel{margin-top:16px}
.panel h3{font-size:19px;margin-bottom:10px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--mut);display:grid;gap:12px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--serif);font-size:18px}

/* ---- genel bakış ---- */
.changes{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.changes li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.changes li:last-child{border-bottom:0}
.changes li::before{content:"";width:7px;height:7px;border-radius:50%;background:#e8741f;flex:none;transform:translateY(-1px)}
.clean{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:600}
.index{width:100%;border-collapse:collapse}
.index td{padding:11px 4px;border-bottom:1px solid var(--line)}
.index tr:last-child td{border-bottom:0}
.index td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:22px;font-weight:700}
.index td:last-child{text-align:right;width:1%;white-space:nowrap}

/* ---- ana-detay ---- */
.split{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:20px;align-items:start}
.listcol{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:78px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.listhead b{font-family:var(--serif);font-size:17px}
.items{overflow:auto;margin:0;padding:0;list-style:none}
.it{display:grid;grid-template-columns:46px minmax(0,1fr);gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.it:hover{background:var(--soft)}
.it[aria-current=true]{background:var(--soft);border-left-color:var(--red)}
.thumb{width:46px;height:46px;border-radius:8px;background:var(--soft);object-fit:cover;display:grid;place-items:center;color:var(--mut);font:700 18px var(--serif);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.t2{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.detail .panel{padding:22px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.backbtn{display:none}
.media{display:grid;gap:10px;justify-items:start}
.mimg{max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--line);object-fit:cover}
.mempty{width:100%;border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mut)}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.mgal{display:flex;flex-wrap:wrap;gap:12px}.mg{width:132px;display:grid;gap:4px;justify-items:start}.mg img{width:132px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.mg .mrow{gap:4px}.mgn{font-size:12px;font-weight:700;color:var(--mut)}
.filechip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:var(--bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}

/* ---- duyuru önizleme ---- */
.annprev{border-radius:10px;padding:10px 14px;text-align:center;font-weight:600;color:#fff;background:linear-gradient(90deg,#c4202e,#ff5f8f);min-height:42px;overflow-wrap:anywhere}
.annprev.off{opacity:.4}

/* ---- PPK ---- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.ppk{width:100%;border-collapse:collapse;min-width:560px}
table.ppk th{font-size:13px;text-align:left;color:var(--mut);padding:9px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
table.ppk td{padding:6px;border-bottom:1px solid var(--line)}
table.ppk tr:last-child td{border-bottom:0}
table.ppk input{min-height:36px;padding:6px 9px}
.bignum{font:700 54px/1 var(--serif);letter-spacing:-.02em}

/* ---- metinler ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:2 1 220px}
.toolbar select{flex:1 1 200px}
.tx{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}
.tx.chg{border-left-color:#e8741f}
.tx .meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut)}
.tx textarea{min-height:40px;resize:vertical}
.grouph{font:700 18px var(--serif);margin:22px 0 10px}
.bk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.bk.hid{opacity:.6}


/* ---- sayfa düzenleyici (Mülakat, Makale) ---- */
.pe-bar{position:sticky;top:58px;z-index:10;background:var(--bg);padding:10px 0 12px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.pe-bar .row input[type=search]{flex:1 1 200px}
.pe-stat{font-size:13.5px;color:var(--mut)}
.pe-jump{display:flex;gap:6px;flex-wrap:wrap}
.pe-jump button{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pe-jump button:hover{background:var(--soft)}
.pe-jump button .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e8741f;margin-left:6px}
details.acc{background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font:700 18px var(--serif)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"▸";font:600 14px var(--sans);color:var(--mut);transition:transform .15s}
details.acc[open]>summary::before{transform:rotate(90deg)}
details.acc>summary .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.acc>summary .cn{font:500 13px var(--sans);color:var(--mut)}
details.acc>summary .dot{margin-left:2px}
details.acc[open]>summary{border-bottom:1px solid var(--line);background:var(--bg)}
.acc-body{padding:14px 16px;display:grid;gap:14px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--surf)}
.pcard.plain{border:0;padding:0}
.pcard-h{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.pf{display:grid;gap:4px}
.pf>label{font-size:13px;font-weight:600;color:var(--mut);display:flex;justify-content:space-between;gap:8px;align-items:center}
.pf textarea{min-height:40px;overflow:hidden;resize:none}
.pf.chg textarea{border-color:#e8741f;box-shadow:inset 3px 0 0 #e8741f}
.pf.title textarea{font-weight:700}
.pf .rv{font-size:12.5px;padding:0 6px;min-height:24px}


.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs .btn[aria-pressed=true]{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.pe-jump button[aria-pressed=true]{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.rec-file{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.rec-grid{grid-template-columns:1fr}}
details.acc>summary .sub{font:500 13px var(--sans);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}

/* ---- bileşenler ---- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);padding:0;width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(8,12,28,.55)}
.dbody{padding:24px;display:grid;gap:14px;max-height:calc(100vh - 160px);overflow:auto}
.dbody h2{font-size:25px}
.dfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 14px 14px}
.probs{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.probs li{display:flex;gap:10px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pub);transition:width .25s}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(480px,calc(100vw - 24px))}
.toast{background:var(--ink);color:var(--surf);border-radius:10px;padding:11px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.skel{height:64px;border-radius:10px;background:linear-gradient(90deg,var(--soft),var(--bg),var(--soft));background-size:200% 100%;animation:sk 1.3s linear infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---- dar ekran ---- */
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:60;transform:translateX(-104%);visibility:hidden;transition:transform .2s,visibility 0s .2s;box-shadow:none}
  #rail.open{transform:none;visibility:visible;transition:transform .2s,visibility 0s;box-shadow:0 0 50px rgba(0,0,0,.4)}
  #scrim.on{display:block;position:fixed;inset:0;background:rgba(8,12,28,.5);z-index:55}
  #menuBtn{display:inline-flex}
  #top{padding:10px 14px}
  #main{padding:18px 14px 90px}
  .pagehead h2{font-size:26px}
  .split{grid-template-columns:1fr}
  .listcol{position:static;max-height:none}
  .split[data-mode=list] .detail{display:none}
  .split[data-mode=detail] .listcol{display:none}
  .backbtn{display:inline-flex}
  .grid2{grid-template-columns:1fr}
  .bk{grid-template-columns:1fr}
  .publbl{display:none}
  #pubShort{display:inline}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pub);border-radius:99px}
.opt{display:grid;gap:6px;margin-bottom:12px}
.orow{display:flex;gap:8px;margin-bottom:8px}.orow input{flex:1;min-width:0}
</style>
</head>
<body>

<div id="login" hidden></div>

<div id="app" hidden>
  <aside id="rail" aria-label="Bölümler">
    <div class="brand"><b>Eko-Log</b><span>Yayın masası</span></div>
    <nav class="menu" id="menu"></nav>
    <div class="railfoot">
      <div class="conn"><i></i><span id="connTxt">Bağlı</span></div>
      <span id="railState"></span>
    </div>
  </aside>
  <div id="scrim"></div>
  <div id="stage">
    <header id="top">
      <button class="btn sm" id="menuBtn" type="button" aria-label="Menüyü aç">Menü</button>

    else if(k==='text')el.textContent=v;

}

function detectRepo(){

  if(host.endsWith('.github.io')){

    return{owner:o,repo:(first&&!/\.[a-z0-9]+$/i.test(first))?first:o+'.github.io',branch:'main'};

}

async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,1200/Math.max(img.naturalWidth,1)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',.82),path='images/'+uid()+'.jpg';
    S.pending.set(path,{b64:data.split(',')[1]});S.preview.set(path,data);
    return path;
  }finally{URL.revokeObjectURL(url)}
}
function processPdf(file){
  return new Promise((ok,no)=>{
    if(file.size>50*1024*1024)return no(new Error('big'));
    const r=new FileReader();
    r.onload=()=>{const path='pdf/'+uid()+'.pdf';S.pending.set(path,{b64:String(r.result).split(',')[1]});ok(path)};
    r.onerror=no;r.readAsDataURL(file);
  });
}

const SEC={ozellik:w=>w.ft,banner:w=>w.b,n:w=>w.n,dg:w=>w.dg,e:w=>w.e,fme:w=>w.fme,archive:w=>w.c.archive,gallery:w=>w.c.gallery,texts:w=>w.t,blocks:w=>[w.d,w.i],sozluk:w=>w.sz,meslek:w=>w.ms,pmeslek:w=>[w.show.kt],ex:w=>[w.ex,w.show.ex],gs:w=>[w.gs,w.show.gs],hk:w=>w.hk,ka:w=>w.ka,se:w=>w.se,ansiklopedi:w=>[w.sz,w.ka,w.se,w.ki,w.kb],ki:w=>w.ki,kb:w=>w.kb,yb:w=>w.yb,sims:w=>Object.keys(w.i).filter(k=>k.startsWith('sim-')).sort().map(k=>[k,w.i[k]]),fb:w=>w.fb,links:w=>[w.w,w.ig,w.li],xplus:w=>w.xp,etkpg:w=>[w.pg,w.yb.on],xptakvim:w=>w.xt,fm:w=>w.fm};
function diffList(a,b){
  const am=new Map(a.map(x=>[String(x.id),x])),bm=new Map(b.map(x=>[String(x.id),x]));
  return{add:b.filter(x=>!am.has(String(x.id))),del:a.filter(x=>!bm.has(String(x.id))),
    edit:b.filter(x=>am.has(String(x.id))&&!same(am.get(String(x.id)),x)),
    moved:a.filter(x=>bm.has(String(x.id))).map(x=>x.id).join()!==b.filter(x=>am.has(String(x.id))).map(x=>x.id).join()};
}
function summarize(){
  if(!S.remote||!S.work)return[];
  const a=S.remote.data,b=S.work,out=[];
  const nm=(C,x)=>'“'+((C.label(x)||'').trim()||'başlıksız')+'”';
  for(const k of['n','dg','e','fme','archive','gallery']){
    const C=COLS[k],d=diffList(C.get(a),C.get(b));
    const push=(arr,verb)=>{arr.slice(0,5).forEach(x=>out.push(`${C.noun} ${verb}: ${nm(C,x)}`));if(arr.length>5)out.push(`${C.noun} ${verb}: ${arr.length-5} kayıt daha`)};
    push(d.add,'eklendi');push(d.edit,'düzenlendi');push(d.del,'silindi');
    if(d.moved)out.push(`${C.title} sırası değişti`);
  }
  if(a.b.on!==b.b.on)out.push(b.b.on?'Duyuru şeridi açıldı':'Duyuru şeridi kapatıldı');
  if(a.b.text!==b.b.text)out.push('Duyuru metni değişti');
  const tk=new Set([...Object.keys(a.t),...Object.keys(b.t)]);let tc=0;tk.forEach(k=>{if(a.t[k]!==b.t[k])tc++});
  if(tc)out.push(`${tc} site metni değişti`);
  [['w','WhatsApp grup bağlantısı'],['ig','Instagram bağlantısı'],['li','LinkedIn bağlantısı']].forEach(([k,n])=>{if(a[k]!==b[k])out.push(n+' değişti')});
  const hid=b.d.filter(x=>!a.d.includes(x)).length,shown=a.d.filter(x=>!b.d.includes(x)).length;
  if(hid)out.push(`${hid} örnek içerik gizlendi`);if(shown)out.push(`${shown} örnek içerik yeniden gösterilecek`);
  const sk=o=>JSON.stringify(Object.keys(o).filter(k=>k.startsWith('sim-')).sort().map(k=>[k,o[k]])),ok=o=>JSON.stringify(Object.keys(o).filter(k=>!k.startsWith('sim-')).sort().map(k=>[k,o[k]]));
  if(sk(a.i)!==sk(b.i))out.push('Simülasyon fotoğrafları değişti');
  if(ok(a.i)!==ok(b.i))out.push('Örnek içerik fotoğrafları değişti');
  if(!same(a.fb,b.fb))out.push('Yorum ve katılım veritabanı ayarları değişti');
  {const d=diffList(a.xt,b.xt),nm=x=>'“'+((x.title||'').trim()||'başlıksız')+'”';
   d.add.slice(0,5).forEach(x=>out.push('Resmî sınav tarihi eklendi: '+nm(x)));d.edit.slice(0,5).forEach(x=>out.push('Resmî sınav tarihi düzenlendi: '+nm(x)));d.del.slice(0,5).forEach(x=>out.push('Resmî sınav tarihi silindi: '+nm(x)));}
  XP_IDS.forEach(k=>{if(a.xp[k]!==b.xp[k])out.push('Eko-Plus “'+XP_NAME[k]+'” sayfası '+(b.xp[k]?'sitede açılacak':'sitede kapatılacak'))});
  FT_IDS.forEach(k=>{if((a.ft||{})[k]!==(b.ft||{})[k])out.push('Özellik “'+FT_NAME[k]+'” '+((b.ft||{})[k]?'sitede açılacak':'sitede kapatılacak'))});
  EV_IDS.forEach(k=>{if(a.pg[k]!==b.pg[k])out.push('Etkinlikler “'+EV_NAME[k]+'” sayfası '+(b.pg[k]?'sitede açılacak':'sitede kapatılacak'))});
  custDiff(out,'Fikir Muharebesi iddiası',a.fm,b.fm,x=>x.c);
  custDiff(out,'İktisat düşünürü',a.ki,b.ki,x=>x.ad);
  custDiff(out,'Kitaplık kaydı',a.kb,b.kb,x=>x.t);
  if(!same(a.yb,b.yb))out.push('Yatay Bakış sayfası '+(a.yb.on!==b.yb.on?(b.yb.on?'açıldı':'kapatıldı'):'düzenlendi'));
  if(!same(a.fm.pin,b.fm.pin))out.push('Fikir Muharebesi: haftalık iddia seçimi değişti');
  custDiff(out,'Sözlük terimi',a.sz,b.sz,x=>x.t);
  custDiff(out,'Meslek kadrosu',a.ms,b.ms,x=>x.title);
  if(a.show.ex!==b.show.ex)out.push(b.show.ex?'Sınav takvimi sitede gösterilecek':'Sınav takvimi sitede gizlenecek');
  if(a.show.gs!==b.show.gs)out.push(b.show.gs?'Ekonomi göstergeleri sitede gösterilecek':'Ekonomi göstergeleri sitede gizlenecek');
  if(a.show.kt!==b.show.kt)out.push(b.show.kt?'Meslek sayfasında “Sana uygun kadroyu bul” testi açılacak':'Meslek sayfasında “Sana uygun kadroyu bul” testi kapatılacak');
  custDiff(out,'Sınav takvimi kaydı',a.ex,b.ex,x=>x.ad);
  custDiff(out,'Gösterge',a.gs,b.gs,x=>x.ad);
  custDiff(out,'Hukukçu kariyer alanı',a.hk,b.hk,x=>x.ad);
  custDiff(out,'Kavramın anatomisi',a.ka,b.ka,x=>x.ad);
  custDiff(out,'Şehir efsanesi',a.se,b.se,x=>x.ad);
  if(!out.length&&!same(a,b))out.push('Diğer değişiklikler');
  return out;
}
const dirtySecs=()=>S.remote?Object.keys(SEC).filter(k=>!same(SEC[k](S.remote.data),SEC[k](S.work))):[];

/* ---------- doğrulama ---------- */
const MONTHS='ocak|şubat|mart|nisan|mayıs|haziran|temmuz|ağustos|eylül|ekim|kasım|aralık';
const calOK=s=>new RegExp('(\\d{1,2})\\s+('+MONTHS+')(?:\\s+(\\d{4}))?(?:[^\\d]+(\\d{1,2})[:.](\\d{2}))?').test(String(s||'').toLocaleLowerCase('tr'));
const EVRE=new RegExp('(\\d{1,2})\\s+('+MONTHS+')(?:\\s+(\\d{4}))?(?:[^\\d]+(\\d{1,2})[:.](\\d{2}))?');
const EVAY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function evParse(t){const m=String(t||'').toLocaleLowerCase('tr').match(EVRE);if(!m)return null;const mo=MONTHS.split('|').indexOf(m[2]),y=+m[3]||new Date().getFullYear(),hasT=m[4]!=null,day=+m[1];
  const d=new Date(y,mo,day,hasT?+m[4]:0,hasT?+m[5]:0);return{d,end:hasT?new Date(+d+72e5):new Date(y,mo,day,23,59,59),hasT,day,mo,y}}
function evStatus(t){const p=evParse(t);if(!p)return null;const n=new Date(),td=new Date(n.getFullYear(),n.getMonth(),n.getDate()),df=Math.round((new Date(p.y,p.mo,p.day)-td)/864e5);
  if(n>p.end)return{k:'past',t:'Sona erdi'};if(df<=0)return{k:'today',t:(p.hasT&&n>=p.d)?'Şu an devam ediyor':'Bugün'};
  return df===1?{k:'soon',t:'Yarın'}:{k:'soon',t:df+' gün kaldı'}}
const evShort=t=>{const p=evParse(t);return p?{day:String(p.day),mon:EVAY[p.mo]}:null};
const httpsOK=s=>!s||/^https:\/\/\S+$/.test(s);
function validate(){
  const w=S.work,p=[];
  for(const k of['n','dg','e','fme','archive','gallery']){
    const C=COLS[k];
    C.get(w).forEach(x=>{
      if(isBlank(k,x))return;
      const t=C.fields.find(f=>f.req);
      if(t&&!String(x[t.k]||'').trim())p.push({text:`${C.noun} kaydında ${t.l.toLowerCase()} boş`,view:k,id:x.id});
      else if(C.imgReq&&!x.img)p.push({text:`“${C.label(x)}” için fotoğraf seçilmemiş`,view:k,id:x.id});
    });
  }
  if(w.fb.db&&!dbOK(w.fb.db))p.push({text:'Veritabanı adresi geçersiz görünüyor',view:'settings'});
  if(w.b.on&&!w.b.text.trim())p.push({text:'Duyuru şeridi açık ama metni boş',view:'banner'});
  w.sz.add.forEach(x=>{if(!String(x.t||'').trim()||!String(x.d||'').trim())p.push({text:'Sözlükte terimi ya da tanımı boş bir kayıt var',view:'sozluk'})});
  w.ms.add.forEach(x=>{if(!String(x.title||'').trim())p.push({text:'Meslek tanıtımında kadro adı boş bir kayıt var',view:'meslek'});else if(String(x.url||'').trim()&&!httpsOK(x.url))p.push({text:'Kadro “'+x.title+'” bağlantısı https:// ile başlamalı',view:'meslek'})});
  Object.keys(w.ms.edit).forEach(k=>{const u=(w.ms.edit[k]||{}).url;if(u&&String(u).trim()&&!httpsOK(u))p.push({text:'Kadro “'+k+'” bağlantısı https:// ile başlamalı',view:'meslek'})});
  w.ex.add.forEach(x=>{if(!String(x.ad||'').trim()||!String(x.tarih||'').trim())p.push({text:'Sınav takviminde adı ya da tarihi eksik bir kayıt var',view:'ex'});else if(!httpsOK(x.url))p.push({text:'Sınav “'+x.ad+'” bağlantısı https:// ile başlamalı',view:'ex'})});
  w.xt.forEach(x=>{if(!String(x.title||'').trim()||!String(x.date||'').trim())p.push({text:'Resmî sınav takviminde başlığı ya da tarihi eksik bir kayıt var',view:'xptakvim'});else if(x.link&&!httpsOK(x.link))p.push({text:'Resmî tarih “'+x.title+'” bağlantısı https:// ile başlamalı',view:'xptakvim'})});
  w.hk.add.forEach(x=>{if(!String(x.ad||'').trim())p.push({text:'Hukukçu kariyer alanlarında başlığı boş bir kayıt var',view:'hk'})});
  (w.ka?w.ka.add:[]).forEach(x=>{if(!String(x.ad||'').trim())p.push({text:'Kavramın anatomisinde adı boş bir kayıt var',view:'ka'})});
  (w.se?w.se.add:[]).forEach(x=>{if(!String(x.ad||'').trim())p.push({text:'Şehir efsanelerinde başlığı boş bir kayıt var',view:'se'})});
  if(w.yb&&w.yb.link&&!httpsOK(w.yb.link))p.push({text:'Yatay Bakış bağlantısı https:// ile başlamalı',view:'yb'});
  (w.ki?w.ki.add:[]).forEach(x=>{if(!String(x.ad||'').trim())p.push({text:'İktisat Düşünürleri’nde adı boş bir kayıt var',view:'ki'})});
  (w.kb?w.kb.add:[]).forEach(x=>{if(!String(x.t||'').trim())p.push({text:'Kitaplık’ta başlığı boş bir kayıt var',view:'kb'})});
  (w.fm?w.fm.add:[]).forEach(x=>{if(!String(x.c||'').trim())p.push({text:'Fikir Muharebesi’nde iddia cümlesi boş bir kayıt var',view:'fm'})});
  Object.keys(w.fm?w.fm.edit:{}).forEach(k=>{if(String((w.fm.edit[k]||{}).c==null?'x':w.fm.edit[k].c).trim()==='')p.push({text:'Fikir Muharebesi’nde iddia cümlesi boş bırakılmış bir kayıt var',view:'fm'})});
  const apiOK=v=>!v||/^(kur:[A-Za-z]{3}|wb:[A-Za-z0-9._]+|json:\S+)$/.test(String(v).trim());
  [...w.gs.add,...Object.values(w.gs.edit)].forEach(x=>{if(!apiOK(x.api))p.push({text:'Gösterge “'+x.ad+'” canlı veri kaynağı biçimi yanlış (kur:USD, wb:KOD ya da json:adres#yol)',view:'gs'})});
  w.gs.add.forEach(x=>{if(!String(x.ad||'').trim())p.push({text:'Göstergelerde adı boş bir kayıt var',view:'gs'});else if(!httpsOK(x.url))p.push({text:'Gösterge “'+x.ad+'” bağlantısı https:// ile başlamalı',view:'gs'})});

  return p;
}

function addItem(key){

  S.sel[key]=it.id;S.mode[key]='detail';
  if(S.view!==key){location.hash='#/'+key;S.mode[key]='detail'}else render();

function mediaField(item,field,onPick){
  const box=h('div',{class:'media'});
  const draw=()=>{
    box.replaceChildren();const p=item[field];
    const pick=async()=>{
      const f=await chooseFile('image/*');if(!f)return;
      try{item[field]=await processImage(f);draw();touch();onPick&&onPick()}

        h('button',{class:'btn sm ghost',type:'button',onclick:()=>{item[field]='';draw();touch();onPick&&onPick()},text:'Kaldır'})));}
    else box.append(h('div',{class:'mempty',text:'Fotoğraf yok'}),h('button',{class:'btn sm',type:'button',onclick:pick,text:'Fotoğraf seç'}));

}
function imgsField(item,onChange){

        h('button',{class:'btn sm',type:'button',disabled:i===0,title:'Öne al',onclick:()=>{const b=a.slice();[b[i-1],b[i]]=[b[i],b[i-1]];set(b)},text:'←'}),
        h('button',{class:'btn sm',type:'button',disabled:i===a.length-1,title:'Sona al',onclick:()=>{const b=a.slice();[b[i+1],b[i]]=[b[i],b[i+1]];set(b)},text:'→'}),
        h('button',{class:'btn sm ghost',type:'button',title:'Kaldır',onclick:()=>{set(a.filter((_,j)=>j!==i))},text:'✕'})))));
    if(!a.length)gal.append(h('div',{class:'mempty',text:'Ek fotoğraf yok'}));
  };
  const add=h('button',{class:'btn sm',type:'button',text:'+ Fotoğraf ekle',onclick:()=>{

function collView(key){

        h('span',{class:'chip warn',text:'Tarih okunamadı. “15 Kasım 2026 18:30” gibi yazarsan takvim düğmesi ve durum etiketi çıkar.'}))};

      (key==='e'||key==='dg'||key==='n')?h('button',{class:'btn sm',type:'button',text:'Yorumları gör',onclick:()=>{S.cmtPre=(key==='e'?'e':key==='dg'?'d':'n')+item.id;go('comments')}}):null,

    detail.append(panel);
  }
  root.append(detail);wrap.append(root);return wrap;
}

const fmtTs=t=>{try{return new Date(t).toLocaleString('tr-TR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};

function fbGate(title,desc,build){
  const root=h('div',{class:'stack'},pageHead(title,desc));
  if(!FB.ok()){
    root.append(h('div',{class:'empty'},h('b',{text:'Veritabanı henüz bağlı değil'}),
      h('span',{text:'Yorumlar ve katılım kayıtları ücretsiz bir Firebase veritabanında tutulur. Ayarlar sayfasındaki adımlarla bir kez kurman yeterli.'}),
      h('a',{class:'btn solid',href:'#/settings',text:'Kurulum adımlarına git'})));
    return root;
  }
  if(!FB.sess()){
    const em=h('input',{type:'text',id:'fbe',autocomplete:'username',value:FB.email(),inputmode:'email'});
    const pw=h('input',{type:'password',id:'fbp',autocomplete:'current-password'});
    const err=h('div',{class:'err',role:'alert',hidden:true});
    const go=h('button',{class:'btn solid',type:'submit',text:'Giriş yap'});
    const f=h('form',{class:'panel stack',novalidate:true,style:'max-width:460px'},
      h('h3',{text:'Yönetici girişi'}),
      h('p',{class:'mut',text:'Bu bilgiler yalnızca veritabanında açtığın yönetici hesabıdır (GitHub anahtarından ayrıdır). Oturum bu sekme kapanınca biter.'}),
      err,h('div',{class:'fld',style:'margin:0'},h('label',{for:'fbe',text:'E-posta'}),em),
      h('div',{class:'fld',style:'margin:0'},h('label',{for:'fbp',text:'Parola'}),pw),go);
    f.addEventListener('submit',async e=>{
      e.preventDefault();if(!em.value.trim()||!pw.value){err.hidden=false;err.textContent='E-posta ve parolayı yaz.';return}
      go.disabled=true;go.textContent='Giriş yapılıyor…';err.hidden=true;
      try{await FB.signIn(em.value.trim(),pw.value);render()}
      catch(x){err.hidden=false;err.textContent=x.message;go.disabled=false;go.textContent='Giriş yap'}
    });
    root.append(f);return root;
  }
  const out=h('div',{class:'row'},h('span',{class:'chip ok',text:'Yönetici: '+(FB.sess().email||'')}),
    h('button',{class:'btn sm ghost',type:'button',text:'Oturumu kapat',onclick:()=>{FB.out();render()}}));
  root.append(out);
  build(root);
  return root;
}
function dbFail0(box,e,retry){
  if(e&&e.message==='auth'){FB.out();render();return}
  box.replaceChildren(h('div',{class:'empty'},h('b',{text:e&&e.message==='perm'?'Erişim reddedildi':'Veriler alınamadı'}),
    h('span',{text:e&&e.message==='perm'?'Veritabanı kuralları bu hesabı tanımıyor. Ayarlar sayfasındaki kuralları yapıştırdığından ve kural içindeki e-postanın giriş yaptığın e-postayla aynı olduğundan emin ol.':(e&&e.message)||'Bağlantı hatası.'}),
    h('button',{class:'btn solid',type:'button',onclick:retry,text:'Tekrar dene'})));
}

async function postTitles(){
  const t={};
  S.work.n.forEach(x=>{t['n'+x.id]=x.title||'(başlıksız haber)'});
  (S.work.dg||[]).forEach(x=>{t['d'+x.id]=x.title||'(başlıksız dergi yazısı)'});
  (S.work.e||[]).forEach(x=>{t['e'+x.id]='Etkinlik · '+(x.title||'(başlıksız etkinlik)')});
  t['yb-oneri']='Yatay Bakış · Yorum/Öneri';t['fm-oneri']='Fikir Muharebesi · Yorum/Öneri';
  try{const site=await loadSite();site.blocks.forEach(b=>{const k=b.titleK&&S.work.t[b.titleK]!==undefined?S.work.t[b.titleK]:b.title;if(k)t[b.id]=k})}catch(e){}
  return t;
}

const csvCell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
function downloadCsv(name,rows){
  const head=['Etkinlik','Tarih','Yer','Ad soyad','Bölüm','Sınıf','İletişim','Kayıt zamanı'];
  const body=rows.map(r=>[r.et,r.ed,r.ep,r.n,r.b,r.s,r.c,fmtTs(r.d)].map(csvCell).join(';'));
  const blob=new Blob(['﻿'+[head.map(csvCell).join(';'),...body].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- Yeni düzenleyici: Mülakat ve Makale ---------- */
function pageEditorV2(page,title,desc,labels){
  return withSite(site=>{
    const root=h('div',{class:'stack'},pageHead(title,desc));
    const all=site.texts.filter(t=>t.page===page&&!t.crumb);
    if(!all.length){root.append(h('div',{class:'empty'},h('b',{text:'Bu sayfada düzenlenecek metin bulunamadı'})));return root}
    const L=Object.assign({H2:'Sayfa başlığı',H3:'Bölüm başlığı',H4:'Başlık',P:'Açıklama',LABEL:'Form alanı adı',B:'Vurgulu metin',SPAN:'Metin',BUTTON:'Düğme yazısı',A:'Düğme yazısı',OPTION:'Seçenek',LI:'Madde'},labels||{});
    const cur=t=>S.work.t[t.k]!==undefined?S.work.t[t.k]:t.orig;
    const isCh=t=>S.work.t[t.k]!==undefined&&S.work.t[t.k]!==t.orig;
    // bölümler
    const secs=[];all.forEach(t=>{const nm=t.sec&&t.sec!=='Sayfa başlığı alanı'?t.sec:(t.sec==='Sayfa başlığı alanı'?'Sayfa üst kısmı':'Sayfa içeriği');
      let s2=secs[secs.length-1];if(!s2||s2.name!==nm){s2={name:nm,items:[]};secs.push(s2)}s2.items.push(t)});
    // kartlar: her H4 yeni kart başlatır
    secs.forEach(sc=>{sc.cards=[];let c=null;sc.items.forEach(t=>{
      if(t.tag==='H4'||!c){c={title:t.tag==='H4'?t:null,items:[]};sc.cards.push(c)}

    const st={q:'',only:false};
    const bar=h('div',{class:'pe-bar'});

    const stat=h('span',{class:'pe-stat'});
    const jump=h('div',{class:'pe-jump'});
    bar.append(h('div',{class:'row'},q,h('label',{class:'switch',style:'font-weight:500;font-size:14px'},onlyC,h('span',{class:'tr'}),'Sadece değişenler'),
      h('a',{class:'btn sm',href:'index.html#/'+page,target:'_blank',rel:'noopener',text:'Sitede aç ↗'})),stat,jump);
    const list=h('div');
    root.append(bar,list);
    const counters=[];
    function field(t,nth,tot){
      const ta=h('textarea',{rows:1,'aria-label':L[t.tag]||'Metin'});ta.value=cur(t);
      const fit=()=>{ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px'};
      const box=h('div',{class:'pf'+(t.tag==='H2'||t.tag==='H3'?' title':'')+(isCh(t)?' chg':'')});
      const rv=h('button',{class:'btn ghost rv',type:'button',text:'↺ Geri al',hidden:!isCh(t),onclick:()=>{delete S.work.t[t.k];ta.value=t.orig;fit();sync();touch()}});
      const sync=()=>{box.classList.toggle('chg',isCh(t));rv.hidden=!isCh(t);upd()};
      ta.addEventListener('input',()=>{if(ta.value===t.orig)delete S.work.t[t.k];else S.work.t[t.k]=ta.value;fit();sync();touch()});
      const name=(L[t.tag]||'Metin')+(tot>1&&!(t.tag==='H2'||t.tag==='H3')?' '+nth:'');
      box.append(h('label',null,h('span',{text:name}),rv),ta);
      setTimeout(fit,0);
      t._box=box;return box;
    }
    function draw(){
      list.replaceChildren();jump.replaceChildren();counters.length=0;
      const qq=st.q.trim().toLocaleLowerCase('tr');let shown=0;
      secs.forEach((sc,si)=>{
        const match=t=>(!st.only||isCh(t))&&(!qq||cur(t).toLocaleLowerCase('tr').includes(qq)||t.orig.toLocaleLowerCase('tr').includes(qq));
        const vis=sc.items.filter(match);
        if((qq||st.only)&&!vis.length)return;
        shown+=vis.length;
        const cnt=h('span',{class:'cn'}),dot=h('i',{class:'dot',title:'Değişiklik var'});
        const det=h('details',{class:'acc',id:'sec_'+page+'_'+si},h('summary',null,h('span',{class:'grow',text:sc.name}),cnt,dot));
        const body=h('div',{class:'acc-body'});

          const seen={};

            card.append(field(t,seen[t.tag],tot)); });
          body.append(card);
        });
        det.append(body);
        const upd=()=>{const ch=sc.items.filter(isCh).length;cnt.textContent=sc.items.length+' yazı'+(ch?' · '+ch+' değişti':'');dot.hidden=!ch;const jb=jump.children[si];};
        counters.push(upd);upd();
        if(qq||st.only||secs.length===1)det.open=true;
        list.append(det);
        const jb=h('button',{type:'button',onclick:()=>{det.open=true;det.scrollIntoView({behavior:'smooth',block:'start'})}},sc.name);
        sc._jb=jb;jump.append(jb);
      });
      if(!list.children.length)list.append(h('div',{class:'empty'},h('b',{text:'Eşleşen yazı yok'}),h('span',{text:'Aramayı değiştir ya da “Sadece değişenler”i kapat.'})));

    }

    onlyC.addEventListener('change',()=>{st.only=onlyC.checked;draw()});
    draw();
    return root;
  });
}

/* ---------- Sözlük ve Meslek tanıtımı: ekle, düzenle, sil ---------- */
const SZCAT={h:'Hukuk',a:'Muhasebe ve Denetim',e:'İstatistik ve Ekonometri',d:'Dijital Ekonomi',m:'Makroekonomi',p:'Para ve Finans',u:'Uluslararası',k:'Kamu Maliyesi',i:'Mikroekonomi',b:'Büyüme ve Kalkınma',t:'Türkiye',j:'İşletme',f:'Maliye',r:'Uluslararası İlişkiler',y:'Kamu Yönetimi',s:'Siyaset Bilimi',w:'Çalışma Ekonomisi',o:'Olaylar ve Krizler'};
const MSTAG={iktisat:'İktisat',isletme:'İşletme',maliye:'Maliye',ky:'Kamu Yönetimi',ui:'Uluslararası İlişkiler',sb:'Siyaset Bilimi',calisma:'Çalışma Ekonomisi ve Endüstri İlişkileri',ekonometri:'Ekonometri',finans:'Finans / Bankacılık',hukuk:'Hukuk'};
function custDiff(out,noun,A,B,nm){
  const am=new Map(A.add.map(x=>[x.id,x])),bm=new Map(B.add.map(x=>[x.id,x]));
  const added=B.add.filter(x=>!am.has(x.id)),removed=A.add.filter(x=>!bm.has(x.id)),changed=B.add.filter(x=>am.has(x.id)&&!same(am.get(x.id),x));
  const dl=B.del.filter(x=>!A.del.includes(x)),rs=A.del.filter(x=>!B.del.includes(x));
  let ec=0;new Set([...Object.keys(A.edit),...Object.keys(B.edit)]).forEach(k=>{if(!same(A.edit[k],B.edit[k]))ec++});
  const q=x=>'“'+((nm(x)||'').trim()||'adsız')+'”',qs=x=>'“'+x+'”';
  const push=(arr,verb,f)=>{arr.slice(0,5).forEach(x=>out.push(`${noun} ${verb}: ${f(x)}`));if(arr.length>5)out.push(`${noun} ${verb}: ${arr.length-5} kayıt daha`)};
  push(added,'eklendi',q);push(removed,'kaldırıldı',q);push(dl,'silindi',qs);push(rs,'geri getirildi',qs);
  if(changed.length+ec)out.push(`${changed.length+ec} ${noun.toLowerCase()} düzenlendi`);
}
function custField(f,obj,idp,onch){
  const id=`${idp}_${f.k}`,fire=()=>{onch&&onch();touch()};
  let ctl,extra=null;
  if(f.tags){
    ctl=h('div',{class:'row',style:'gap:8px 14px'},Object.entries(f.tags).map(([k,l])=>{
      const cb=h('input',{type:'checkbox',checked:(obj[f.k]||[]).includes(k),'aria-label':l});
      cb.addEventListener('change',()=>{const s=new Set(obj[f.k]||[]);cb.checked?s.add(k):s.delete(k);obj[f.k]=Object.keys(f.tags).filter(x=>s.has(x));fire()});
      return h('label',{class:'row',style:'gap:6px;cursor:pointer;font-weight:500'},cb,h('span',{text:l}));
    }));
  }else if(f.photo){
    ctl=mediaField(obj,f.k,fire);
  }else if(f.select){
    ctl=h('select',{id});Object.entries(f.select).forEach(([k,l])=>ctl.append(h('option',{value:k,text:l})));ctl.value=obj[f.k]||Object.keys(f.select)[0];
    ctl.addEventListener('change',()=>{obj[f.k]=ctl.value;fire()});
  }else{
    ctl=f.area?h('textarea',{id,rows:f.rows||4,placeholder:f.ph||''}):h('input',{type:f.date?'date':'text',id,autocomplete:'off',placeholder:f.ph||''});
    ctl.value=obj[f.k]||'';ctl.addEventListener('input',()=>{obj[f.k]=ctl.value;fire()});
  }
  return h('div',{class:'fld'},(f.tags||f.photo)?h('span',{class:'lab',text:f.l}):h('label',{for:id,text:f.l+(f.req?' *':'')}),ctl,f.hint?h('span',{class:'hint',text:f.hint}):null);
}
function customView(cfg){
  return withSite(site=>{
    const o=S.work[cfg.store],base=cfg.base(site);
    S.cv=S.cv||{};const V=S.cv[cfg.store]=S.cv[cfg.store]||{q:'',cat:'',editing:null,w:null,limit:40};
    const root=h('div',{class:'stack'},pageHead(cfg.title,cfg.desc));
    if(!base.length&&!cfg.noBase)root.append(h('div',{class:'hint',text:'Not: sitedeki hazır liste okunamadı; yalnızca eklediklerin yönetilebilir. admin.html ile index.html aynı klasörde olmalı.'}));

    const draft=cfg.blank();
    const addP=h('div',{class:'panel'},h('h3',{text:cfg.addTitle}));
    cfg.fields.forEach(f=>addP.append(custField(f,draft,'new_'+cfg.store)));
    addP.append(h('div',{class:'actions'},h('button',{class:'btn solid',type:'button',text:'+ '+cfg.addBtn,onclick:()=>{
      if(cfg.req.some(k=>!String(draft[k]||'').trim())){toast(cfg.reqMsg);return}
      const nm=String(draft[cfg.nameKey]).trim().toLocaleLowerCase('tr');
      if(cfg.dupCheck&&items().some(it=>String(it.cur[cfg.nameKey]||'').trim().toLocaleLowerCase('tr')===nm)){toast('Bu ad zaten listede var.');return}
      o.add.unshift(Object.assign({id:uid()},clone(draft)));
      V.q='';V.cat='';render();toast(cfg.noun+' eklendi. Yayınlayana kadar sitede görünmez.');
    }})));
    root.append(addP);

    const keyOf=x=>cfg.bkey(x);
    function items(){
      const del=new Set(o.del);
      return[...o.add.map(x=>({kind:'add',key:x.id,cur:x})),
        ...base.filter(x=>!del.has(keyOf(x))).map(x=>{const k=keyOf(x),orig=cfg.bobj(x);return{kind:'base',key:k,orig,cur:Object.assign({},orig,o.edit[k]||{}),edited:!!o.edit[k]}})];
    }
    const q=h('input',{type:'search',placeholder:cfg.searchPh,value:V.q,'aria-label':'Ara'});
    const sel=cfg.cats?h('select',{'aria-label':'Kategori'},h('option',{value:'',text:'Tüm kategoriler'}),Object.entries(cfg.cats).map(([k,l])=>h('option',{value:k,text:l}))):null;
    if(sel)sel.value=V.cat;
    const list=h('div'),stat=h('p',{class:'hint'}),delBox=h('details',{class:'how'});
    function drawList(){
      list.replaceChildren();
      const qq=V.q.trim().toLocaleLowerCase('tr');
      const all=items(),rows=all.filter(it=>(!V.cat||it.cur.c===V.cat)&&(!qq||cfg.search(it.cur).toLocaleLowerCase('tr').includes(qq)));
      stat.textContent=`${rows.length} ${cfg.noun.toLowerCase()} gösteriliyor, toplam ${all.length}.`;
      rows.slice(0,V.limit).forEach(it=>list.append(row(it)));
      if(!rows.length)list.append(h('div',{class:'empty'},h('b',{text:'Eşleşen kayıt yok'}),h('span',{text:'Aramayı ya da kategoriyi değiştir.'})));
      if(rows.length>V.limit)list.append(h('button',{class:'btn',type:'button',text:`Daha fazla göster (${rows.length-V.limit})`,onclick:()=>{V.limit+=40;drawList()}}));
      drawDel();
    }
    function drawDel(){
      delBox.replaceChildren();const dl=o.del;delBox.hidden=!dl.length;
      if(!dl.length)return;
      delBox.append(h('summary',{text:`Silinenler (${dl.length}), geri getirebilirsin`}),
        h('div',{class:'stack',style:'margin-top:10px'},dl.map(k=>h('div',{class:'row',style:'justify-content:space-between;flex-wrap:nowrap'},
          h('span',{text:cfg.delLabel(k),style:'min-width:0;overflow-wrap:anywhere'}),
          h('button',{class:'btn sm',type:'button',text:'Geri getir',onclick:()=>{o.del=o.del.filter(x=>x!==k);touch();drawList()}})))));
    }
    function row(it){
      const c=it.cur,isEd=V.editing===it.key;
      if(isEd){
        const obj=it.kind==='add'?c:V.w;
        const onch=()=>{if(it.kind==='base'){if(same(obj,it.orig))delete o.edit[it.key];else o.edit[it.key]=clone(obj)}};
        const p=h('div',{class:'panel',style:'border-color:var(--navy)'},h('h3',{text:cfg.noun+' düzenle'}));
        cfg.fields.forEach(f=>p.append(custField(f,obj,'ed_'+cfg.store,onch)));
        p.append(h('div',{class:'actions'},
          h('button',{class:'btn solid',type:'button',text:'Bitti',onclick:()=>{V.editing=null;drawList()}}),
          it.kind==='base'&&it.edited?h('button',{class:'btn ghost',type:'button',text:'Orijinale döndür',onclick:()=>{delete o.edit[it.key];V.editing=null;touch();drawList()}}):null,
          h('span',{style:'flex:1'}),
          h('button',{class:'btn danger',type:'button',text:cfg.noun+' sil',onclick:()=>remove(it)})));
        return p;
      }
      return h('div',{class:'tx'+(it.kind==='add'||it.edited?' chg':'')},
        h('div',{class:'meta'},h('span',{text:cfg.sub(c)}),cfg.hideKey?h('span',{class:'chip '+(c.gizli?'warn':'ok'),text:c.gizli?'Gizli':'Yayında'}):null,it.kind==='add'?h('span',{class:'chip ok',text:'Yeni'}):(it.edited?h('span',{class:'chip warn',text:'Düzenlendi'}):null)),
        h('div',null,h('b',{text:cfg.name(c)||'(adsız)'})),
        h('p',{class:'mut',style:'overflow-wrap:anywhere',text:cfg.blurb(c)}),
        h('div',{class:'actions'},
          cfg.hideKey?h('button',{class:'btn sm '+(c.gizli?'solid':''),type:'button',text:c.gizli?'Yayınla':'Yayından kaldır',onclick:()=>{setHid(it,!c.gizli);touch();drawList();toast(c.gizli?'Gösterge gizlendi. Siteyi yayınlayınca etkili olur.':'Gösterge yayında. Siteyi yayınlayınca etkili olur.')}}):null,
          h('button',{class:'btn sm',type:'button',text:'Düzenle',onclick:()=>{V.editing=it.key;V.w=clone(it.cur);drawList()}}),
          h('button',{class:'btn sm ghost danger',type:'button',text:'Sil',onclick:()=>remove(it)})));
    }
    function remove(it){
      if(V.editing===it.key)V.editing=null;
      if(it.kind==='add'){
        const i=o.add.findIndex(x=>x.id===it.key),gone=o.add.splice(i,1)[0];touch();drawList();
        toast(cfg.noun+' silindi.',{label:'Geri al',fn:()=>{o.add.splice(i,0,gone);touch();drawList()}});
      }else{
        const prev=o.edit[it.key];o.del.push(it.key);delete o.edit[it.key];touch();drawList();
        toast(cfg.noun+' silindi. Yayınlayana kadar sitede kalır.',{label:'Geri al',fn:()=>{o.del=o.del.filter(x=>x!==it.key);if(prev)o.edit[it.key]=prev;touch();drawList()}});
      }
    }
    q.addEventListener('input',()=>{V.q=q.value;V.limit=40;drawList()});
    if(sel)sel.addEventListener('change',()=>{V.cat=sel.value;V.limit=40;drawList()});
    function setHid(it,hid){
      if(it.kind==='add'){it.cur.gizli=hid;return}
      const e=Object.assign({},it.cur,{gizli:hid});
      if(same(e,it.orig))delete o.edit[it.key];else o.edit[it.key]=clone(e);
    }
    if(cfg.hideKey){
      const bulk=v=>{items().forEach(it=>setHid(it,!v));if(v)S.work.show[cfg.store]=true;touch();drawList();toast(v?'Tüm göstergeler yayına alındı. Siteyi yayınlayınca etkili olur.':'Tüm göstergeler gizlendi. Siteyi yayınlayınca etkili olur.')};
      root.append(h('div',{class:'panel'},h('h3',{text:'Toplu işlem'}),h('div',{class:'actions'},
        h('button',{class:'btn solid',type:'button',text:'Hepsini yayınla',onclick:()=>bulk(true)}),
        h('button',{class:'btn',type:'button',text:'Hepsini yayından kaldır',onclick:()=>bulk(false)})),
        h('p',{class:'hint',text:'Gizlenen göstergeler sitede görünmez, verileri silinmez. Her göstergenin kendi düğmesiyle tek tek de açıp kapatabilirsin.'})));
    }
    root.append(h('div',{class:'toolbar'},q,sel),stat,list,delBox);
    drawList();
    if(cfg.top)root.children[0].after(cfg.top({items,rerender:()=>render()}));
    return root;
  });
}

const fmFd=ms=>new Date(ms).toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
const fmRange=w=>{const t=(w*7-3)*864e5;return fmFd(t)+' – '+fmFd(t+6*864e5)};
/* Sitedeki sırayla aynı: hazır iddialar (silinenler hariç, düzenlemeler uygulanmış), ardından eklenenler (eskiden yeniye) */
function fmEff(site){
  const o=S.work.fm,del=new Set(o.del),L=[];
  ((site&&site.fm)||[]).forEach(t=>{if(del.has(t.id))return;const e=o.edit[t.id]||{};
    L.push({id:t.id,c:e.c!=null?e.c:t.c,x:e.x!=null?e.x:t.x,ys:e.ys!=null?e.ys:t.ys,ns:e.ns!=null?e.ns:t.ns})});
  o.add.slice().reverse().forEach(t=>{if(String(t.c||'').trim()&&!t.gizli)L.push({id:String(t.id),c:t.c,x:t.x||'',ys:t.ys||'',ns:t.ns||''})});
  return L;
}
function fmSlot(site,w){
  const L=fmEff(site);if(!L.length)return null;
  const pin=S.work.fm.pin[w];
  if(pin){const t=L.find(x=>x.id===String(pin));if(t)return{t,key:t.id+'p'+w,w,pinned:true}}
  const n=L.length,i=((w%n)+n)%n;return{t:L[i],key:L[i].id+'c'+Math.floor(w/n),w,pinned:false};
}
function fmAllTopics(site){return[...((site&&site.fm)||[]),...S.work.fm.add.map(t=>({id:String(t.id),c:t.c,x:t.x,ys:t.ys,ns:t.ns}))]}

    box.append(h('div',{class:'row'},sel,pinB,cur.pinned?h('button',{class:'btn sm ghost',type:'button',text:'Otomatik sıraya dön',onclick:()=>{delete S.work.fm.pin[w];touch();rerender()}}):null),

VIEWS.canli=()=>fbGate('Canlı muharebe','Üyelerle web üzerinde yapılan canlı fikir muharebesini buradan aç, kapat ve yönet. Herkes izleyebilir; mesaj yazmak için onaylı üye olmak gerekir. Bu sayfadaki işlemler anında sitede etkili olur, “Yayınla” gerekmez.',root=>{
  const st={room:null,msgs:[]};
  const failAct=e=>{if(e&&e.message==='auth'){FB.out();render();return}toast(e&&e.message==='perm'?'İşlem reddedildi. Ayarlar ve yedek sayfasındaki veritabanı kurallarını yeniden yapıştırman gerekiyor.':(e&&e.message)||'İşlem başarısız.')};
  const konu=h('input',{type:'text',id:'cn_k',maxlength:'200',placeholder:'Örn. Yapay zekâ işsizliği kalıcı olarak artıracaktır.'});
  const ac=h('textarea',{id:'cn_x',rows:3,maxlength:'600',placeholder:'İsteğe bağlı kısa bağlam. Tarafların neyi tartışacağı.'});
  const zm=h('input',{type:'text',id:'cn_z',maxlength:'80',placeholder:'Örn. 20 Kasım 2026 19:00'});
  const dr=h('select',{id:'cn_d'});[['bekliyor','Başlamadı (izleyiciler konuyu görür, mesaj kutusu kapalı)'],['acik','Canlı (üyeler mesaj yazabilir)'],['kapali','Sona erdi (yalnızca okunur)']].forEach(([v,t])=>dr.append(h('option',{value:v,text:t})));
  const info=h('p',{class:'hint'});
  const fld=(l,id,c,hint)=>h('div',{class:'fld'},h('label',{for:id,text:l}),c,hint?h('span',{class:'hint',text:hint}):null);
  const mk=(sid)=>({sid,konu:konu.value.trim(),x:ac.value.trim(),zaman:zm.value.trim(),durum:dr.value});
  const put=async o=>{await FB.req('canli_oda',{method:'PUT',body:JSON.stringify(o)});st.room=o;fill();toast('Kaydedildi. Sitede hemen görünür.')};
  const newSid=()=>'s'+Date.now().toString(36);
  const bSave=h('button',{class:'btn solid',type:'button',text:'Kaydet'});
  const bNew=h('button',{class:'btn',type:'button',text:'Yeni oturum aç'});
  const bEnd=h('button',{class:'btn',type:'button',text:'Muharebeyi bitir'});
  const bOff=h('button',{class:'btn danger',type:'button',text:'Oturumu kaldır'});
  const lock=b=>{[bSave,bNew,bEnd,bOff].forEach(x=>x.disabled=b)};
  bSave.addEventListener('click',async()=>{
    if(!konu.value.trim()){toast('Önce muharebenin konusunu yaz.');return}
    lock(true);try{await put(mk(st.room?st.room.sid:newSid()))}catch(e){failAct(e)}lock(false)});
  bNew.addEventListener('click',async()=>{
    if(!konu.value.trim()){toast('Önce muharebenin konusunu yaz.');return}
    if(st.room&&!(await ask('Yeni oturum aç','Şu anki oturumun mesajları sitede görünmez olur (veritabanında kalır). Yeni oturum boş bir akışla başlar.','Yeni oturum aç')))return;
    lock(true);try{st.msgs=[];await put(mk(newSid()));drawMsgs()}catch(e){failAct(e)}lock(false)});
  bEnd.addEventListener('click',async()=>{
    if(!st.room)return;dr.value='kapali';lock(true);try{await put(mk(st.room.sid))}catch(e){failAct(e)}lock(false)});
  bOff.addEventListener('click',async()=>{
    if(!st.room)return;
    if(!(await ask('Oturumu kaldır','Sitedeki canlı muharebe kutusu boşalır. Mesajlar veritabanında kalır; istersen aşağıdan ayrıca silebilirsin.','Oturumu kaldır',true)))return;
    lock(true);try{await FB.req('canli_oda',{method:'DELETE'});st.room=null;st.msgs=[];fill();drawMsgs();toast('Oturum kaldırıldı.')}catch(e){failAct(e)}lock(false)});
  const form=h('div',{class:'panel'},h('h3',{text:'Oturum'}),info,
    fld('Konu (iddia)','cn_k',konu),fld('Açıklama (isteğe bağlı)','cn_x',ac),fld('Zaman (isteğe bağlı)','cn_z',zm,'Sitede “Zaman:” satırı olarak görünür. Serbest yazı; bir tarih ya da saat yazman yeterli.'),fld('Durum','cn_d',dr),
    h('div',{class:'actions'},bSave,bNew,bEnd,h('span',{style:'flex:1'}),bOff));
  function fill(){
    const r=st.room;
    if(r){konu.value=r.konu||'';ac.value=r.x||'';zm.value=r.zaman||'';dr.value=r.durum||'bekliyor';
      info.textContent='Aktif oturum var. “Kaydet” aynı oturumu günceller, “Yeni oturum aç” boş bir akışla yeniden başlatır.'}
    else{info.textContent='Şu an açık oturum yok. Konuyu yazıp “Kaydet” dediğinde sitede Canlı muharebe sekmesinde görünür.';dr.value='bekliyor'}
    bNew.disabled=false;bEnd.disabled=bOff.disabled=!r;
  }
  const list=h('div'),stat=h('p',{class:'hint'});
  const bRef=h('button',{class:'btn sm',type:'button',text:'Yenile',onclick:()=>loadMsgs()});
  const bClr=h('button',{class:'btn sm danger',type:'button',text:'Tüm mesajları sil',onclick:async()=>{
    if(!st.room||!st.msgs.length)return;
    if(!(await ask('Tüm mesajları sil','Bu oturumun bütün mesajları kalıcı olarak silinir. Geri alınamaz.','Hepsini sil',true)))return;
    try{await FB.req('canli_msg/'+st.room.sid,{method:'DELETE'});st.msgs=[];drawMsgs();toast('Mesajlar silindi.')}catch(e){failAct(e)}}});
  function drawMsgs(){
    list.replaceChildren();
    const e=st.msgs.filter(m=>m.s==='E').length,hh=st.msgs.length-e;
    stat.textContent=st.room?(st.msgs.length+' mesaj ('+e+' katılıyorum, '+hh+' katılmıyorum), '+new Set(st.msgs.map(m=>m.u)).size+' katılımcı'):'';
    bClr.disabled=!st.msgs.length;
    if(!st.msgs.length){list.append(h('div',{class:'empty'},h('b',{text:'Henüz mesaj yok'}),h('span',{text:st.room?'Üyeler yazmaya başlayınca burada görünür. Bu liste 5 saniyede bir kendiliğinden yenilenir.':'Önce bir oturum aç.'})));return}
    st.msgs.slice().reverse().forEach(m=>list.append(h('div',{class:'tx'},
      h('div',{class:'meta'},h('span',{text:m.d?fmtTs(m.d):''}),h('span',{class:'chip '+(m.s==='E'?'ok':'warn'),text:m.s==='E'?'Katılıyor':'Katılmıyor'})),
      h('div',null,h('b',{text:m.n||'Üye'})),
      h('p',{style:'white-space:pre-wrap;overflow-wrap:anywhere',text:m.t}),
      h('div',{class:'actions'},h('span',{style:'flex:1'}),h('button',{class:'btn sm danger',type:'button',text:'Mesajı sil',onclick:async()=>{
        try{await FB.req('canli_msg/'+st.room.sid+'/'+m.id,{method:'DELETE'});st.msgs=st.msgs.filter(x=>x.id!==m.id);drawMsgs();toast('Mesaj silindi.')}catch(e2){failAct(e2)}}})))));
  }
  async function loadMsgs(quiet){
    if(!st.room){st.msgs=[];drawMsgs();return}
    if(!quiet)list.replaceChildren(h('div',{class:'skel'}),h('div',{class:'skel'}));
    try{
      const j=await FB.req('canli_msg/'+st.room.sid)||{};
      st.msgs=Object.entries(j).filter(([,x])=>x&&typeof x.t==='string').map(([id,x])=>Object.assign({id},x)).sort((a,b)=>(a.d||0)-(b.d||0));
      drawMsgs();
    }catch(e){if(!quiet)dbFail(list,e,()=>loadMsgs())}
  }
  async function load(){
    try{
      const v=await FB.req('canli_oda');
      let o=null;try{o=typeof v==='string'?JSON.parse(v):v}catch(e){}
      st.room=o&&o.sid?o:null;fill();await loadMsgs();
    }catch(e){fill();dbFail(list,e,load)}
  }
  root.append(form,h('div',{class:'panel'},h('h3',{text:'Mesajlar'}),h('div',{class:'row'},bRef,bClr,stat),list));
  fill();drawMsgs();load();
  const iv=setInterval(()=>{if(!document.body.contains(list)){clearInterval(iv);return}if(!document.hidden&&st.room)loadMsgs(true)},5000);
});

VIEWS.fmarg=()=>fbGate('Muharebe argümanları','Fikir Muharebesi sayfasına yazılan argümanlar ve oylar. Uygunsuz bir argümanı silmek anında sitede etkili olur, “Yayınla” gerekmez.',root=>{
  const st={keys:[],key:'',v:{E:0,H:0},args:[],site:null};
  const sel=h('select',{'aria-label':'İddia seç'}),list=h('div'),stat=h('p',{class:'hint'});
  const refresh=h('button',{class:'btn sm',type:'button',text:'Yenile',onclick:()=>load()});
  root.append(h('div',{class:'toolbar'},sel),h('div',{class:'row'},refresh,stat),list);
  function failAct(e){if(e&&e.message==='auth'){FB.out();render();return}toast(e&&e.message==='perm'?'İşlem reddedildi. Veritabanı kurallarını yeniden yapıştırman gerekiyor.':(e&&e.message)||'İşlem başarısız.')}
  const label=k=>{
    const m=String(k).match(/^(.+)([cp])(\d+)$/);if(!m)return k;
    const t=fmAllTopics(st.site).find(x=>x.id===m[1]);
    return(t?(t.c||'').slice(0,80):m[1])+(m[2]==='p'?' · '+fmRange(+m[3]):' · döngü '+(+m[3]+1));
  };
  function fillSel(){
    const cur=fmSlot(st.site,fmWeek());
    const ks=[...new Set([...(cur?[cur.key]:[]),...st.keys])];
    if(!ks.includes(st.key))st.key=ks[0]||'';
    sel.replaceChildren(...ks.map(k=>h('option',{value:k,text:(cur&&cur.key===k?'Bu hafta · ':'')+label(k)})));
    sel.value=st.key;
  }
  function draw(){
    list.replaceChildren();
    const t=st.v.E+st.v.H;
    stat.textContent=st.key?(t.toLocaleString('tr-TR')+' oy ('+st.v.E.toLocaleString('tr-TR')+' katılıyor, '+st.v.H.toLocaleString('tr-TR')+' katılmıyor), '+st.args.length+' argüman'):'';
    if(!st.args.length){list.append(h('div',{class:'empty'},h('b',{text:'Henüz argüman yok'}),h('span',{text:'Ziyaretçiler bir iddiaya argüman yazdığında burada görünür.'})));return}
    st.args.forEach(a=>list.append(h('div',{class:'tx'},
      h('div',{class:'meta'},h('span',{text:a.d?fmtTs(a.d):''}),h('span',{class:'chip '+(a.s==='E'?'ok':'warn'),text:a.s==='E'?'Katılıyor':'Katılmıyor'})),
      h('div',null,h('b',{text:a.n||'Anonim'})),
      h('p',{style:'white-space:pre-wrap;overflow-wrap:anywhere',text:a.t}),
      h('div',{class:'actions'},h('span',{style:'flex:1'}),h('button',{class:'btn sm danger',type:'button',text:'Argümanı sil',onclick:async()=>{
        if(!(await ask('Argümanı sil','Argüman siteden kalıcı olarak kaldırılır. Bu işlem geri alınamaz.','Argümanı sil',true)))return;
        try{await FB.req('fikir/arg/'+st.key+'/'+a.id,{method:'DELETE'});st.args=st.args.filter(x=>x.id!==a.id);draw();toast('Argüman silindi.')}catch(e){failAct(e)}}})))));
  }
  async function loadKey(){
    if(!st.key){st.v={E:0,H:0};st.args=[];draw();return}
    list.replaceChildren(h('div',{class:'skel'}),h('div',{class:'skel'}));
    try{
      const[v,a]=await Promise.all([FB.req('fikir/oy/'+st.key),FB.req('fikir/arg/'+st.key)]);
      st.v={E:+(v&&v.E)||0,H:+(v&&v.H)||0};
      st.args=Object.entries(a||{}).filter(([,x])=>x&&typeof x.t==='string').map(([id,x])=>Object.assign({id},x)).sort((x,y)=>(y.d||0)-(x.d||0));
      draw();
    }catch(e){dbFail(list,e,loadKey)}
  }
  async function load(){
    list.replaceChildren(h('div',{class:'skel'}),h('div',{class:'skel'}));
    try{
      st.site=await loadSite().catch(()=>null);
      const j=await FB.req('fikir/arg',{q:{shallow:'true'}})||{};
      st.keys=Object.keys(j).sort().reverse();
      fillSel();await loadKey();
    }catch(e){dbFail(list,e,load)}
  }
  sel.addEventListener('change',()=>{st.key=sel.value;loadKey()});
  load();
});

const loadJs=u=>new Promise((ok,no)=>{if(document.querySelector('script[src="'+u+'"]'))return ok();const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('lib'));document.head.append(e)});
async function gazeteSayfalari(items,baslik,opt){
  opt=opt||{};const AD=opt.ad||'Diyalog Gazetesi',RED='#c4202e',PW=794,PH=1123,PM=40,GAP=22,CW=Math.floor((PW-2*PM-2*GAP)/3),HH=34,TOP=PM+HH+10,CH=PH-TOP-PM;

  const KC='font:800 12px sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:'+RED;

  const plain=b=>String(b||'').replace(/^##\s+/gm,'').replace(/^>\s?/gm,'');

  const host=D('position:fixed;left:-9999px;top:0;width:'+CW+'px;font:14px/1.5 Georgia,serif;color:#111');document.body.append(host);

  const f=page(1);f.style.padding=PM+'px';
  const mast=D('background:'+RED+';color:#fff;text-align:center;padding:16px 10px 12px');mast.append(D('font:900 64px/1 Georgia,serif;letter-spacing:-1px',AD));
  const strip=D('display:flex;justify-content:space-between;border-bottom:3px double #111;padding:7px 2px;font:700 12px sans-serif;letter-spacing:1px;text-transform:uppercase');strip.append(D('',baslik),D('','Ücretsizdir'));
  f.append(mast,strip);
  const m=items[0];
  if(m){const w=D('padding:14px 0 14px;border-bottom:1px solid #999');
    w.append(D(KC,m.kind||'Manşet'),D('font:900 40px/1.08 Georgia,serif;margin:6px 0 12px',m.title));
    if(m.img)w.append(mk(m,PW-2*PM,360));
    const sp=clip(m.text||plain(m.body),230);if(sp)w.append(D('font:italic 17px/1.45 Georgia,serif;color:#333;margin-top:10px',sp));

      tz.forEach((x,i)=>{const c=D('flex:1;min-width:0;'+(i?'border-left:1px solid #ccc;padding-left:'+(GAP/2)+'px':''));
        c.append(D(KC,x.kind||'Haber'));c.append(D('font:800 20px/1.2 Georgia,serif;margin:4px 0 8px;max-height:72px;overflow:hidden',x.title));
        if(x.img)c.append(mk(x,210,100,'margin-bottom:8px'));
        c.append(D('font:13.5px/1.45 Georgia,serif;color:#333',clip(x.text||plain(x.body),110)));g.append(c)});
      f.append(g)}
    const rest=items.slice(4,8);
    if(rest.length){const b=D('margin-top:14px;border-top:3px solid #111;padding-top:8px');b.append(D(KC,'Bu sayıda'));
      rest.forEach(x=>b.append(D('font:700 14px/1.4 Georgia,serif;padding:3px 0;border-bottom:1px dotted #bbb','• '+clip(x.title,90))));f.append(b)}
  }
  pages.push(f);
  /* ---- iç sayfalar: 3 sütun ---- */
  let cols=[],ci=3,used=0,pn=1;
  const H=el=>{host.replaceChildren(el);return el.getBoundingClientRect().height};
  const nextCol=()=>{ci++;used=0;if(ci>=3){pn++;const pg=page(pn),hd=D('position:absolute;left:'+PM+'px;right:'+PM+'px;top:'+PM+'px;height:'+HH+'px;border-bottom:2px solid #111;display:flex;justify-content:space-between;align-items:baseline;font:700 12px sans-serif;letter-spacing:1px;text-transform:uppercase');

      t.replace(/\s+/g,' ').split(/(?<=[.!?…])\s+/).reduce((a,s,j)=>{(j%2?a[a.length-1]+=' '+s:a.push(s));return a},[]).forEach((s,j)=>put(D('text-align:justify;hyphens:auto;'+(j?'':'padding-top:5px;text-indent:12px'),s)));
    });
  });
  host.remove();return pages;
}
async function gazetePdf(items,baslik,tarih,opt){
  opt=opt||{};
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const pages=await gazeteSayfalari(items,baslik,opt);
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;width:794px;background:#fff';document.body.append(host);
  for(let i=0;i<pages.length;i++){
    host.replaceChildren(pages[i]);
    await Promise.all([...pages[i].querySelectorAll('img')].map(im=>im.decode().catch(()=>{})));
    const c=await html2canvas(pages[i],{scale:2,backgroundColor:'#fff',useCORS:true,width:794,height:1123});
    if(i)doc.addPage();
    doc.addImage(c.toDataURL('image/jpeg',0.85),'JPEG',0,0,210,297);
  }
  host.remove();return doc.output('blob');
}

async function doPublish(count){
  S.busy=true;$('#pubBtn').disabled=true;

    foot.replaceChildren(h('button',{class:'btn solid',type:'button',text:'Tamam',onclick:()=>{d.close();d.remove()}}))};

  }finally{S.busy=false;render()}
}

        h('div',{class:'row',style:'align-items:flex-end'},mkS('Grafik türü',CHT,()=>cfgC.type,v=>{cfgC.type=v;if(v==='dagilim')cfgC.ys=cfgC.ys.slice(0,1)}),mkS('Dönüşüm',CHF,()=>cfgC.tf,v=>{cfgC.tf=v}),mkS('X ekseni',g.H.map((x,i)=>[String(i),x||('Sütun '+(i+1))]),()=>String(cfgC.x),v=>{cfgC.x=+v;cfgC.ys=cfgC.ys.filter(i=>i!==cfgC.x)})),
        h('label',{style:'display:flex;gap:6px;align-items:center;margin:8px 0;font-size:14px'},lg,'Logaritmik ölçek'),ysBox,chPrev)};
    const cmN=cmOf(r).length,cmWait=cmOf(r).filter(x=>!(x.r&&x.r.t)).length;
    view.append(h('div',{class:'reader'},
      h('h3',{text:r.t||'(başlıksız tablo)'}),
      h('div',{class:'meta'},h('span',{text:'✍️ '+(r.n||'—')}),r.c?h('span',{text:'✉️ '+r.c}):h('span',{text:'İletişim yazılmamış'}),h('span',{text:'📅 '+fmtTs(r.d)}),
        h('span',{text:g?(g.R.length+' satır · '+g.H.length+' sütun'):'Tablo okunamadı'}),h('span',{class:'chip'+(isPub(r)?' ok':(r.st==='Yeni'?' warn':'')),text:label(r)})),
      g?drawTable(g):h('p',{class:'hint',text:'Bu kayıttaki tablo verisi bozuk görünüyor.'}),
      g?chPanel():null,
      h('div',{class:'fld',style:'margin:0'},h('label',{text:'Başlık (sitede böyle görünür)'}),ti),
      h('div',{class:'fld',style:'margin:0'},h('label',{text:'Veri kaynağı'}),si),
      h('div',{class:'fld',style:'margin:0'},h('label',{text:'Açıklama'}),di),
      h('p',{class:'hint',text:'İletişim bilgisi ve notun siteye yayınlanmaz. Yayında yorumlar: '+cmN+(cmN?' ('+cmWait+' yanıt bekliyor)':'')+'.'}),
      h('div',{class:'row'},
        isPub(r)
          ?[h('button',{class:'btn solid sm',type:'button',text:'Değişiklikleri kaydet',onclick:async()=>{try{if(await saveFields()){toast('Kaydedildi, sitede güncellendi.');draw()}}catch(e){fail(e)}}}),
            h('button',{class:'btn sm',type:'button',text:'Yayından kaldır',onclick:async()=>{
              if(!(await ask('Yayından kaldır','Tablo Veri Tablosu sayfasından kalkar. Yorumları silinmez, tekrar yayınlarsan yeniden görünür.','Kaldır')))return;
              try{await FB.req('vtpub/'+r.id,{method:'DELETE'});delete st.pub[r.id];await patch(r,{st:'İnceleniyor'});toast('Yayından kaldırıldı.');draw()}catch(e){fail(e)}}})]
          :[h('button',{class:'btn solid sm',type:'button',text:'Onayla ve yayınla',onclick:async()=>{
              if(!g||!g.R.length){toast('Tablo verisi okunamıyor, yayınlanamaz.');return}
              try{if(!(await saveFields()))return;const b=pubBody(r);await FB.req('vtpub/'+r.id,{method:'PUT',body:b});st.pub[r.id]=b;await patch(r,{st:'Yayında',pb:b.d});toast('Yayınlandı. Veri Tablosu sayfasında görünüyor ve yoruma açık.');draw()}catch(e){fail(e)}}}),
            h('button',{class:'btn sm',type:'button',text:'Reddet',onclick:async()=>{
              if(!(await ask('Tabloyu reddet','Tablo yayınlanmaz ve “Reddedildi” olarak işaretlenir. İstersen sonra silebilirsin.','Reddet')))return;
              try{await patch(r,{st:'Reddedildi'});toast('Reddedildi.');draw()}catch(e){fail(e)}}})],
        h('button',{class:'btn sm',type:'button',text:'Notu kaydet',onclick:async()=>{try{await patch(r,{nt:note.value.slice(0,2000)});toast('Not kaydedildi.')}catch(e){fail(e)}}}),
        g?h('button',{class:'btn sm',type:'button',text:'CSV indir',onclick:()=>{
          const blob=new Blob(['﻿'+[g.H,...g.R].map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
          const l=h('a',{href:URL.createObjectURL(blob),download:'tablo-'+r.id.slice(-6)+'.csv'});document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),1000)}}):null,
        cmN?h('button',{class:'btn sm',type:'button',text:'Yorumlara git',onclick:()=>go('comments')}):null,
        h('span',{style:'flex:1'}),
        h('button',{class:'btn sm danger',type:'button',text:'Sil',onclick:async()=>{
          if(!(await ask('Tabloyu sil','Tablo, yayındaysa siteden, ve bu tabloya yazılmış '+cmN+' yorum kalıcı olarak silinir. Geri alınamaz.','Sil',true)))return;
          try{if(isPub(r)){await FB.req('vtpub/'+r.id,{method:'DELETE'});delete st.pub[r.id]}
            for(const c of cmOf(r))await FB.req('comments/'+c.id,{method:'DELETE'});
            await FB.req('vtq/'+r.id,{method:'DELETE'});st.rows=st.rows.filter(x=>x!==r);st.sel=null;draw();toast('Silindi.')}catch(e){fail(e)}}})),
      h('div',{class:'fld',style:'margin:0'},h('label',{text:'Notum'}),note)));
  }
  function draw(){
    setNewVt(newN());
    chips.replaceChildren();
    const mk=(lb,val,n)=>chips.append(h('button',{type:'button','aria-pressed':String(st.s===val),text:lb+' ('+n+')',onclick:()=>{st.s=val;draw()}}));
    mk('Tümü','',st.rows.length);VST.forEach(x=>mk(x,x,st.rows.filter(r=>label(r)===x).length));
    const qq=st.q.trim().toLocaleLowerCase('tr');
    const rows=st.rows.filter(r=>(!st.s||label(r)===st.s)&&(!qq||[r.t,r.n,r.s,r.no].join(' ').toLocaleLowerCase('tr').includes(qq)));
    stat.textContent=st.rows.length?(st.rows.length+' tablo, '+Object.keys(st.pub).length+' tanesi yayında'+(newN()?' · '+newN()+' yeni':'')):'';
    list.replaceChildren();
    if(!rows.length)list.append(h('p',{class:'hint',text:st.rows.length?'Eşleşen tablo yok.':'Henüz tablo yok.'}));
    rows.forEach(r=>list.append(h('button',{type:'button',class:'item'+(label(r)==='Yeni'?' isnew':''),'aria-current':String(st.sel===r.id),onclick:async()=>{
      st.sel=r.id;
      if(r.st==='Yeni'&&!isPub(r)){try{await patch(r,{st:'İnceleniyor'})}catch(e){fail(e)}}
      draw();if(innerWidth<=860)view.scrollIntoView({behavior:'smooth',block:'start'})}},
      h('div',{class:'top'},h('b',{text:r.t||'(başlıksız)'}),h('span',{class:'chip'+(label(r)==='Yeni'?' warn':(label(r)==='Yayında'?' ok':'')),text:label(r)})),
      h('small',{text:(r.n||'—')+' · '+fmtTs(r.d)}))));
    drawView();
  }
  async function load(silent){
    if(!silent)list.replaceChildren(h('div',{class:'skel'}),h('div',{class:'skel'}),h('div',{class:'skel'}));
    try{
      const [j,p,c]=await Promise.all([FB.req('vtq'),FB.req('vtpub'),FB.req('comments',{q:{orderBy:'"$key"',limitToLast:'500'}})]);
      st.rows=Object.entries(j||{}).filter(([,x])=>x&&x.t).map(([id,x])=>Object.assign({id},x)).sort((a,b)=>(b.d||0)-(a.d||0));
      st.pub=p||{};st.cm={};
      Object.entries(c||{}).forEach(([id,x])=>{if(x&&x.p&&String(x.p).indexOf('vt-')===0&&x.t)(st.cm[x.p]=st.cm[x.p]||[]).push(Object.assign({id},x))});
      st.rows.forEach(r=>S.seenVt.add(r.id));draw();
    }catch(e){if(silent)return;if(e&&e.message==='perm'){list.replaceChildren(h('div',{class:'panel stack'},h('h3',{text:'Veritabanı kuralları güncellenmeli'}),h('p',{class:'mut',text:'Veri tabloları için yeni kurallar gerekiyor. Tüm kuralları yapıştırıp yayınladıktan sonra Tekrar dene’ye bas.'}),rulesBox(),h('button',{class:'btn solid',type:'button',onclick:()=>load(),text:'Tekrar dene'})))}else dbFail(list,e,()=>load())}
  }
  q.addEventListener('input',()=>{st.q=q.value;draw()});
  load();
  const iv=setInterval(()=>{if(!root.isConnected){clearInterval(iv);return}if(!document.hidden)load(true)},30000);
});

/* yorumlar sayfasında tablo yorumlarının başlığı */
const _postTitles=postTitles;
postTitles=async function(){
  const t=await _postTitles();
  try{const r=await fetch(FB.base()+'/vtpub.json',{cache:'no-store'});
    if(r.ok){const j=await r.json()||{};for(const id in j)if(j[id]&&j[id].t)t['vt-'+id]='Veri tablosu: '+j[id].t}}catch(e){}
  return t;
};

/* yeni tablo bildirimi */
let _vtPoll=false;
async function pollVt(){
  if(!FB.sess())return;
  try{const j=await FB.req('vtq')||{};
    const nw=Object.entries(j).filter(([,x])=>x&&x.st==='Yeni');
    const fresh=nw.filter(([id])=>!S.seenVt.has(id));nw.forEach(([id])=>S.seenVt.add(id));
    setNewVt(nw.length);
    if(fresh.length){const t=fresh[0][1].t||'';toast(fresh.length>1?fresh.length+' yeni tablo geldi':'Yeni tablo: '+(t.slice(0,50)||'başlıksız'),{label:'Aç',fn:()=>{S.itabTab='vtab';go('itab')}})}
  }catch(e){}
}
const _render1=render;
render=function(){_render1();if(!_vtPoll&&FB.sess()){_vtPoll=true;pollVt();setInterval(()=>{if(!document.hidden)pollVt()},60000)}};
})();
</script>
