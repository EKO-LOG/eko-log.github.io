@media (max-width:1099px){:root[data-theme="dark"] .brand-txt{background-image:linear-gradient(120deg,#ff6470 10%,#ff8f5a 65%,#ffc371)}}
</style>
<style id="nav-std">
/* Ortak menü: kapsül çubuk, sola yaslı kayan menü, aktif öğe degrade hap */
header .bar{gap:8px!important}
header .brand{flex:none!important;padding-right:0!important}
header .brand span,header .brand-txt{display:none!important}
header nav{flex:1 1 auto!important;min-width:0!important;justify-content:flex-start!important;gap:2px!important;overflow-x:auto!important;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
header nav::-webkit-scrollbar{display:none}
header nav a{flex:none;white-space:nowrap;padding:9px 11px!important;font-size:13px!important;font-weight:700!important;letter-spacing:-.01em}
@media (min-width:1100px){header nav{justify-content:flex-end!important}header nav a{padding:9px clamp(7px,.85vw,14px)!important;font-size:clamp(12px,1.05vw,15px)!important}}
</style>
<style>header .bar{max-width:1280px}nav a.on{background:linear-gradient(120deg,var(--g1,#c4202e),var(--g2,#ff7a45));color:#fff}</style>
<style id="premium-nav">
/* Premium menü: buzlu cam, ince ışık çizgisi, yumuşak gölge, degrade aktif hap */
header .bar{background:var(--glass)!important;-webkit-backdrop-filter:blur(24px) saturate(1.7)!important;backdrop-filter:blur(24px) saturate(1.7)!important;border:1px solid rgba(255,255,255,.55)!important;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 20px 48px -22px rgba(60,10,40,.5),0 2px 6px -2px rgba(60,10,40,.12)!important;padding:7px 10px 7px 8px!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header .bar{border-color:rgba(255,255,255,.1)!important;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 20px 48px -22px rgba(0,0,0,.8)!important}}
:root[data-theme="dark"] header .bar{border-color:rgba(255,255,255,.1)!important;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 20px 48px -22px rgba(0,0,0,.8)!important}
header .brand img{box-shadow:0 0 0 2px rgba(255,255,255,.95),0 8px 20px -8px rgba(196,32,46,.6)}
header nav a{font-weight:600!important;letter-spacing:.005em!important;border-radius:999px!important;transition:background .25s,color .25s,transform .25s,box-shadow .25s!important}
header nav a:hover{background:var(--soft)!important;transform:translateY(-1px)}
header nav a.on{background:linear-gradient(120deg,var(--g1),var(--g2))!important;color:#fff!important;box-shadow:0 10px 22px -10px rgba(196,32,46,.7)!important}
</style>

window.__startVeri=function(){
'use strict';
/* ════════════════════════════════════════════════════════════════
   EKO-PLUS YENİ MODÜLLER
   4 Yol Haritası · 5 Sınav Takvimi · 6 Etkinlik Araçları (QR yoklama,
   canlı oylama, geri bildirim) · 8 Not Paylaşımı · 9 Mentor ·
   10 İlerleme Paneli · 12 Bildirim / PWA
   ════════════════════════════════════════════════════════════════ */

/* ---------- Ana siteye bağlanma noktaları ----------
   Entegrasyonda window.EKX2_HOST tanımlayarak veya aşağıdaki varsayılanları
   değiştirerek ana sitenin kendi üyelik/yönetici kontrolüne bağla. */
const HOST=window.EKX2_HOST||{};
const $=(s,r=document)=>r.querySelector(s);
const NS='ekx2_';
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(NS+k));return v==null?d:v}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){}};
const siteRd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};  /* sitenin kendi anahtarları (learn, tahmin, forum…) */
const isMember=HOST.isMember||(()=>true);   /* sitede: eko_uye + eko_uye_ok kontrolü */
const isAdmin=HOST.isAdmin||(()=>document.body.classList.contains('adm')||document.body.classList.contains('x2adm'));
const toast=HOST.toast||(m=>{const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)});
/* ---------- Sayfa anahtarları (Yönetim paneli → content.json "xp") ----------
   Yönetim panelindeki "Eko-Plus modülleri" bölümünden kapatılan sayfalar üyelere görünmez.
   Varsayılan: hepsi açık. Ana site content.json'u zaten yüklüyorsa window.EKO_CONTENT = json
   atayıp window.EKX2.applyContent(json) çağır; aksi halde dosya kendisi 'content.json'u okur. */
const prev=()=>document.body.classList.contains('adm');   /* yönetici kapalı sayfaları önizleyebilir */
const XP={};let XT=[];   /* yönetimin eklediği resmî sınav tarihleri (content.json → xt) */

const DB=(()=>{

  const K=NS+'db';
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}};
  const parts=p=>String(p).split('/').filter(Boolean);
  async function get(p){
    const base=getBase();if(base){const r=await fetch(base+'/'+parts(p).join('/')+'.json',{cache:'no-store'});if(!r.ok)throw new Error('db');return r.json()}

    try{localStorage.setItem(K,JSON.stringify(t))}catch(e){}

  }
  return{get,put,del:p=>put(p,null),get shared(){return !!getBase()}};
})();

function parseCSV(text){
  text=String(text||'').replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const del=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let cur=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===del){cur.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;cur.push(f);f='';if(cur.some(x=>x!==''))rows.push(cur);cur=[]}
    else f+=c}
  cur.push(f);if(cur.some(x=>x!==''))rows.push(cur);
  if(rows.length<2)throw new Error('En az bir başlık satırı ve bir veri satırı gerekli.');
  const head=rows[0].map((h,i)=>(h.trim()||'sutun'+(i+1)));
  const seen={};const names=head.map(h=>{let n=h,k=1;while(seen[n.toLowerCase()])n=h+'_'+(++k);seen[n.toLowerCase()]=1;return n});
  return{names,rows:rows.slice(1,5001).map(r=>names.map((_,i)=>(r[i]??'').trim()))};
}

    ['Dış ticaret payı %70’i aşan ülkelerin ortalama geliri?',`SELECT COUNT(*) AS ulke_sayisi, ROUND(AVG(gelir)) AS ort_gelir, ROUND(AVG(enflasyon),1) AS ort_enflasyon FROM ulke WHERE dis_ticaret > 70`,'Dışa çok açık ekonomilerin özetini çıkarır.']],
  hane:[
    ['Bölgelere göre ortalama gelir ve tasarruf?',`SELECT bolge, COUNT(*) AS hane, ROUND(AVG(gelir)) AS ort_gelir, ROUND(AVG(tasarruf)) AS ort_tasarruf FROM hane GROUP BY bolge ORDER BY ort_gelir DESC`,'Boş tasarruf değerleri ortalamaya girmez; hane sayısı tüm satırları, tasarruf ortalaması ise dolu olanları kapsar.'],
    ['İnterneti olan ve olmayan hanelerin ortalama eğitim harcaması?',`SELECT internet, COUNT(*) AS hane, ROUND(AVG(egitim)) AS ort_egitim, ROUND(AVG(gelir)) AS ort_gelir FROM hane GROUP BY internet`,'Farkın internetten mi yoksa gelirden mi geldiğini anlamak için gelir ortalamasına da bakılır.'],
    ['Geliri 100.000 TL’nin üstündeki haneler yerleşim türüne göre kaç tane?',`SELECT il_grubu, COUNT(*) AS hane FROM hane WHERE gelir > 100000 GROUP BY il_grubu ORDER BY hane DESC`,'Yüksek gelirlilerin nerede yoğunlaştığını gösterir.'],
    ['Kişi başına geliri en yüksek 5 hane hangisi?',`SELECT no, kisi, gelir, ROUND(gelir/kisi) AS kisi_basi_gelir FROM hane ORDER BY kisi_basi_gelir DESC, no LIMIT 5`,'Gelir hane büyüklüğüne bölünerek farklı büyüklükteki haneler karşılaştırılabilir hale gelir.'],
    ['Bölgelere göre ortalama gıda payı (gıda ÷ gelir, %)?',`SELECT bolge, ROUND(AVG(gida/gelir)*100,1) AS ort_gida_payi FROM hane GROUP BY bolge ORDER BY ort_gida_payi DESC`,'Önce her hanenin payı hesaplanır, sonra bölgede ortalaması alınır; bu, toplamların oranından farklıdır.'],
    ['Tasarruf bilgisi eksik hanelerin ortalama geliri kaç?',`SELECT COUNT(*) AS eksik, ROUND(AVG(gelir)) AS ort_gelir FROM hane WHERE tasarruf IS NULL`,'Eksik verinin rastgele mi yoksa belli gelir düzeylerinde mi toplandığına bakmak için kullanılır.'],
    ['3 ve daha fazla çocuklu hanelerde ortalama gelir ve gıda harcaması?',`SELECT COUNT(*) AS hane, ROUND(AVG(gelir)) AS ort_gelir, ROUND(AVG(gida)) AS ort_gida FROM hane WHERE cocuk >= 3`,'Kalabalık hanelerin gelirine göre gıda yükünü gösterir. Grup küçükse dikkatli yorumla.'],
    ['5 ve daha fazla kişilik kiracı hanelerde ortalama kira yükü (%)?',`SELECT COUNT(*) AS hane, ROUND(AVG(kira/gelir)*100,1) AS ort_kira_payi FROM hane WHERE kisi >= 5 AND ev_sahibi = 'Hayır'`,'Kirası olmayan ev sahiplerini dışarıda bırakmak için ev_sahibi koşulu eklenir.']],
  hisse:[
    ['Her hissenin ortalama aylık getirisi?',`SELECT hisse, sektor, ROUND(AVG(getiri),2) AS ort_getiri FROM hisse GROUP BY hisse, sektor ORDER BY ort_getiri DESC`,'Sektör sütunu da gruplamaya girer, böylece hissenin yanında sektörü de görünür.'],
    ['Her hisse için en yüksek kapanış fiyatı?',`SELECT hisse, MAX(kapanis) AS en_yuksek_kapanis FROM hisse GROUP BY hisse ORDER BY en_yuksek_kapanis DESC`,'Fiyat düzeyleri hisseler arasında kıyaslanmaz; ancak her hissenin kendi tarihsel zirvesini gösterir.'],
    ['Mart 2020’de hisselerin getirisi nasıldı?',`SELECT hisse, sektor, getiri FROM hisse WHERE ay = '2020-03' ORDER BY getiri, hisse`,'Tek bir ayı seçip hepsini küçükten büyüğe sıralar; kriz ayında kim ne kadar etkilendi?'],
    ['İşlem hacmi 100’ü aşan kayıtlarda ortalama getiri?',`SELECT COUNT(*) AS kayit, ROUND(AVG(getiri),2) AS ort_getiri FROM hisse WHERE hacim > 100`,'Yüksek hacimli aylar ile getiri arasındaki ilişkiye ilk bakış.'],
    ['Sektörlere göre kaç hisse-ay negatif getiri verdi?',`SELECT sektor, COUNT(*) AS eksi_kayit FROM hisse WHERE getiri < 0 GROUP BY sektor ORDER BY eksi_kayit DESC, sektor`,'Sektörlerin içindeki hisse sayısı farklıdır; sayıları o sayıya bölmeden yorum yapma.'],
    ['2025’te ortalama getirisi en yüksek 3 hisse?',`SELECT hisse, ROUND(AVG(getiri),2) AS ort_getiri FROM hisse WHERE ay LIKE '2025%' GROUP BY hisse ORDER BY ort_getiri DESC LIMIT 3`,'Bir yılı süzmek, gruplamak, sıralamak ve ilk üçü almak tek sorguda birleşir.'],
    ['Fiyatı hiç 100’ün üzerine çıkmış hisseler?',`SELECT hisse, MAX(kapanis) AS en_yuksek FROM hisse GROUP BY hisse HAVING MAX(kapanis) > 100 ORDER BY en_yuksek DESC`,'Koşul bir özet değer (en yüksek) üzerinde olduğu için GRUPTA kullanılır.'],
    ['Teknoloji sektörünün en iyi 5 ayı?',`SELECT ay, hisse, getiri FROM hisse WHERE sektor = 'Teknoloji' ORDER BY getiri DESC, ay, hisse LIMIT 5`,'Sektör süzülür, getiriye göre sıralanır; birden çok sıralama ölçütü eşitliği çözer.']],
  isgucu:[
    ['Sendika üyeleri ile üye olmayanların ortalama ücreti?',`SELECT sendika, COUNT(ucret) AS ucret_var, ROUND(AVG(ucret)) AS ort_ucret FROM isgucu GROUP BY sendika`,'SAY(ucret) yalnızca dolu ücretleri sayar. Sendika kamuda yaygındır; sektör farkını da düşün.'],
    ['Sözleşme türüne göre ortalama ücret ve çalışma saati?',`SELECT sozlesme, COUNT(*) AS kisi, ROUND(AVG(ucret)) AS ort_ucret, ROUND(AVG(calisma_saat),1) AS ort_saat FROM isgucu GROUP BY sozlesme ORDER BY ort_ucret DESC`,'Güvencesiz sözleşmelerde ücret ve saat birlikte nasıl değişiyor?'],
    ['Kadınların eğitim düzeyine göre ortalama ücreti?',`SELECT egitim, COUNT(*) AS kisi, ROUND(AVG(ucret)) AS ort_ucret FROM isgucu WHERE cinsiyet = 'Kadın' GROUP BY egitim ORDER BY ort_ucret DESC`,'Eğitimin ücrete getirisini tek bir cinsiyet için gösterir; erkekler için de çalıştırıp karşılaştır.'],
    ['Haftada 50 saatten fazla çalışanlar en çok hangi sektörlerde?',`SELECT sektor, COUNT(*) AS kisi FROM isgucu WHERE calisma_saat > 50 GROUP BY sektor ORDER BY kisi DESC, sektor`,'Uzun mesai kesitinde sektör dağılımı.'],
    ['Ücreti en yüksek 5 çalışan kim?',`SELECT no, yas, egitim, sektor, deneyim, ucret FROM isgucu ORDER BY ucret DESC, no LIMIT 5`,'Boş ücretler sıralamanın sonuna düşer, bu yüzden en yüksek 5 satırı etkilemez.'],
    ['Şehir tipine göre ortalama ücret?',`SELECT sehir_tipi, COUNT(*) AS kisi, ROUND(AVG(ucret)) AS ort_ucret FROM isgucu GROUP BY sehir_tipi ORDER BY ort_ucret DESC`,'Büyükşehir, şehir ve kırsal ücretlerini yan yana koyar.'],
    ['Saatlik ücreti en düşük 5 çalışan kim? (ay = 4 hafta)',`SELECT no, sektor, ucret, calisma_saat, ROUND(ucret/(calisma_saat*4),1) AS saatlik FROM isgucu WHERE ucret IS NOT NULL ORDER BY saatlik, no LIMIT 5`,'Aylık ücret, aylık toplam saate bölünür; ayı kabaca 4 hafta saydık. Parantez işlem sırasını belirler.'],
    ['30 yaşından küçük üniversite ve lisansüstü mezunlarının ortalama ücreti?',`SELECT COUNT(*) AS kisi, ROUND(AVG(ucret)) AS ort_ucret FROM isgucu WHERE yas < 30 AND egitim IN ('Üniversite','Lisansüstü')`,'Yaş ve eğitim koşulu birlikte; İÇİNDE iki eğitim düzeyini tek koşulda toplar.']],
  konut:[
    ['Isıtma türüne göre ortalama fiyat ve bina yaşı?',`SELECT isitma, COUNT(*) AS satis, ROUND(AVG(fiyat)) AS ort_fiyat, ROUND(AVG(bina_yasi),1) AS ort_yas FROM konut GROUP BY isitma ORDER BY ort_fiyat DESC`,'Fiyat farkının bina yaşından kaynaklanıp kaynaklanmadığını anlamak için ortalama yaş da eklenir.'],
    ['Otoparklı konutların ilçelere göre sayısı ve ortalama fiyatı?',`SELECT ilce, COUNT(*) AS satis, ROUND(AVG(fiyat)) AS ort_fiyat FROM konut WHERE otopark = 'Var' GROUP BY ilce ORDER BY ort_fiyat DESC`,'Önce otoparklılar süzülür, sonra ilçelere göre özetlenir.'],
    ['5 yaşından küçük ve 120 m²’den büyük konutların ortalama fiyatı?',`SELECT COUNT(*) AS satis, ROUND(AVG(fiyat)) AS ort_fiyat FROM konut WHERE bina_yasi < 5 AND m2 > 120`,'Yeni ve geniş konut segmentinin özeti. Fiyat bin TL cinsindendir.'],
    ['En pahalı 5 satış hangisi?',`SELECT no, ilce, m2, oda, bina_yasi, fiyat FROM konut ORDER BY fiyat DESC, no LIMIT 5`,'En pahalı satışlarda ilçe ve büyüklük örüntüsü var mı?'],
    ['Kat numarasına göre ortalama fiyat?',`SELECT kat, COUNT(*) AS satis, ROUND(AVG(fiyat)) AS ort_fiyat FROM konut GROUP BY kat ORDER BY kat`,'Kat arttıkça fiyat değişiyor mu? Her katın satış sayısına da bak.'],
    ['30 yaşından eski konutlarda ilçelere göre ortalama m² fiyatı?',`SELECT ilce, COUNT(*) AS satis, ROUND(AVG(fiyat/m2),1) AS ort_m2_fiyati FROM konut WHERE bina_yasi > 30 GROUP BY ilce ORDER BY ort_m2_fiyati DESC`,'Eski bina segmentinde konumun fiyat üzerindeki etkisini görmeye yarar.'],
    ['80 m²’den küçük konutlar oda sayısına göre nasıl dağılıyor?',`SELECT oda, COUNT(*) AS satis FROM konut WHERE m2 < 80 GROUP BY oda ORDER BY oda`,'Küçük konutların oda sayısı dağılımı; dağılımın hangi odada yoğunlaştığına bak.']],
  ticaret:[
    ['Her ürün grubunda ihracatın ithalatı karşılama oranı?',`SELECT urun, ROUND(SUM(ihracat)/SUM(ithalat),2) AS karsilama FROM ticaret GROUP BY urun ORDER BY karsilama DESC`,'1’in üstü ihracat fazlası, altı açık demektir.'],
    ['Toplam ihracatın en yüksek olduğu 5 ay hangisi?',`SELECT ay, SUM(ihracat) AS toplam_ihracat FROM ticaret GROUP BY ay ORDER BY toplam_ihracat DESC, ay LIMIT 5`,'Beş ürün grubunu aya göre toplar; bu yüzden her ay tek satıra iner.'],
    ['Otomotivde ithalatın ihracatı aştığı kaç ay var?',`SELECT COUNT(*) AS ay_sayisi FROM ticaret WHERE urun = 'Otomotiv' AND ithalat > ihracat`,'İki sütun doğrudan karşılaştırılabilir: koşulda sabit sayı yerine başka bir sütun yazılır.'],
    ['Her ürünün 2025 toplam ihracatı?',`SELECT urun, SUM(ihracat) AS ihracat_2025 FROM ticaret WHERE ay LIKE '2025%' GROUP BY urun ORDER BY ihracat_2025 DESC`,'Bir yılı BENZER ile seçip ürünlere göre toplar.'],
    ['Makine ihracatının en düşük olduğu 5 ay?',`SELECT ay, ihracat FROM ticaret WHERE urun = 'Makine' ORDER BY ihracat, ay LIMIT 5`,'En düşük aylar tarihsel olarak nerede toplanıyor?'],
    ['Her ürün için aylık dış ticaret dengesinin en kötü ve en iyi değeri?',`SELECT urun, MIN(ihracat-ithalat) AS en_kotu_ay, MAX(ihracat-ithalat) AS en_iyi_ay FROM ticaret GROUP BY urun`,'Özet işlevin içinde sütunlar arası işlem yapılabilir.'],
    ['Kimya ve Gıda için ortalama aylık ithalat?',`SELECT urun, ROUND(AVG(ithalat)) AS ort_ithalat FROM ticaret WHERE urun IN ('Kimya','Gıda') GROUP BY urun`,'İÇİNDE ile iki ürün seçilir ve ayrı ayrı ortalaması alınır.']],
  eticaret:[
    ['Kanallara göre iade edilen sipariş sayısı?',`SELECT kanal, COUNT(*) AS iade_sayisi FROM eticaret WHERE iade = 'Evet' GROUP BY kanal ORDER BY iade_sayisi DESC`,'Yalnızca sayı değil oran önemlidir; kanalların toplam sipariş sayısını da hesaplayıp karşılaştır.'],
    ['Kaç siparişin müşteri puanı boş?',`SELECT COUNT(*) AS puansiz FROM eticaret WHERE puan IS NULL`,'Eksik değer sayısı veri temizliğinin ilk adımıdır; boşların rastgele olup olmadığına da bak.'],
    ['Kargo süresine göre sipariş sayısı ve ortalama puan?',`SELECT kargo_gun, COUNT(*) AS siparis, COUNT(puan) AS puanli, ROUND(AVG(puan),2) AS ort_puan FROM eticaret GROUP BY kargo_gun ORDER BY kargo_gun`,'Kargo uzadıkça puan düşüyor mu? SAY(puan) yalnızca dolu puanları sayar.'],
    ['Fiyatı 20.000 TL’yi aşan siparişler hangi kategorilerde?',`SELECT kategori, COUNT(*) AS siparis, MAX(fiyat) AS en_yuksek FROM eticaret WHERE fiyat > 20000 GROUP BY kategori ORDER BY siparis DESC, kategori`,'Bu veri setinde bazı fiyatlar yanlış girilmiştir (10 kat). Uç değerleri bulmak veri temizliğinin parçasıdır.'],
    ['Kategoriye göre ortalama, en düşük ve en yüksek fiyat?',`SELECT kategori, ROUND(AVG(fiyat)) AS ort_fiyat, MIN(fiyat) AS en_dusuk, MAX(fiyat) AS en_yuksek FROM eticaret GROUP BY kategori ORDER BY ort_fiyat DESC`,'Uç değerler ortalamayı çeker: ortalama ile en yüksek değer arasındaki farka dikkat et.'],
    ['Mobil uygulamada puanı 2 ve altı olan siparişler kategorilere göre?',`SELECT kategori, COUNT(*) AS dusuk_puan FROM eticaret WHERE kanal = 'Mobil uygulama' AND puan <= 2 GROUP BY kategori ORDER BY dusuk_puan DESC, kategori`,'Düşük puanlı mobil siparişlerin kategori dağılımı. Boş puanlar koşulu sağlamaz, otomatik elenir.'],
    ['Kanallara göre ortalama müşteri puanı (yalnızca dolu puanlar)?',`SELECT kanal, COUNT(puan) AS puanli, ROUND(AVG(puan),2) AS ort_puan FROM eticaret GROUP BY kanal ORDER BY ort_puan DESC`,'Ortalama yalnızca puanı olan siparişlerden hesaplanır; puansız siparişler farklıysa sonuç yanıltabilir.'],
    ['Ciro (fiyat × adet) en yüksek 5 kategori–kanal çifti?',`SELECT kategori, kanal, SUM(fiyat*adet) AS ciro FROM eticaret GROUP BY kategori, kanal ORDER BY ciro DESC, kategori, kanal LIMIT 5`,'İki sütuna göre grupla, topla, sırala, ilk beşi al.']],
  panel:[
    ['Bölgelere göre ortalama gelir ve işsizlik?',`SELECT bolge, COUNT(*) AS gozlem, ROUND(AVG(gsyh)) AS ort_gsyh, ROUND(AVG(issizlik),1) AS ort_issizlik FROM panel GROUP BY bolge ORDER BY ort_gsyh DESC`,'Her gözlem bir il–yıl çiftidir; bölge ortalaması hem illeri hem yılları birlikte özetler.'],
    ['2025’te kişi başı geliri en yüksek 5 il hangisi?',`SELECT il, bolge, gsyh FROM panel WHERE yil = 2025 ORDER BY gsyh DESC, il LIMIT 5`,'Panelden tek bir yılı süzmek, kesit veri elde etmenin yoludur.'],
    ['Yıllara göre ortalama işsizlik nasıl değişti?',`SELECT yil, ROUND(AVG(issizlik),2) AS ort_issizlik FROM panel GROUP BY yil ORDER BY yil`,'Zaman boyutuna göre gruplamak: 16 satırlık bir zaman serisi elde edilir.'],
    ['2010 ve 2025’te ortalama gelir kaç?',`SELECT yil, ROUND(AVG(gsyh)) AS ort_gsyh FROM panel WHERE yil IN (2010, 2025) GROUP BY yil ORDER BY yil`,'İki dönemi yan yana koyar; büyüme oranını kendin hesaplayabilirsin.'],
    ['2025’te işsizliği %6’nın üstünde olan iller hangi bölgelerde?',`SELECT bolge, COUNT(*) AS il_sayisi FROM panel WHERE yil = 2025 AND issizlik > 6 GROUP BY bolge ORDER BY il_sayisi DESC, bolge`,'Kesit veride yüksek işsizliğin bölgesel dağılımı.'],
    ['2025’te eğitim yılı 10’u aşan iller hangileri?',`SELECT il, bolge, egitim, gsyh FROM panel WHERE yil = 2025 AND egitim > 10 ORDER BY egitim DESC, il LIMIT 10`,'Eğitim ve gelir yan yana: yüksek eğitimli illerde gelir de yüksek mi?'],
    ['16 yıllık ortalama geliri en yüksek 5 il?',`SELECT il, ROUND(AVG(gsyh)) AS ort_gsyh FROM panel GROUP BY il ORDER BY ort_gsyh DESC, il LIMIT 5`,'İle göre gruplayınca zaman etkisi ortalamaya karışır; kesit–zaman ayrımını düşün.']],
  memnun:[
    ['Şubelere göre ortalama memnuniyet ve bekleme süresi?',`SELECT sube, COUNT(*) AS yanit, ROUND(AVG(puan),2) AS ort_puan, ROUND(AVG(bekleme_dk),1) AS ort_bekleme FROM memnun GROUP BY sube ORDER BY ort_puan DESC, sube`,'Puan ile bekleme süresi aynı tabloda: yavaş şubeler daha mı düşük puan alıyor?'],
    ['Kaç yanıtta memnuniyet puanı boş?',`SELECT COUNT(*) AS bos_puan FROM memnun WHERE puan IS NULL`,'Cevapsızlık ankette önemli bir sorundur; boş bırakanlar rastgele mi, memnuniyetsiz olanlar mı?'],
    ['Bekleme süresi 15 dakikayı aşanların ortalama puanı ve tavsiye değeri?',`SELECT COUNT(*) AS yanit, ROUND(AVG(puan),2) AS ort_puan, ROUND(AVG(tavsiye),1) AS ort_tavsiye FROM memnun WHERE bekleme_dk > 15`,'Uzun bekleyenlerin özeti. Tüm anketin ortalamasıyla karşılaştırarak yorumla.'],
    ['Sadık ve yeni müşterilerin ortalama puanı ve tavsiye değeri?',`SELECT musteri, COUNT(puan) AS puanli, ROUND(AVG(puan),2) AS ort_puan, ROUND(AVG(tavsiye),1) AS ort_tavsiye FROM memnun GROUP BY musteri`,'İki müşteri tipini karşılaştırır.'],
    ['Yaş gruplarına göre ortalama tavsiye puanı?',`SELECT yas_grubu, COUNT(*) AS yanit, ROUND(AVG(tavsiye),1) AS ort_tavsiye FROM memnun GROUP BY yas_grubu ORDER BY ort_tavsiye DESC`,'Yaş grubu bir kategori değişkenidir; her grubun ortalaması tek satırda görünür.'],
    ['Her puan değerinden kaç yanıt var?',`SELECT puan, COUNT(*) AS yanit FROM memnun GROUP BY puan ORDER BY puan`,'Puan 1–5 sıralı bir ölçektir. Boş değerler tek bir grup oluşturur ve sıralamanın sonunda görünür.'],
    ['Tavsiye puanı 9 ve 10 olan (destekçi) yanıtlar şubelere göre kaç tane?',`SELECT sube, COUNT(*) AS destekci FROM memnun WHERE tavsiye >= 9 GROUP BY sube ORDER BY destekci DESC, sube`,'Net destekçi skoru (NPS) hesabının ilk adımı. Şubelerin toplam yanıt sayısını da hesaba kat.'],
    ['Puanı 1 ya da 2 olup 20 dakikadan fazla bekleyen yanıtlar şubelere göre?',`SELECT sube, COUNT(*) AS yanit FROM memnun WHERE puan IN (1, 2) AND bekleme_dk > 20 GROUP BY sube ORDER BY yanit DESC, sube`,'Memnuniyetsizlik ile uzun beklemenin birlikte görüldüğü yanıtları şubeye göre sayar.']],
  kredi:[
    ['Onay kararına göre ortalama skor ve gelir?',`SELECT onay, COUNT(*) AS basvuru, ROUND(AVG(skor)) AS ort_skor, ROUND(AVG(gelir)) AS ort_gelir FROM kredi GROUP BY onay`,'Onaylananlar ile reddedilenlerin profilini yan yana koyar.'],
    ['Sektörlere göre başvuru sayısı (boş sektör dahil)?',`SELECT sektor, COUNT(*) AS basvuru FROM kredi GROUP BY sektor ORDER BY basvuru DESC`,'GRUPLA boş değerleri ayrı bir grup yapar. Sektörü bilinmeyen başvurular tabloda boş satır olarak görünür.'],
    ['Skoru 700’ün üzerinde olduğu hâlde reddedilen kaç başvuru var?',`SELECT COUNT(*) AS reddedilen FROM kredi WHERE skor > 700 AND onay = 'Hayır'`,'Yüksek skorlu ama reddedilenler, skor dışındaki etkenlerin (gelir, borç) rolüne işaret eder.'],
    ['Borcu gelirinin %60’ını aşan başvurular onay durumuna göre kaç tane?',`SELECT onay, COUNT(*) AS basvuru FROM kredi WHERE borc/gelir > 0.6 GROUP BY onay`,'Sütunlar arası bir oran koşul olarak kullanılır.'],
    ['İstenen tutarı en yüksek 5 başvuru hangisi?',`SELECT no, gelir, skor, kredi_tutar, onay FROM kredi ORDER BY kredi_tutar DESC, no LIMIT 5`,'En büyük taleplerin skoru ve onay sonucunu birlikte okur.'],
    ['30 yaşından küçük onaylı başvurularda ortalama kredi tutarı?',`SELECT COUNT(*) AS basvuru, ROUND(AVG(kredi_tutar)) AS ort_tutar FROM kredi WHERE yas < 30 AND onay = 'Evet'`,'Genç ve onaylı başvurularla ilgili kesit özet.'],
    ['Sektörü belli olan başvurularda sektöre göre ortalama gelir?',`SELECT sektor, COUNT(*) AS basvuru, ROUND(AVG(gelir)) AS ort_gelir FROM kredi WHERE sektor IS NOT NULL GROUP BY sektor ORDER BY ort_gelir DESC`,'DOLUDUR ile boş sektörleri dışarıda bırakır.'],
    ['İstenen tutarı gelirinin 8 katını aşan başvurular onay durumuna göre?',`SELECT onay, COUNT(*) AS basvuru FROM kredi WHERE kredi_tutar/gelir > 8 GROUP BY onay`,'Çok yüksek taleplerin ne kadarı onay alıyor?']],
  enerji:[

    ['Ağustos aylarında şehirlere göre ortalama tüketim?',`SELECT sehir, ROUND(AVG(tuketim)) AS ort_tuketim FROM enerji WHERE ay LIKE '%-08' GROUP BY sehir ORDER BY ort_tuketim DESC`,'“-08” ile biten aylar, yıl fark etmeksizin tüm Ağustosları seçer.'],
    ['Erzurum’un 2025 aylık sıcaklık ve tüketimi?',`SELECT ay, sicaklik, tuketim FROM enerji WHERE sehir = 'Erzurum' AND ay LIKE '2025%' ORDER BY ay`,'On iki satırlık küçük bir zaman serisi: mevsimselliği gözle.'],
    ['Sanayi payı %45’i aşan kayıtlar şehirlere göre kaç tane?',`SELECT sehir, COUNT(*) AS kayit, ROUND(AVG(tuketim)) AS ort_tuketim FROM enerji WHERE sanayi_payi > 45 GROUP BY sehir ORDER BY kayit DESC, sehir`,'Sanayi ağırlıklı dönemlerin şehirlere dağılımı.'],
    ['Her şehirde en soğuk ve en sıcak ay kaç derece?',`SELECT sehir, MIN(sicaklik) AS en_soguk, MAX(sicaklik) AS en_sicak FROM enerji GROUP BY sehir ORDER BY sehir`,'Şehirlerin iklim aralığını karşılaştırır.']],
  saglik:[
    ['Diyabetli ve diyabetsizlerin ortalama yaş, BKİ ve tansiyonu?',`SELECT diyabet, COUNT(*) AS kisi, ROUND(AVG(yas),1) AS ort_yas, ROUND(AVG(bki),1) AS ort_bki, ROUND(AVG(sistolik)) AS ort_tansiyon FROM saglik GROUP BY diyabet`,'Diyabetle birlikte yaş ve BKİ de yüksekse, farkı tek bir etkene bağlama (karıştırıcı değişkenler).'],
    ['Sigara durumuna göre diyabetli sayısı?',`SELECT sigara, COUNT(*) AS diyabetli FROM saglik WHERE diyabet = 'Evet' GROUP BY sigara ORDER BY diyabetli DESC`,'Bu sayıyı grupların toplam büyüklüğüne bölmeden yorumlama; oran için Pivot sekmesindeki satır % seçeneğine bak.'],
    ['BKİ’si 30 ve üzeri olanlarda diyabet dağılımı?',`SELECT diyabet, COUNT(*) AS kisi FROM saglik WHERE bki >= 30 GROUP BY diyabet`,'Obezite kesitinde diyabetli ve diyabetsiz sayısı.'],
    ['Kolesterolü ölçülmemiş kaç kişi var?',`SELECT COUNT(*) AS eksik FROM saglik WHERE kolesterol IS NULL`,'Eksik ölçümlerin kimlerde yoğunlaştığını sonra yaş ve cinsiyete göre incele.'],
    ['60 yaşından büyük ve kolesterolü 240’ı aşan kişiler kimler?',`SELECT no, yas, cinsiyet, kolesterol, sistolik, diyabet FROM saglik WHERE yas > 60 AND kolesterol > 240 ORDER BY kolesterol DESC, no LIMIT 10`,'Yüksek riskli kesiti listeler. Boş kolesterol değerleri koşulu sağlamaz.'],
    ['Haftada 5 saatten fazla egzersiz yapanların ortalama BKİ ve tansiyonu?',`SELECT COUNT(*) AS kisi, ROUND(AVG(bki),1) AS ort_bki, ROUND(AVG(sistolik)) AS ort_tansiyon FROM saglik WHERE egzersiz_saat > 5`,'Aktif kesitin özeti; tüm örneklemin ortalamalarıyla karşılaştır.'],
    ['Cinsiyete göre ortalama kolesterol (ölçülenlerde)?',`SELECT cinsiyet, COUNT(kolesterol) AS olculen, ROUND(AVG(kolesterol)) AS ort_kolesterol FROM saglik GROUP BY cinsiyet`,'SAY(kolesterol) ölçülen kişi sayısını verir; ortalama yalnızca onlardan hesaplanır.'],
    ['Sistolik tansiyonu 140 ve üzeri olanlar sigara durumuna göre kaç kişi?',`SELECT sigara, COUNT(*) AS kisi FROM saglik WHERE sistolik >= 140 GROUP BY sigara ORDER BY kisi DESC, sigara`,'Yüksek tansiyon kesitinde sigara durumu dağılımı.']],
  okul:[
    ['Devlet ve özel okulların ortalama puanı ve bütçesi?',`SELECT tur, COUNT(*) AS okul, ROUND(AVG(puan)) AS ort_puan, ROUND(AVG(butce_bin_tl)) AS ort_butce FROM okul GROUP BY tur`,'Özel okulların puanı yüksekse bunu okul türüne mi, bulundukları bölgeye mi bağlamalı?'],
    ['Bölgelere göre ortalama puan?',`SELECT bolge, COUNT(puan) AS puanli, ROUND(AVG(puan)) AS ort_puan FROM okul GROUP BY bolge ORDER BY ort_puan DESC`,'Puanı boş okullar ortalamaya girmez; SAY(puan) kaç okulun puanı olduğunu gösterir.'],
    ['Özel okullar bölgelere nasıl dağılıyor?',`SELECT bolge, COUNT(*) AS ozel_okul FROM okul WHERE tur = 'Özel' GROUP BY bolge ORDER BY ozel_okul DESC, bolge`,'Özel okullar belli bölgelerde yoğunsa, bölge farkı tür farkıyla karışır (Simpson paradoksuna giriş).'],

    ['Öğrenci başına bütçesi en yüksek 5 okul hangisi?',`SELECT no, bolge, tur, ogrenci, butce_bin_tl, ROUND(butce_bin_tl/ogrenci,1) AS ogrenci_basi FROM okul ORDER BY ogrenci_basi DESC, no LIMIT 5`,'Toplam bütçeyi öğrenci sayısına bölerek farklı büyüklükteki okullar karşılaştırılır.'],
    ['Bölge ve türe göre ortalama puan?',`SELECT bolge, tur, COUNT(*) AS okul, ROUND(AVG(puan)) AS ort_puan FROM okul GROUP BY bolge, tur ORDER BY bolge, tur`,'Aynı bölge içinde devlet ve özel okulları karşılaştırmak, bölge etkisini sabit tutar.'],
    ['Öğrenci sayısı 800’ün üstündeki okullar türe göre kaç tane?',`SELECT tur, COUNT(*) AS okul FROM okul WHERE ogrenci > 800 GROUP BY tur`,'Büyük okulların devlet–özel dağılımı.']],
  tarim:[

    ['Buğdayın yıllara göre ortalama verimi ve yağışı?',`SELECT yil, ROUND(AVG(verim),2) AS ort_verim, ROUND(AVG(yagis)) AS ort_yagis FROM tarim WHERE urun = 'Buğday' GROUP BY yil ORDER BY yil`,'Tek ürün seçilerek zaman serisi oluşur. Verimin zamanla ortak bir trendi olabilir.'],
    ['Yağışı 300 mm’nin altında kalan kayıtlarda ürünlere göre ortalama verim?',`SELECT urun, COUNT(*) AS kayit, ROUND(AVG(verim),2) AS ort_verim FROM tarim WHERE yagis < 300 GROUP BY urun ORDER BY kayit DESC, urun`,'Kurak koşullarda hangi ürünler ne kadar etkileniyor?'],
    ['Bölgelere göre toplam ekim alanı (bin ha)?',`SELECT bolge, SUM(alan_bin_ha) AS toplam_alan FROM tarim GROUP BY bolge ORDER BY toplam_alan DESC`,'Tüm yıl ve ürünlerin alanları bölgeye göre toplanır.'],
    ['Fiyatı en yüksek 5 kayıt hangisi?',`SELECT yil, urun, bolge, fiyat FROM tarim ORDER BY fiyat DESC, yil, urun, bolge LIMIT 5`,'En yüksek fiyatlar hangi ürün ve yılda toplanıyor? Enflasyon yüzünden yeni yıllar öne çıkabilir.'],
    ['2025’te ürünlere göre ortalama fiyat?',`SELECT urun, ROUND(AVG(fiyat),1) AS ort_fiyat FROM tarim WHERE yil = 2025 GROUP BY urun ORDER BY ort_fiyat DESC`,'Son yılın fiyat sıralaması.'],
    ['Sıcaklığı 17 °C’yi aşan kayıtlarda ortalama yağış ve verim?',`SELECT COUNT(*) AS kayit, ROUND(AVG(yagis)) AS ort_yagis, ROUND(AVG(verim),2) AS ort_verim FROM tarim WHERE sicaklik > 17`,'Ürün karışımı farklı olduğu için verim ortalaması ürün bazında okunmalıdır.'],
    ['Mısır ve Pamuğun bölgelere göre ortalama verimi?',`SELECT urun, bolge, ROUND(AVG(verim),2) AS ort_verim FROM tarim WHERE urun IN ('Mısır','Pamuk') GROUP BY urun, bolge ORDER BY urun, ort_verim DESC`,'İki ürün seçilir, her biri bölgeye göre ayrı ayrı gruplanır.']],
  turizm:[

    hint:'Bölüme göre gruplayıp GANO ortalamasına bak; pivotta “Toplam: yüksekten düşüğe” sıralaması işini kolaylaştırır.',
    pv:{ds:'ogr',r:'bolum',c:'',v:'gano',a:'avg',o:'yuksek'},
    sql:`SELECT bolum, ROUND(AVG(gano),3) AS ort_gano FROM ogr GROUP BY bolum ORDER BY ort_gano DESC`,
    steps:['Satır: bolum, değer: gano, işlev: ortalama.','Satırları ortalamaya göre yüksekten düşüğe sırala.','İlk satırdaki bölüm cevaptır.'],
    how:'Bölüm bazında GANO ortalaması en büyük olan.',
    yorum:['Bölümler arasındaki fark büyük mü, küçük mü? Her bölümde kaç öğrenci var?','Fark anlamlı olmak için ne kadar büyük olmalı? (Hesaplayıcılar → t-testi)']},
  {id:'t9',ds:'ogr',lvl:2,tag:'SQL',unit:'TL',q:'4. sınıf öğrencilerinin ortalama aylık harcaması kaç TL? (boş değerler hariç, tam sayı)',tip:'sayi',ans:()=>mean(numsOf('ogr','harcama',r=>r.sinif===4)),tol:pctTol(()=>mean(numsOf('ogr','harcama',r=>r.sinif===4)),.01,30),
    hint:'Önce 4. sınıfı süz. ORTALAMA (AVG) boş değerleri zaten atlar; ama boşları 0 sayarsan sonuç düşer.',
    sql:`SELECT ROUND(AVG(harcama)) AS ort_harcama, COUNT(harcama) AS veri_var FROM ogr WHERE sinif = 4`,
    steps:['NEREDE sinif = 4 ile yalnızca 4. sınıfı al.','AVG(harcama) boş olmayan değerlerin ortalamasını verir.','COUNT(harcama) kaç öğrencinin verisi olduğunu gösterir; kontrol et.'],
    how:'sinif = 4 olan satırlarda harcama sütununun (boşlar hariç) ortalaması.',
    yorum:['Ortalama hesaplanırken kaç kişi dışarıda kaldı? Bu sonucu etkiler mi?','Sınıf arttıkça harcama neden artıyor olabilir?']},
  {id:'t10',ds:'magaza',lvl:2,tag:'SQL',unit:'',q:'Siparişlerinde ortalama indirim oranı en yüksek olan şehir hangisidir?',tip:'sec',opts:()=>uniqOf('magaza','sehir'),ans:()=>topKey(groupBy('magaza','sehir'),v=>mean(v.map(r=>r.indirim))),
    hint:'Şehre göre gruplayıp indirim sütununun ortalamasını al, sonra sırala.',
    sql:`SELECT sehir, ROUND(AVG(indirim),2) AS ort_indirim, COUNT(*) AS siparis FROM magaza GROUP BY sehir ORDER BY ort_indirim DESC`,
    steps:['Şehre göre GRUPLA.','Her şehirde ORTALAMA(indirim) hesapla.','AZALAN sırala; ilk satırdaki şehir cevaptır.'],
    how:'Şehir bazında indirim ortalaması en büyük olan.',
    yorum:['Şehirler arasındaki fark gerçek bir fark mı, yoksa şans eseri mi? Sipariş sayılarına bak.','İndirimin en yüksek olduğu şehirde ciro da yüksek mi?']},
  {id:'t11',ds:'magaza',lvl:3,tag:'SQL',unit:'%',q:'Toplam cironun (fiyat × adet) yüzde kaçı %20 indirimli siparişlerden gelmektedir? (1 ondalık)',tip:'sayi',ans:()=>{const o=R('magaza'),t=sum(o.map(r=>r.fiyat*r.adet)),a=sum(o.filter(r=>r.indirim===20).map(r=>r.fiyat*r.adet));return a/t*100},tol:()=>.3,
    hint:'İki ciro toplamı gerekiyor: yalnızca %20 indirimli siparişlerin cirosu ve tüm siparişlerin cirosu. Oranı kendin hesapla.',
    sql:`SELECT SUM(fiyat*adet) AS ciro_20 FROM magaza WHERE indirim = 20`,
    steps:['İlk sorgu: NEREDE indirim = 20 ile bu siparişlerin cirosunu topla.','İkinci sorgu: NEREDE’yi kaldırıp toplam ciroyu bul.','Pay = birinci / ikinci × 100.'],
    how:'Σ(fiyat×adet | indirim=20) / Σ(fiyat×adet) × 100.',
    yorum:['İndirimli siparişlerin payı ile ciro payı neden farklı olabilir?','İndirim cirodan düşülmedi; gerçek geliri bulmak için ne yapardın?']},
  {id:'t12',ds:'makro',lvl:1,tag:'SQL',unit:'ay',q:'144 aylık seride faiz oranının %30’u aştığı kaç ay vardır?',tip:'sayi',ans:()=>R('makro').filter(r=>r.faiz>30).length,tol:()=>0,
    hint:'NEREDE faiz > 30 ile süz ve satırları say.',
    sql:`SELECT COUNT(*) AS ay_sayisi FROM makro WHERE faiz > 30`,
    steps:['Tablo: makro.','NEREDE faiz > 30 koşulunu yaz.','SAY(*) ile kalan satırları say.'],
    how:'faiz > 30 olan ayların sayısı.',
    yorum:['Bu aylar peş peşe mi, dağınık mı? (Ayları listeleyip bak.)','Yüksek faiz dönemlerinde enflasyon ve kur nasıl davranmış?']},
  {id:'t13',ds:'ulke',lvl:2,tag:'İstatistik',unit:'',q:'Kişi başı gelir (gelir) ile ortalama ömür (omur) arasındaki Pearson korelasyonu kaçtır? (2 ondalık)',tip:'sayi',ans:()=>prOf('ulke','gelir','omur'),tol:()=>.03,
    hint:'Atölye’de “Ülkeler karşılaştırması”nı aç, Korelasyon ve regresyon sekmesindeki matristen oku.',
    steps:['Veri Atölyesi’nde “Ülkeler karşılaştırması”nı aç.','Korelasyon ve regresyon sekmesine geç.','gelir ile omur kesişimindeki r değerini oku.'],
    how:'Pearson r(gelir, omur). İlişki doğrusaldan çok logaritmiktir; bu yüzden r güçlü ama 1’den belirgin biçimde küçüktür.',
    yorum:['Zengin ülkelerde ömür neden uzun? Gelir mi ömrü artırıyor, yoksa sağlık ve eğitim ikisini birden mi etkiliyor?','İlişki doğrusal mı? Geliri logaritmaya çevirsen r nasıl değişirdi?']},
  {id:'t14',ds:'ulke',lvl:2,tag:'Pivot',unit:'',q:'Ortalama gini katsayısı en yüksek (gelir eşitsizliği en fazla) olan bölge hangisidir? (Boş değerler hariç)',tip:'sec',opts:()=>uniqOf('ulke','bolge'),ans:()=>topKey(groupBy('ulke','bolge'),v=>mean(v.map(r=>r.gini).filter(nn))),
    hint:'Bölgeye göre gruplayıp gini ortalamasına bak. Boş gini değerleri ortalamaya girmez.',
    pv:{ds:'ulke',r:'bolge',c:'',v:'gini',a:'avg',o:'yuksek'},
    sql:`SELECT bolge, ROUND(AVG(gini),1) AS ort_gini, COUNT(gini) AS veri_var FROM ulke GROUP BY bolge ORDER BY ort_gini DESC`,
    steps:['Satır: bolge, değer: gini, işlev: ortalama.','Yüksekten düşüğe sırala.','COUNT(gini) ile her bölgede kaç ülkenin verisi olduğuna da bak.'],
    how:'Bölge bazında gini ortalaması en büyük olan.',
    yorum:['Gini’si bilinmeyen ülkeler sonucu nasıl etkiler?','Bölge ortalaması, bölge içindeki farkları gizler mi?']},
  {id:'t15',ds:'ulke',lvl:1,tag:'SQL',unit:'ülke',q:'Enflasyonu %10’un üzerinde olan kaç ülke vardır?',tip:'sayi',ans:()=>R('ulke').filter(r=>r.enflasyon>10).length,tol:()=>0,
    hint:'NEREDE enflasyon > 10 ile süz ve say.',
    sql:`SELECT COUNT(*) AS ulke_sayisi FROM ulke WHERE enflasyon > 10`,
    steps:['Tablo: ulke.','NEREDE enflasyon > 10.','SAY(*) ile say.'],
    how:'enflasyon > 10 olan ülkelerin sayısı.',
    yorum:['Yüksek enflasyonlu ülkeler hangi bölgelerde yoğunlaşıyor?','Bu ülkelerin kişi başı geliri düşük mü?']},
  {id:'t16',ds:'hane',lvl:2,tag:'İstatistik',unit:'TL',q:'Hanehalkı aylık gelirinin (gelir) medyanı kaç TL? (en yakın yüzlüğe)',tip:'sayi',ans:()=>median(numsOf('hane','gelir')),tol:pctTol(()=>median(numsOf('hane','gelir')),.01,150),
    hint:'Atölye’de “Hanehalkı bütçe anketi”nin gelir sütununun özetindeki “medyan” değerine bak.',
    steps:['Veri Atölyesi’nde “Hanehalkı bütçe anketi”ni aç.','Veri sekmesindeki sütun özetinde gelir satırını bul.','“medyan” değerini oku.'],
    how:'gelir sütununun medyanı (sıralanınca ortadaki değer).',
    yorum:['Medyan ile ortalama arasındaki fark neyi gösteriyor? (çarpıklık)','Bir yetkili “ortalama hane geliri arttı” dese, medyana bakmak neden önemli?']},
  {id:'t17',ds:'hane',lvl:3,tag:'Yorum',unit:'puan',q:'Geliri 20.000 TL ve altındaki hanelerin ortalama gıda payı (gıda ÷ gelir), geliri 60.000 TL ve üzerindekilerden kaç yüzde puan yüksektir? (1 ondalık)',tip:'sayi',ans:()=>{const o=R('hane'),sh=a=>mean(a.map(r=>r.gida/r.gelir))*100;return sh(o.filter(r=>r.gelir<=20000))-sh(o.filter(r=>r.gelir>=60000))},tol:()=>.5,
    hint:'Her hane için gida/gelir oranını hesapla, iki gelir grubunda ayrı ayrı ortalamasını al ve farkı bul.',
    sql:`SELECT COUNT(*) AS hane, ROUND(AVG(gida/gelir)*100,1) AS gida_payi FROM hane WHERE gelir <= 20000`,
    steps:['İlk sorgu: NEREDE gelir <= 20000 için ortalama gıda payını (gıda/gelir × 100) hesapla.','İkinci sorgu: koşulu gelir >= 60000 yap.','İki sonucun farkını al (düşük gelirli − yüksek gelirli).'],
    how:'mean(gida/gelir | gelir≤20000) − mean(gida/gelir | gelir≥60000), yüzde puan olarak.',
    yorum:['Bu bulgu Engel yasasıyla nasıl örtüşüyor? (Gelir arttıkça gıdaya ayrılan pay…)','Gıdanın TL tutarı da düşük gelirlilerde mi daha az? Payı ve tutarı ayır.','Hane büyüklüğü sonucu nasıl etkiliyor olabilir?']},
  {id:'t18',ds:'hane',lvl:2,tag:'SQL',unit:'%',q:'Kiracı hanelerde (ev_sahibi = Hayır) kira, gelirin ortalama yüzde kaçıdır? (1 ondalık)',tip:'sayi',ans:()=>mean(R('hane').filter(r=>r.ev_sahibi==='Hayır').map(r=>r.kira/r.gelir))*100,tol:()=>.3,
    hint:'Önce kiracıları süz, sonra her hane için kira/gelir oranının ortalamasını al. Sonucu 100 ile çarpmayı unutma.',
    sql:`SELECT ROUND(AVG(kira/gelir)*100,1) AS ort_kira_payi, COUNT(*) AS hane FROM hane WHERE ev_sahibi = 'Hayır'`,
    steps:['NEREDE ev_sahibi = ’Hayır’ ile kiracıları süz (metin tek tırnak içinde).','Sütunlar arası işlem: kira/gelir.','ORTALAMA ile ortalamasını al ve 100 ile çarp.'],
    how:'mean(kira/gelir) × 100, yalnızca kiracı haneler için.',
    yorum:['Kira yükü %30’u geçerse hane için ne anlama gelir?','Büyükşehirdeki kiracılar ile kırsaldakiler arasında fark var mı?']},
  {id:'t19',ds:'hisse',lvl:2,tag:'SQL',unit:'',q:'96 aylık dönemde ortalama aylık getirisi en yüksek olan sektör hangisidir?',tip:'sec',opts:()=>uniqOf('hisse','sektor'),ans:()=>topKey(groupBy('hisse','sektor'),v=>mean(v.map(r=>r.getiri))),
    hint:'Sektöre göre gruplayıp getiri sütununun ortalamasını al.',
    pv:{ds:'hisse',r:'sektor',c:'',v:'getiri',a:'avg',o:'yuksek'},
    sql:`SELECT sektor, ROUND(AVG(getiri),2) AS ort_getiri FROM hisse GROUP BY sektor ORDER BY ort_getiri DESC`,
    steps:['Sektöre göre GRUPLA.','ORTALAMA(getiri) hesapla.','AZALAN sırala; ilk satır cevaptır.'],
    how:'Sektör bazında aylık getiri ortalaması en büyük olan.',
    yorum:['Yüksek ortalama getiri yüksek risk demek mi? (Sonraki göreve bak.)','Üç yıllık bir dönem sektör sıralamasını geleceğe genelleyebilir mi?']},
  {id:'t20',ds:'hisse',lvl:2,tag:'SQL',unit:'',q:'Aylık getirisinin en yüksek ve en düşük değeri arasındaki fark (aralık) en geniş olan hisse hangisidir?',tip:'sec',opts:()=>uniqOf('hisse','hisse'),ans:()=>topKey(groupBy('hisse','hisse'),v=>Math.max(...v.map(r=>r.getiri))-Math.min(...v.map(r=>r.getiri))),
    hint:'Her hisse için EN_ÇOK(getiri) − EN_AZ(getiri) hesapla ve sırala.',
    sql:`SELECT hisse, MIN(getiri) AS en_dusuk, MAX(getiri) AS en_yuksek, ROUND(MAX(getiri)-MIN(getiri),2) AS aralik FROM hisse GROUP BY hisse ORDER BY aralik DESC`,
    steps:['Hisseye göre GRUPLA.','Her grupta MAX(getiri) − MIN(getiri) hesapla.','AZALAN sırala; ilk satırdaki hisse cevaptır.'],
    how:'Hisse bazında max(getiri) − min(getiri) en büyük olan.',
    yorum:['Aralık riskin kaba bir ölçüsüdür; neden standart sapma daha güvenilir?','En geniş aralıklı hisse aynı zamanda en yüksek ortalama getiriye sahip mi?']},
  {id:'t21',ds:'hisse',lvl:2,tag:'SQL',unit:'%',q:'TKNO hissesinin kapanış fiyatı 2023-01’den 2025-12’ye toplam yüzde kaç değişmiştir? (1 ondalık)',tip:'sayi',ans:()=>{const o=R('hisse'),a=o.find(r=>r.hisse==='TKNO'&&r.ay==='2023-01').kapanis,b=o.find(r=>r.hisse==='TKNO'&&r.ay==='2025-12').kapanis;return(b/a-1)*100},tol:()=>.5,
    hint:'İki kapanış fiyatına ihtiyacın var: 2023-01 ve 2025-12. Değişim = (son ÷ ilk − 1) × 100.',
    sql:`SELECT ay, kapanis FROM hisse WHERE hisse = 'TKNO' AND ay IN ('2023-01', '2025-12')`,
    steps:['NEREDE ile TKNO hissesini ve iki ayı seç (İÇİNDE kullan).','İki kapanış fiyatını not et.','(Son ÷ İlk − 1) × 100 formülüyle yüzde değişimi hesapla.'],
    how:'(kapanış 2025-12 ÷ kapanış 2023-01 − 1) × 100.',
    yorum:['Toplam getiri ile ortalama aylık getiri aynı şey mi? (Bileşik getiri)','Dönemin başlangıç ve bitiş tarihini değiştirmek sonucu nasıl değiştirir?']},
  {id:'t22',ds:'eticaret',lvl:1,tag:'SQL',unit:'%',q:'Siparişlerin yüzde kaçı iade edilmiştir (iade = Evet)? (1 ondalık)',tip:'sayi',ans:()=>R('eticaret').filter(r=>r.iade==='Evet').length/R('eticaret').length*100,tol:()=>.3,
    hint:'İade edilenleri ve tüm siparişleri say, sonra oranla.',sql:`SELECT iade, COUNT(*) AS siparis FROM eticaret GROUP BY iade`,
    steps:['Siparişleri iade durumuna göre GRUPLA ve SAY.','“Evet” satırındaki sayıyı toplam sipariş sayısına böl.','100 ile çarp.'],how:'iade=Evet sayısı ÷ toplam sipariş × 100.',
    yorum:['Bu oran sence yüksek mi? Hangi kategoride daha yüksek olmasını beklersin?','İade oranını sipariş sayısına mı, tutara mı göre hesaplamak daha doğru olur?']},
  {id:'t23',ds:'eticaret',lvl:1,tag:'SQL',unit:'sipariş',q:'Kaç siparişin müşteri puanı (puan) boştur?',tip:'sayi',ans:()=>R('eticaret').filter(r=>r.puan==null).length,tol:()=>0,
    hint:'Boş değer “= NULL” ile aranmaz; BOŞTUR (IS NULL) kullan.',sql:`SELECT COUNT(*) AS bos_puan FROM eticaret WHERE puan IS NULL`,
    steps:['Tablo: eticaret.','NEREDE puan BOŞTUR ile eksikleri süz.','SAY(*) ile say.'],how:'puan sütununda boş olan satır sayısı.',
    yorum:['Puan vermeyenler memnun mu, memnuniyetsiz mi? Eksiklik rastgele mi?','Ortalama puanı yalnızca puan verenlerden hesaplamak yanlılık yaratır mı?']},
  {id:'t24',ds:'eticaret',lvl:3,tag:'SQL',unit:'sipariş',q:'Giyim kategorisinde fiyatı 3.000 TL’nin üzerinde kaç sipariş vardır? (Bu satırların neden şüpheli olduğunu düşün.)',tip:'sayi',ans:()=>R('eticaret').filter(r=>r.kategori==='Giyim'&&r.fiyat>3000).length,tol:()=>0,
    hint:'Giyimin tipik fiyatı birkaç yüz TL. Önce kategoriye göre ortalama ve en yüksek fiyata bak, sonra eşiği uygula.',sql:`SELECT kategori, ROUND(AVG(fiyat)) AS ort, MAX(fiyat) AS en_yuksek FROM eticaret GROUP BY kategori`,
    steps:['Kategori bazında ortalama ve en yüksek fiyatı karşılaştır.','NEREDE kategori = ’Giyim’ VE fiyat > 3000 koşulunu yaz.','SAY(*) ile kaç satır kaldığını bul.'],how:'kategori=Giyim ve fiyat>3000 olan satır sayısı. Bunlar büyük olasılıkla fazladan sıfır girilmiş kayıtlardır.',
    yorum:['Bu satırlar hata mı, gerçek uç sipariş mi? Nasıl ayırt edersin?','Silmek, düzeltmek ve olduğu gibi bırakmak ortalama fiyatı nasıl değiştirir?']},
  {id:'t25',ds:'eticaret',lvl:3,tag:'İstatistik',unit:'',q:'Kargo süresi (kargo_gun) ile müşteri puanı (puan) arasındaki Pearson korelasyonu kaçtır? (2 ondalık, boş puanlar hariç)',tip:'sayi',ans:()=>prOf('eticaret','kargo_gun','puan'),tol:()=>.03,
    hint:'Atölye’de e-ticaret verisini aç; Korelasyon ve regresyon sekmesindeki matristen oku. Boş puanlar otomatik dışarıda kalır.',
    steps:['Veri Atölyesi’nde “E-ticaret siparişleri”ni aç.','Korelasyon ve regresyon sekmesine geç.','kargo_gun ile puan kesişimini oku.'],how:'Pearson r, iki sütunun da dolu olduğu satırlarda.',
    yorum:['r’yi kelimeyle ifade et: yön ve güç.','Puanı boş bırakanlar ilişkiyi değiştirebilir mi?','Geç teslimat mı düşük puanı getiriyor, yoksa iade mi ikisini birden etkiliyor?']},
  {id:'t26',ds:'eticaret',lvl:2,tag:'SQL',unit:'',q:'İade oranı en yüksek olan satış kanalı hangisidir?',tip:'sec',opts:()=>uniqOf('eticaret','kanal'),ans:()=>topKey(groupBy('eticaret','kanal'),v=>mean(v.map(r=>r.iade==='Evet'?1:0))),
    hint:'Kanal ve iade durumuna göre say; her kanalda Evet payını karşılaştır.',sql:`SELECT kanal, iade, COUNT(*) AS adet FROM eticaret GROUP BY kanal, iade ORDER BY kanal`,
    steps:['Kanal ve iadeye göre GRUPLA ve SAY.','Her kanal için Evet ÷ (Evet + Hayır) hesapla.','En büyük oranlı kanalı seç.'],how:'Kanal bazında iade=Evet payı en büyük olan.',
    yorum:['Kanallar arasındaki fark büyük mü? Sipariş sayıları yeterli mi?','Bu farkı kargo süresi açıklıyor olabilir mi?']},
  {id:'t27',ds:'eticaret',lvl:3,tag:'Yorum',unit:'gün',q:'İade edilen siparişlerin ortalama kargo süresi, iade edilmeyenlerden kaç gün uzundur? (İade − Normal, 2 ondalık)',tip:'sayi',ans:()=>{const o=R('eticaret'),m=f=>mean(o.filter(r=>r.iade===f).map(r=>r.kargo_gun));return m('Evet')-m('Hayır')},tol:()=>.1,
    hint:'İade durumuna göre gruplayıp kargo_gun ortalamasını al, farkı bul.',sql:`SELECT iade, ROUND(AVG(kargo_gun),2) AS ort_kargo, COUNT(*) AS siparis FROM eticaret GROUP BY iade`,
    steps:['iade değerine göre GRUPLA.','Her grupta AVG(kargo_gun) hesapla.','Evet grubundan Hayır grubunu çıkar.'],how:'mean(kargo | Evet) − mean(kargo | Hayır).',
    yorum:['Fark nedensel mi? Yavaş kargo iadeyi mi artırıyor?','Pazaryeri kanalı hem yavaş hem iade riskli ise karıştırıcı etken olabilir mi?']},
  {id:'t28',ds:'panel',lvl:2,tag:'SQL',unit:'',q:'2025 yılında kişi başı geliri (gsyh) en yüksek olan il hangisidir?',tip:'sec',opts:()=>uniqOf('panel','il'),ans:()=>[...R('panel').filter(r=>r.yil===2025)].sort((a,b)=>b.gsyh-a.gsyh)[0].il,
    hint:'Önce yalnızca 2025 satırlarını süz, sonra gsyh’ye göre azalan sırala.',sql:`SELECT il, bolge, gsyh FROM panel WHERE yil = 2025 ORDER BY gsyh DESC LIMIT 3`,
    steps:['NEREDE yil = 2025.','SIRALA gsyh AZALAN.','İlk satırdaki il cevaptır.'],how:'yil=2025 satırlarında en büyük gsyh.',
    yorum:['Tek yılın sıralaması kalıcı farkı mı, o yılın şansını mı yansıtıyor?','Aynı ilin 2010’daki sırasına da bak.']},
  {id:'t29',ds:'panel',lvl:3,tag:'Yorum',unit:'',q:'Tüm 640 gözlemde eğitim yılı (egitim) ile işsizlik arasındaki havuzlanmış Pearson korelasyonu kaçtır? (2 ondalık)',tip:'sayi',ans:()=>prOf('panel','egitim','issizlik'),tol:()=>.03,
    hint:'Atölye’de il panelini aç; korelasyon matrisinden egitim–issizlik hücresini oku. Sonra “bu r neyi karıştırıyor?” diye sor.',

    kontrol:{q:'Yazın dondurma satışları ve boğulma vakaları birlikte artıyor. En makul açıklama hangisidir?',o:['Dondurma yemek boğulmaya yol açar','Sıcak hava (karıştırıcı) ikisini birden artırır','Boğulmalar dondurma satışını artırır'],c:1,a:'Sıcak hava hem dondurma tüketimini hem denize girmeyi artırır; ilişki ortak bir üçüncü etkenden gelir.'},
    dene:[{t:'Atölye’de aç (faiz–kur)',ds:'makro'}]},
  {id:'sim',e:'🧮',t:'Simpson paradoksu',trk:'İstatistik',lv:3,dk:4,ozet:'Toplamda görünen eğilim, alt gruplarda tersine dönebilir.',
    p:['Bir gruptaki eğilim, alt gruplar ayrı incelenince tersine dönebilir. Klasik bir böbrek taşı tedavisi örneği (Charig ve ark., 1986):','Tedavi A: küçük taşlarda %93 (81/87), büyük taşlarda %73 (192/263); toplamda %78 (273/350).\nTedavi B: küçük taşlarda %87 (234/270), büyük taşlarda %69 (55/80); toplamda %83 (289/350).','A her alt grupta daha başarılı, ama toplamda B daha iyi görünüyor; çünkü A ağırlıklı olarak zor (büyük taş) vakalara uygulanmış. Dersi: toplam rakama bakmadan önce grupların bileşimini sor.'],demo:demoSimpson,
    kontrol:{q:'Simpson paradoksunun temel nedeni hangisidir?',o:['Hesaplama hatası','Alt grupların büyüklüğünün ve bileşiminin farklı olması','Örneklemin küçük olması'],c:1,a:'Tedavilerin farklı zorlukta vakalara uygulanması (grup bileşimi), toplam oranları alt grup oranlarından farklı yönde etkiler.'},
    dene:[]},
  {id:'reg',e:'📈',t:'Regresyon: eğim ve R² nasıl okunur?',trk:'İstatistik',lv:3,dk:4,ozet:'Eğim “ortalama değişimi”, R² “açıklanan payı” gösterir; ikisi de nedensellik değildir.',
    p:['Basit regresyon veriye bir doğru uydurur: y = a + b·x. Eğim (b), x bir birim arttığında y’nin ortalamada kaç birim değiştiğini söyler. Bu bir ilişki betimlemesidir; nedensellik iddiası değildir.','R², y’deki değişimin ne kadarının doğru tarafından açıklandığını gösterir (0 ile 1 arası). Eğimin p-değeri ise eğimin sıfırdan ayırt edilip edilemediğini söyler. Küçük p ve düşük R² birlikte olabilir: ilişki gerçek ama zayıf demektir.','Dene: Atölye → Korelasyon ve regresyon sekmesinde calisma_saat → gano regresyonunu çalıştır; eğimi birimleriyle birlikte cümleye dök.'],
    kontrol:{q:'calisma_saat → gano regresyonunda eğim 0,045 çıktı. Doğru okuma hangisidir?',o:['Haftada 1 saat daha fazla çalışanın GANO’su ortalamada yaklaşık 0,045 puan daha yüksektir','Çalışmak GANO’yu kesinlikle 0,045 puan artırır','GANO’daki değişimin %4,5’i çalışmayla açıklanır'],c:0,a:'Eğim ortalama farkı betimler. “Kesinlikle artırır” nedensellik iddiasıdır; “%4,5 açıklanır” ise R²’nin yorumudur, eğimin değil.'},
    dene:[{t:'Atölye’de aç (öğrenci anketi)',ds:'ogr'}]},
  /* ── Grafik ve veri ── */
  {id:'grf',e:'📉',t:'Yanıltıcı grafikleri yakalama listesi',trk:'Grafik ve veri',lv:1,dk:3,ozet:'Bir grafiğe güvenmeden önce eksene, aralığa ve kaynağa bak.',
    p:['• Çubuk grafikte eksen 0’dan mı başlıyor?','• Zaman aralığı özenle mi seçilmiş (kiraz toplama)?','• İki eksenli grafikte ölçekler sonucu değiştiriyor mu?','• Alan veya hacimle gösterilen değerler (3B, daire) gerçek oranı abartıyor mu?','• Kaynak, tarih ve örneklem büyüklüğü belirtilmiş mi?','Aşağıda aynı veriyi iki farklı eksenle gör:'],demo:demoAxis,
    kontrol:{q:'Çubuk grafikte dikey eksen 94’ten başlıyorsa ne olur?',o:['Çubuklar arasındaki farklar olduğundan büyük görünür','Farklar küçük görünür','Hiçbir etkisi olmaz'],c:0,a:'Çubuğun uzunluğu değeri temsil ettiği için eksen kesilince oranlar bozulur ve küçük farklar büyük gösterilir.'},
    dene:[]},
  {id:'tem',e:'🧹',t:'Veri temizleme kontrol listesi',trk:'Grafik ve veri',lv:2,dk:3,ozet:'Analizden önce eksik değerleri, birimleri ve türleri kontrol et.',
    p:['• Eksik değerler: kaç tane, neden eksik, nasıl ele alacaksın?','• Tekrarlanan satırlar var mı?','• Birimler ve ölçekler tutarlı mı (TL / bin TL, % / oran)?','• Tarih ve sayı biçimleri tutarlı mı (virgül / nokta)?','• Aykırı değerler hata mı, gerçek uç gözlem mi?','• Sütun türleri doğru mu (sayı mı, metin mi)?','Eksik değeri 0 saymak sık yapılan bir hatadır. Öğrenci anketindeki harcama sütunuyla dene:'],demo:demoMissing,
    kontrol:{q:'Eksik harcama değerlerini 0 sayarsan ortalama harcama ne olur?',o:['Olduğundan düşük çıkar','Olduğundan yüksek çıkar','Değişmez'],c:0,a:'Bilgisi olmayan kişiler “0 harcadı” sayıldığı için toplam aynı kalır ama bölen büyür; ortalama aşağı iner.'},
    dene:[{t:'SQL’de dene',sql:`SELECT sinif, ROUND(AVG(COALESCE(harcama,0))) AS ort_harcama FROM ogr GROUP BY sinif ORDER BY sinif`}]},
  /* ── SQL ve Pivot ── */
  {id:'sq1',e:'🔎',t:'SQL’e giriş: seç, süz, sırala',trk:'SQL ve Pivot',lv:1,dk:4,ozet:'Her sorgu üç soruya cevap verir: hangi sütunlar, hangi tablo, hangi satırlar.',
    p:['SQL, tablodan soru sorma dilidir. Her sorgu üç temel soruya cevap verir: hangi sütunlar (SEÇ), hangi tablo (NEREDEN), hangi satırlar (NEREDE). Komutları Türkçe ya da standart İngilizce (SELECT, FROM, WHERE) yazabilirsin; ikisi aynı çalışır.','Sıra önemlidir: önce NEREDE satırları süzer, sonra SIRALA sıralar, en sonda SINIRLA ilk n satırı alır. Örnek: “4. sınıf öğrencilerinden GANO’su en yüksek 5’ini göster” sorusu tek bir sorguyla sorulur. “SQL’de dene” düğmesi bu sorguyu kutuya yazar.'],
    p2:[`Eksik değeri aramak için “= NULL” yazma; çalışmaz. BOŞTUR (IS NULL) veya DOLUDUR (IS NOT NULL) kullan. Metin değerleri tek tırnak içine al (staj = 'Var'); ondalıklarda virgül değil nokta kullan (2.5).`],
    kontrol:{q:'Hangi sorgu 2. sınıf öğrencilerini GANO’ya göre yüksekten düşüğe listeler?',o:['SEÇ * NEREDEN ogr NEREDE sinif = 2 SIRALA gano AZALAN','SEÇ * NEREDEN ogr SIRALA gano AZALAN NEREDE sinif = 2','SEÇ sinif NEREDE ogr NEREDEN gano'],c:0,a:'Sıra SEÇ → NEREDEN → NEREDE → SIRALA şeklindedir. Diğer seçeneklerde komutların sırası bozuk.'},
    dene:[{t:'SQL’de dene',sql:`SELECT bolum, sinif, gano FROM ogr WHERE sinif = 4 ORDER BY gano DESC LIMIT 5`}]},
  {id:'sq2',e:'🧱',t:'Gruplama, özetleme ve pivot',trk:'SQL ve Pivot',lv:2,dk:5,ozet:'Pivot tablo, iki sütuna göre gruplamanın tablo biçimidir.',
    p:['GRUPLA, satırları bir sütundaki ortak değere göre kümelere ayırır; SAY, TOPLAM, ORTALAMA, EN_AZ, EN_ÇOK gibi özet işlevler her küme için tek bir değer üretir. “Bölüme göre ortalama GANO”, bölümleri gruplamak ve her grupta GANO ortalaması almaktır. “SQL’de dene” düğmesiyle sorguyu kutuya gönderebilirsin.'],
    p2:['Pivot tablo, iki sütuna göre gruplamanın çapraz tablo biçimidir: satırlarda bölüm, sütunlarda sınıf, hücrede ortalama GANO. Excel’deki pivotla aynı mantık. SQL’de bunu GRUPLA bolum, sinif ile yaparsın; Pivot sekmesi sonucu çapraz tablo olarak dizer.','NEREDE ile GRUPTA farkı: NEREDE gruplamadan önce satırları süzer, GRUPTA gruplamadan sonra grupları süzer. “GANO’su 3’ten büyük öğrenciler” bir NEREDE sorusudur; “ortalama GANO’su 3’ten büyük bölümler” bir GRUPTA sorusudur.'],
    kontrol:{q:'Hangi koşul GRUPTA (HAVING) ile yazılmalıdır?',o:['GANO’su 3’ten büyük öğrenciler','Ortalama GANO’su 3’ten büyük bölümler','Stajı olan öğrenciler'],c:1,a:'Koşul gruplanmış bir özet değer (ortalama) üzerinde olduğu için gruplamadan sonra uygulanmalıdır.'},
    dene:[{t:'SQL’de dene',sql:`SELECT bolum, COUNT(*) AS kisi, ROUND(AVG(gano),2) AS ort_gano FROM ogr GROUP BY bolum ORDER BY ort_gano DESC`},{t:'Pivot’ta dene',pv:{ds:'ogr',r:'bolum',c:'sinif',v:'gano',a:'avg'}}]},
  {id:'ind',e:'🧭',t:'Endeks ve baz yılı',trk:'Temel',lv:2,dk:4,ozet:'Endeks, farklı birimlerdeki değişimi ortak bir tabana indirir.',
    p:['Endeks, bir değerin baz dönemdeki değere oranının 100 ile çarpılmasıyla bulunur: endeks = (değer ÷ baz değer) × 100. Baz dönem 100 kabul edilir; 125 değeri “baza göre %25 artış” demektir.','Endeksler farklı birimlerdeki serileri karşılaştırmayı sağlar (dolar ve TL gibi). Ama baz seçimi görüntüyü değiştirir: serilerin başlangıç noktası eşitlendiği için büyümeler birbirine yaklaşır ya da açılır. Baz yılları farklı iki endeksi doğrudan karşılaştırma.'],
    kontrol:{q:'Baz dönemin endeksi 100, bugünkü endeks 140 ise ne söylenebilir?',o:['Baza göre %40 artış var','Baza göre %140 artış var','Baza göre 40 yüzde puan düşüş var'],c:0,a:'Endeks 100’den 140’a çıktıysa değer baza göre %40 artmıştır.'},
    dene:[{t:'Atölye’de aç (makro seri)',ds:'makro'}]},
  {id:'bil',e:'📈',t:'Bileşik büyüme ve geometrik ortalama',trk:'Temel',lv:2,dk:4,ozet:'Ardışık yüzdeler toplanmaz, çarpılır.',
    p:['Yıllık %10 büyüme iki yılda %20 değil %21 ekler: 1,10 × 1,10 = 1,21. Çünkü ikinci yılın büyümesi, birinci yılın artışı üzerine de uygulanır.','Ortalama büyüme için aritmetik değil geometrik ortalama kullanılır. İlk yıl +%50, ikinci yıl −%50 ise ortalama “%0” değildir: 100 → 150 → 75, yani toplamda −%25. Aşağıdaki aracı dene.'],demo:demoBase,
    kontrol:{q:'100 TL önce %50 artıp sonra %50 azalırsa kaç TL olur?',o:['100 TL','75 TL','125 TL'],c:1,a:'100 × 1,5 = 150; 150 × 0,5 = 75. Düşüşün tabanı artık 150’dir.'},
    dene:[]},
  {id:'cey',e:'📦',t:'Çeyrekler ve kutu grafiği',trk:'İstatistik',lv:2,dk:3,ozet:'Çeyrekler dağılımı dört eşit parçaya böler; IQR ortadaki %50’yi ölçer.',
    p:['Veriyi sıraladığında medyan ortadaki değerdir; Q1 alt yarının, Q3 üst yarının medyanıdır. Q1 ile Q3 arası verinin ortadaki %50’sini kapsar; bu genişliğe çeyrekler arası açıklık (IQR = Q3 − Q1) denir.','Kutu grafiği medyanı, çeyrekleri ve uçları tek bakışta gösterir. Pratik aykırı değer kuralı: Q1 − 1,5 × IQR’nin altındaki ve Q3 + 1,5 × IQR’nin üstündeki değerler şüphelidir. Şüpheli demek hatalı demek değildir; önce nedenini araştır.'],
    kontrol:{q:'IQR neyi gösterir?',o:['En büyük ve en küçük değer arasındaki farkı','Verinin ortadaki %50’lik kısmının genişliğini','Ortalamanın standart sapmasını'],c:1,a:'IQR = Q3 − Q1; uç değerlerden etkilenmeyen bir yayılım ölçüsüdür.'},
    dene:[{t:'Atölye’de aç (konut fiyatları)',ds:'konut'}]},
  {id:'nor',e:'🔔',t:'Normal dağılım ve z-puanı',trk:'İstatistik',lv:2,dk:4,ozet:'z-puanı bir değerin ortalamadan kaç standart sapma uzakta olduğunu söyler.',
    p:['z-puanı = (değer − ortalama) ÷ standart sapma. Farklı ölçeklerdeki değerleri (örneğin iki ayrı sınavın notunu) aynı çetvelle karşılaştırmanı sağlar.','Çan biçimli (normal) dağılımda değerlerin yaklaşık %68’i ±1, %95’i ±2 standart sapma içinde kalır. |z| > 2 olan değerler nadirdir; ama nadir olmak hata olmak demek değildir.'],
    kontrol:{q:'A sınavında ortalama 60, standart sapma 10; B sınavında ortalama 70, standart sapma 4. İki sınavdan da 80 alan öğrenci hangisinde göreceli olarak daha başarılıdır?',o:['A sınavında (z = 2)','B sınavında (z = 2,5)','İkisinde de aynı'],c:1,a:'A’da z = (80−60)/10 = 2; B’de z = (80−70)/4 = 2,5. B’de öğrenci sınıfın daha uzağında, yani daha başarılı.'},
    dene:[]},
  {id:'tte',e:'⚖️',t:'t-testi ne yapar?',trk:'İstatistik',lv:3,dk:4,ozet:'Grup ortalamaları arasındaki fark, şansla açıklanabilecek kadar küçük mü?',
    p:['İki grubun ortalaması arasındaki fark şansla açıklanabilir mi? t-testi bu soruyu sorar: fark, grupların kendi içindeki dağınıklığa (standart hataya) göre ne kadar büyük?','Fark büyük, grup içi dağınıklık küçük ve örneklem yeterliyse t büyür, p küçülür. Ama “istatistiksel olarak anlamlı” demek “önemli” demek değildir; farkın büyüklüğüne ve güven aralığına da bak. Hesaplayıcılar sayfasında kendi verinle deneyebilirsin.'],
    kontrol:{q:'İki grubun ortalaması arasındaki fark aynı kalıyor, grupların içindeki dağınıklık artıyor. t değeri ne olur?',o:['Büyür','Küçülür','Değişmez'],c:1,a:'Payda (standart hata) büyüdüğü için t küçülür; fark şansla daha kolay açıklanır hâle gelir.'},
    dene:[{t:'Hesaplayıcılar’a git',go:'x-v-hesap'}]},
  {id:'sel',e:'🎯',t:'Seçilim ve hayatta kalma yanlılığı',trk:'İstatistik',lv:3,dk:4,ozet:'Örneklem evreni temsil etmiyorsa, büyük olması sorunu çözmez.',
    p:['Yalnızca hayatta kalanlara bakmak, yalnızca gönüllülere sormak ya da yalnızca ulaşabildiğin kişileri incelemek sonucu çarpıtır. Bu, örneklemin büyüklüğünden bağımsız bir sorundur.','Klasik örnek: İkinci Dünya Savaşı’nda geri dönen uçaklardaki kurşun izlerine bakıp o bölgeleri zırhlamak yanlış olurdu; asıl kritik bölgeler geri dönemeyen uçaklardaydı. Bir başarı hikâyesi ya da anket görürken “kimler dışarıda kaldı?” diye sor.'],
    kontrol:{q:'Başarılı girişimcilerin ortak özelliklerini inceleyen bir çalışma neden yanıltabilir?',o:['Başarısız girişimciler örneklemde yok; aynı özellikler onlarda da olabilir','Başarılı girişimci sayısı her zaman azdır','Girişimciler ankete cevap vermez'],c:0,a:'Yalnızca başarılılara bakınca, özelliğin başarıyı getirdiği mi yoksa herkeste olduğu mu anlaşılamaz.'},
    dene:[]},
  {id:'gor',e:'🖼️',t:'Doğru grafik türünü seçmek',trk:'Grafik ve veri',lv:1,dk:3,ozet:'Grafik türü, vermek istediğin mesaja göre seçilir.',
    p:['• Kategorileri karşılaştırmak → çubuk grafik.\n• Zaman içindeki değişim → çizgi grafik.\n• Tek değişkenin dağılımı → histogram.\n• İki sayısal değişkenin ilişkisi → dağılım (saçılım) grafiği.\n• Parça–bütün ilişkisi → az sayıda dilimle pasta ya da yığılmış çubuk.','Bir grafik tek bir mesaj vermelidir. Başlığa bulguyu yaz (“Kamuda ortalama ücret daha yüksek”), eksenleri etiketle, kaynağı ve dönemi belirt, gereksiz süslemeden kaçın.'],
    kontrol:{q:'144 aylık enflasyon serisini göstermek için en uygun grafik hangisidir?',o:['Pasta grafik','Çizgi grafik','Dağılım grafiği'],c:1,a:'Zaman içindeki değişimi göstermenin en doğal yolu çizgi grafiktir.'},
    dene:[{t:'Atölye’de aç (makro seri)',ds:'makro'}]},
  {id:'sq3',e:'🚦',t:'SQL’de koşullar: VE, VEYA, ARASINDA',trk:'SQL ve Pivot',lv:2,dk:4,ozet:'Koşullar birleştirilir; parantez sıralamayı belirler.',
    p:['NEREDE koşulları VE, VEYA, DEĞİL ile birleştirilir. İÇİNDE bir değer listesini, ARASINDA bir aralığı (uçlar dâhil), BENZER ise metin kalıplarını kontrol eder; % “gerisi önemli değil” demektir.',`Dikkat: VE, VEYA’dan önce çalışır. “Elektronik veya Ev kategorisinde ve indirimli” gibi karışık koşullarda parantez kullan: NEREDE (kategori = 'Elektronik' VEYA kategori = 'Ev') VE indirim > 0.`],
    kontrol:{q:'Hangi koşul 10 ile 20 arasındaki (uçlar dâhil) indirimleri seçer?',o:['indirim ARASINDA 10 VE 20','indirim İÇİNDE 10, 20','indirim BENZER 10-20'],c:0,a:'ARASINDA alt ve üst sınırı dâhil eder. İÇİNDE yalnızca 10 ve 20’yi seçerdi.'},
    dene:[{t:'SQL’de dene',sql:`SELECT * FROM magaza WHERE (kategori = 'Elektronik' OR kategori = 'Ev') AND indirim > 0 LIMIT 10`}]},
  {id:'sq4',e:'🕳️',t:'SQL’de eksik değerler',trk:'SQL ve Pivot',lv:2,dk:4,ozet:'Eksik değer 0 değildir; “bilinmiyor” demektir.',
    p:['Eksik değer “0” değil, “bilinmiyor” demektir. Karşılaştırmalar eksik değerlerde ne doğru ne yanlış döner; bu yüzden “harcama eşittir boş” diye aramak hiçbir satır bulmaz. BOŞTUR ve DOLUDUR kullan.','Özet işlevler (ORTALAMA, TOPLAM, EN_ÇOK) eksik değerleri atlar. SAY(*) tüm satırları, SAY(sütun) yalnızca dolu olanları sayar. BOŞSA(sütun, 0) eksiği 0 ile değiştirir; ama bunu bilerek yap, çünkü ortalamayı aşağı çeker.'],
    kontrol:{q:'SAY(*) = 150 ve SAY(harcama) = 143 çıktıysa ne anlaşılır?',o:['7 öğrencinin harcama bilgisi eksiktir','143 öğrencinin harcaması 0’dır','Tablo 143 satırlıktır'],c:0,a:'SAY(*) tüm satırları, SAY(harcama) yalnızca dolu değerleri sayar; fark eksik sayısıdır.'},
    dene:[{t:'SQL’de dene',sql:`SELECT COUNT(*) AS tum, COUNT(harcama) AS dolu FROM ogr`}]},
  {id:'sq5',e:'🧮',t:'Sütunlar arası hesap ve oranlar',trk:'SQL ve Pivot',lv:2,dk:4,ozet:'SEÇ içinde hesap yapılır; oranın ortalaması ile toplam oran farklıdır.',
    p:['SEÇ içinde sütunlarla hesap yapabilirsin: fiyat*adet ciro, gida/gelir*100 gıda payı. OLARAK ile sonuca anlamlı bir ad ver; sonra SIRALA ile o ada göre sıralayabilirsin.','Oran hesaplarken ortalama oran ile toplam oranı karıştırma: ORTALAMA(kira/gelir) “hane başına oranın ortalaması”dır; TOPLAM(kira)/TOPLAM(gelir) ise “toplam gelirin ne kadarı kira” demektir. İkisi genellikle farklı çıkar. “SQL’de dene” ile karşılaştır.'],
    kontrol:{q:'ORTALAMA(kira/gelir) ile TOPLAM(kira)/TOPLAM(gelir) için hangisi doğrudur?',o:['Her zaman aynı sonucu verirler','Genellikle farklı sonuç verirler','İkincisi hata verir'],c:1,a:'Birincisi her haneye eşit ağırlık verir; ikincisi geliri yüksek haneleri daha çok önemser. Bu yüzden sonuçlar farklılaşır.'},
    dene:[{t:'SQL’de dene',sql:`SELECT ROUND(AVG(gida/gelir)*100,1) AS ort_pay, ROUND(SUM(gida)/SUM(gelir)*100,1) AS toplam_pay FROM hane`}]},
  {id:'ayk',e:'🚨',t:'Aykırı değer: hata mı, gerçek mi?',trk:'Grafik ve veri',lv:2,dk:4,ozet:'Aykırı değeri silmeden önce nedenini araştır.',
    p:['Aykırı değer, diğerlerinden belirgin biçimde uzak bir gözlemdir. Üç olası kaynağı vardır: veri girişi hatası (fazladan bir sıfır), farklı bir evrenden gelen gözlem (toptan ile perakende karışmış) ya da gerçek ama nadir bir uç durum (çok büyük bir sipariş).','Karar sırası: önce kaynağı kontrol et; hata ise düzelt ya da boş bırak, gerçekse tut. Sonucu hem dahil hem hariç hesaplayıp ikisini de raporla. Fark büyükse bunu açıkça söyle; çünkü sonuç tek bir satıra bağlı demektir.'],
    kontrol:{q:'Bir ürünün fiyatı kategorisindeki diğerlerinin 10 katı çıktı. İlk adım ne olmalı?',o:['Satırı hemen silmek','Kaynağı kontrol edip hata mı gerçek mi anlamak','Ortalamaya aynen dahil etmek'],c:1,a:'Önce nedeni anla: hata ise düzelt, gerçekse tut. Körlemesine silmek de, körlemesine tutmak da bilgi kaybettirir.'},
    dene:[{t:'SQL’de dene',sql:`SELECT kategori, ROUND(AVG(fiyat)) AS ort, MAX(fiyat) AS en_yuksek FROM eticaret GROUP BY kategori`}]},
  {id:'pan',e:'🗂️',t:'Panel veri: aynı birimleri yıllar boyu izlemek',trk:'İstatistik',lv:3,dk:4,ozet:'Havuzlanmış korelasyon, iller arası ve zaman içi farkları karıştırır.',
    p:['Panel veri, aynı birimleri (il, firma, hane) birden çok dönem boyunca izler. İl panelinde 40 il × 16 yıl = 640 gözlem var. Hepsini tek havuza atıp korelasyona bakarsan iki ayrı etkiyi karıştırırsın: iller arası kalıcı farklar (zengin il hep zengin) ve zaman içindeki ortak trend (herkes zamanla büyüyor).','İyi bir ilk adım: önce tek bir yıl için iller arasına (kesit), sonra tek bir il için yıllar boyuna (zaman serisi) bak. İkisi aynı yönü gösteriyorsa bulgu daha güvenilir; göstermiyorsa havuzlanmış r yanıltıcı olabilir.'],
    kontrol:{q:'Panel veride havuzlanmış korelasyonu neden dikkatle yorumlamalıyız?',o:['Çünkü gözlem sayısı her zaman azdır','Çünkü iller arası farklar ile zaman trendi aynı r içinde karışır','Çünkü korelasyon panel veride hesaplanamaz'],c:1,a:'Havuzlama, kesit ve zaman boyutlarını tek sayıya sıkıştırır; bu yüzden ikisini ayrı ayrı da incelemek gerekir.'},
    dene:[{t:'Atölye’de aç (il paneli)',ds:'panel'}]},
  {id:'cok',e:'🎰',t:'Çok test, çok “anlamlı” sonuç',trk:'İstatistik',lv:3,dk:4,ozet:'Yeterince karşılaştırma yaparsan tesadüfen anlamlı bir sonuç bulursun.',
    p:['%5 anlamlılık düzeyinde her test, hiçbir fark yokken bile %5 yanlış alarm riski taşır. 20 bağımsız karşılaştırma yaparsan en az birinin tesadüfen “anlamlı” çıkma olasılığı yaklaşık %64’tür (1 − 0,95²⁰).','Önlem: karşılaştırmaları veriye bakmadan önce planla, kaç test yaptığını raporla ve test sayısı arttıkça eşiği sıkılaştır (Bonferroni: 0,05 ÷ test sayısı). Keşif amaçlı bulguları kanıt değil, yeni hipotez olarak sun.'],
    ornek:'10 değişken arasında 10 korelasyon testi yaparsan tesadüfen en az birinin p < 0,05 çıkma olasılığı ≈ %40.\nBonferroni eşiği: 0,05 ÷ 10 = 0,005.',hata:'Sonuçları gördükten sonra hangi karşılaştırmayı raporlayacağına karar vermek (p-hacking).',
    kontrol:{q:'40 farklı alt grupta fark arayıp yalnızca p < 0,05 çıkan 2 tanesini raporlamak neden sorunludur?',o:['40 testte fark hiç yokken bile ortalama 2 “anlamlı” sonuç beklenir','Alt grup analizi yasaktır','p-değeri hiç güvenilmezdir'],c:0,a:'40 × 0,05 = 2. Yapılan tüm testleri raporlamak gerekir; yalnızca tutan sonucu göstermek yanıltır.'},
    dene:[{t:'Atölye’de aç (e-ticaret)',ds:'eticaret'}]},
  {id:'ris',e:'⚖️',t:'Mutlak ve göreli risk',trk:'Temel',lv:2,dk:4,ozet:'“Risk %50 arttı” cümlesi etkinin gerçek büyüklüğünü söylemez.',
    p:['Mutlak risk, olayın gerçekte kaç kişide görüldüğüdür (10.000’de 2). Göreli risk iki grubun oranıdır (3 ÷ 2 = 1,5 kat). Başlıklar göreli rakamı sever; karar vermek için mutlak rakam gerekir.','Küçük tabanda göreli artış büyük görünür: 10.000’de 2’den 3’e çıkış “%50 artış”tır ama fark 10.000’de yalnızca 1 kişidir. Her zaman ikisini birlikte ver.'],
    ornek:'Bir kanalda iade 100 siparişte 8, diğerinde 12.\nGöreli: 12 ÷ 8 = 1,5 kat. Mutlak fark: 4 yüzde puan.\nBin siparişte 40 fazla iade demektir.',hata:'Göreli artışı mutlak etki sanmak; taban küçükse etki önemsiz olabilir.',
    kontrol:{q:'Bir olayın olasılığı %1’den %2’ye çıkıyor. Hangisi doğrudur?',o:['Risk %100 arttı, mutlak fark 1 yüzde puan','Risk %1 arttı','Risk 2 yüzde puan arttı'],c:0,a:'2 ÷ 1 = 2 kat (%100 artış); mutlak fark 1 yüzde puandır.'},
    dene:[{t:'SQL’de dene',sql:`SELECT kanal, iade, COUNT(*) AS adet FROM eticaret GROUP BY kanal, iade ORDER BY kanal`}]},
  {id:'kar',e:'🧩',t:'Karıştırıcı etken ve katmanlama',trk:'İstatistik',lv:3,dk:5,ozet:'Üçüncü bir değişken farkı yaratıyorsa, karşılaştırmayı onun düzeyleri içinde yap.',
    p:['Karıştırıcı, hem “neden” hem “sonuç” değişkenini etkileyen üçüncü değişkendir. Örnek: staj ve GANO. Üst sınıflar hem daha çok staj yapıyor hem daha yüksek GANO’ya sahipse, staj–GANO farkının bir kısmı sınıftan gelir.','Katmanlama basit bir kontroldür: karşılaştırmayı üçüncü değişkenin her düzeyinde ayrı yap. Fark her katmanda sürüyorsa bulgu daha sağlam; kaybolursa karıştırıcıydı. Kesin nedensellik kanıtlamaz ama yanıltıcı farkı ayıklar.'],
    ornek:'Ham fark: stajlıların GANO’su 0,20 yüksek.\nSınıfa göre bakınca 1. sınıfta fark 0,05, 4. sınıfta 0,06 ise farkın büyük kısmı sınıf bileşiminden geliyordu.',hata:'Tek katmana bakıp diğerlerini görmemek ya da çok küçük katmanlarla kesin yorum yapmak.',
    kontrol:{q:'İlaç alanlarda iyileşme daha düşük, ama ağır hastalar ilacı daha çok alıyor. Ne yaparsın?',o:['Hastalık ağırlığına göre katmanlayıp karşılaştırırım','İlacı etkisiz ilan ederim','Ağır hastaları silerim'],c:0,a:'Ağırlık hem ilaç almayı hem iyileşmeyi etkiliyor; katman içinde karşılaştırma yanıltıcı farkı ayıklar.'},
    dene:[{t:'SQL’de dene',sql:`SELECT sinif, staj, ROUND(AVG(gano),2) AS ort_gano, COUNT(*) AS kisi FROM ogr GROUP BY sinif, staj ORDER BY sinif, staj`},{t:'Pivot’ta dene',pv:{ds:'ogr',r:'sinif',c:'staj',v:'gano',a:'avg'}}]},
  {id:'log',e:'🔭',t:'Logaritmik ölçek ve çarpık veri',trk:'Grafik ve veri',lv:2,dk:4,ozet:'Log ölçeğinde eşit uzaklık, eşit oransal değişimi gösterir.',
    p:['Gelir, fiyat ve şirket büyüklüğü çarpıktır: çok sayıda küçük, az sayıda çok büyük değer. Düz ölçekte grafik birkaç büyük değerin gölgesinde kalır. Log ölçeğinde eşit uzaklık eşit orandır: 10’dan 100’e ile 100’den 1000’e aynı mesafe.','Log ölçeğinde düz çizgi sabit yüzdesel büyümeyi gösterir. Ama okuyucu log eksene alışık değildir; ekseni açıkça belirt ve gerekirse gerçek değerleri etiketle.'],
    ornek:'Ülkelerde kişi başı gelir 2.000’den 60.000 dolara uzanıyor.\nDüz ölçekte yoksul ülkeler sol kenarda sıkışır; log ölçekte hepsi ayırt edilir.\nGelir–ömür ilişkisi log gelirle neredeyse doğrusaldır.',hata:'Log eksenini belirtmemek ya da sıfır/negatif değerli veriye log uygulamaya çalışmak.',
    kontrol:{q:'Log ölçekli eksende bir seri düz çizgi çiziyor. Bu ne demektir?',o:['Sabit miktarda artış','Sabit yüzdesel büyüme','Hiç değişim yok'],c:1,a:'Log ölçeğinde doğru çizgi, her dönem aynı oranda büyümeyi gösterir.'},
    dene:[{t:'Atölye’de aç (ülkeler)',ds:'ulke'}]},
  {id:'sq6',e:'🪣',t:'SQL: GRUPTA ile grup filtresi',trk:'SQL ve Pivot',lv:2,dk:4,ozet:'Özet değerlere koşul koymak için NEREDE değil GRUPTA kullanılır.',
    p:['NEREDE tek tek satırları süzer; GRUPTA (HAVING) gruplandıktan sonra özet değerler üzerinden süzer. “En az 100 iadesi olan kategoriler” ya da “ortalama kargo süresi 4 günü aşan kanallar” GRUPTA ister.','Çalışma sırası: NEREDEN → NEREDE → GRUPLA → GRUPTA → SIRALA → SINIRLA. Gereksiz satırları önce NEREDE ile at, sonra GRUPTA ile özete koşul koy.'],
    ornek:'Soru: iadesi 100’ü geçen kategoriler.\n1) NEREDE iade = ’Evet’ ile iadeleri seç.\n2) kategoriye GRUPLA.\n3) GRUPTA SAY(*) > 100.',hata:'Özet işlevi NEREDE içine yazmak (NEREDE ORTALAMA(x) > 5). Özet değer GRUPTA ister.',
    kontrol:{q:'“Ortalama kargo süresi 4 günü aşan kanalları listele” için hangisi doğrudur?',o:['GRUPLA kanal GRUPTA ORTALAMA(kargo_gun) > 4','NEREDE ORTALAMA(kargo_gun) > 4','SIRALA ORTALAMA(kargo_gun) > 4'],c:0,a:'Ortalama bir özet değerdir; gruplandıktan sonra GRUPTA ile süzülür.'},
    dene:[{t:'SQL’de dene',sql:`SELECT kategori, COUNT(*) AS iade_sayisi FROM eticaret WHERE iade = 'Evet' GROUP BY kategori HAVING COUNT(*) > 100 ORDER BY iade_sayisi DESC`}]},
  {id:'eng',e:'🍞',t:'Pay hesapları ve Engel yasası',trk:'Temel',lv:2,dk:4,ozet:'Tutar ile pay farklı sorulardır; gelir arttıkça tutar artarken pay düşebilir.',
    p:['Pay = parça ÷ bütün. Hanehalkı bütçesinde gıda payı = gıda harcaması ÷ gelir. Engel yasasına göre gelir arttıkça gıdaya harcanan TL artar ama gelir içindeki payı azalır.','İki ayrı soru sorulur: “Zengin haneler gıdaya daha çok TL mi harcıyor?” (tutar) ve “gıda bütçenin daha büyük kısmını mı tutuyor?” (pay). Cevapları genellikle zıt yönlüdür.'],
    ornek:'A hanesi: gelir 20.000, gıda 8.000 → pay %40.\nB hanesi: gelir 80.000, gıda 16.000 → pay %20.\nB iki kat TL harcıyor, ama payı yarıya inmiş.',hata:'Tutarı payla karıştırıp “zenginler daha az yiyor” demek.',
    kontrol:{q:'Gelir 2 katına çıkarken gıda harcaması 1,5 katına çıkıyor. Gıda payı ne olur?',o:['Artar','Azalır','Değişmez'],c:1,a:'Pay = gıda ÷ gelir; 1,5 ÷ 2 = 0,75 katına iner, yani azalır.'},
    dene:[{t:'SQL’de dene',sql:`SELECT il_grubu, ROUND(AVG(gida)) AS ort_gida, ROUND(AVG(gida/gelir)*100,1) AS gida_payi FROM hane GROUP BY il_grubu`}]},
  {id:'mev',e:'🌗',t:'Mevsimsellik ve trend',trk:'İstatistik',lv:2,dk:4,ozet:'Mevsimsel dalgalanmayı büyüme sanma; aynı ayı geçen yılla karşılaştır.',
    p:['Aylık serilerde üç şey karışır: uzun vadeli yön (trend), her yıl tekrarlayan dalgalanma (mevsimsellik) ve rastgele oynama. Aralık satışlarının Kasım’dan yüksek olması mevsimsel olabilir; “büyüme” demek için aynı ayı geçen yılın aynı ayıyla karşılaştırmak gerekir.','12 aylık hareketli ortalama mevsimselliği yumuşatır; yıllık değişim (bu ay ÷ geçen yılın aynı ayı) onu doğrudan ayıklar. Mevsimselliği düzeltmeden son iki ayı karşılaştırmak yanıltır.'],
    ornek:'Tüketim: bu yıl Ocak 520, Temmuz 480; geçen yıl Ocak 500, Temmuz 450.\nOcak’tan Temmuz’a düşüş mevsimseldir.\nYıllık değişim +%4 ve +%6,7: gerçek yükseliş budur.',hata:'Mevsimsel bir artışı ya da düşüşü trend sanmak.',
    kontrol:{q:'Kasım’dan Aralık’a satışlar arttı. “Büyüme var” demeden önce ne yapmalısın?',o:['Aralık’ı geçen yılın Aralık ayıyla karşılaştırmalıyım','Hiçbir şey; artış kesindir','Kasım’ı silmeliyim'],c:0,a:'Mevsimselliği ayıklamak için aynı ayları yıldan yıla karşılaştırmak gerekir.'},
    dene:[{t:'Atölye’de aç (elektrik tüketimi)',ds:'enerji'}]},
  {id:'lik',e:'🗳️',t:'Likert ölçeği ve anket verisi',trk:'Grafik ve veri',lv:2,dk:4,ozet:'Anket puanlarında ortalamaya değil dağılıma ve yanıt oranına bak.',
    p:['Likert maddeleri (1 = hiç memnun değilim … 5 = çok memnunum) sıralı veridir: sıra anlamlıdır, basamaklar arası fark eşit olmayabilir. Bu yüzden her puanın yüzdesini, medyanı ve “4–5 verenlerin payı”nı göster; ortalama tek başına yetmez.','İki tuzak var: yanıt vermeyenlerin kendine özgü olması (cevapsızlık yanlılığı) ve uç görüşlü kişilerin, özellikle şikâyetçilerin, daha çok cevaplaması. Yanıt oranını her zaman raporla.'],
    ornek:'İki şubede ortalama puan 3,5.\nA’da herkes 3 veya 4 vermiş; B’de yarısı 1, yarısı 5.\nOrtalama aynı ama B kutuplaşmış; dağılıma bakmadan görünmez.',hata:'Küçük ortalama farklarını (3,52 ile 3,48) anlamlı fark gibi yorumlamak.',
    kontrol:{q:'İki şubenin ortalama memnuniyeti aynı. Hangi bilgi yorumu en çok değiştirir?',o:['Puanların dağılımı','Şube adları','Anketin tarihi'],c:0,a:'Aynı ortalama çok farklı dağılımlardan gelebilir; kutuplaşma ancak dağılımda görünür.'},
    dene:[{t:'SQL’de dene',sql:`SELECT sube, puan, COUNT(*) AS adet FROM memnun GROUP BY sube, puan ORDER BY sube, puan`}]}
];

    }else{

  const resend=ver?null:el('button',{class:'btn line',type:'button',text:'Doğrulama e-postasını tekrar gönder',onclick:async()=>{try{await idt('sendOobCode',{requestType:'VERIFY_EMAIL',idToken:await tok()});say(out,'Doğrulama e-postası gönderildi. Gelen kutunu ve gereksiz klasörünü kontrol et.')}catch(e){say(out,e.message==='auth'?'Oturum süresi doldu, yeniden giriş yap.':e.message)}}});
  gate.replaceChildren(el('div',{class:'card lb-card'},el('h3',{text:'Üyelik durumun'}),el('p',{class:'lb-n',text:rec.n+' · '+rec.e}),
    el('ul',{class:'lb-st'},li(ver?'✓':'…',ver?'E-posta doğrulandı':'E-posta doğrulaması bekleniyor: gelen kutundaki bağlantıya bas'),li(st[0],st[1])),
    el('div',{class:'lb-tabs'},again,resend,el('button',{class:'btn line',type:'button',text:'Çıkış yap',onclick:logout})),out));
}
function showHocaNo(ver){
  const out=el('p',{class:'lb-m',role:'status',hidden:true});
  const resend=ver?null:el('button',{class:'btn line',type:'button',text:'Doğrulama e-postasını tekrar gönder',onclick:async()=>{try{await idt('sendOobCode',{requestType:'VERIFY_EMAIL',idToken:await tok()});say(out,'Doğrulama e-postası gönderildi. Gelen kutunu ve gereksiz klasörünü kontrol et.')}catch(e){say(out,e.message==='auth'?'Oturum süresi doldu, yeniden giriş yap.':e.message)}}});
  gate.replaceChildren(el('div',{class:'card lb-card'},el('h3',{text:'Hoca yetkisi bulunamadı'}),el('p',{class:'lb-n',text:S.e}),
    el('p',{class:'lb-n',text:ver?'Bu hesap yetkili hocalar listesinde değil. E-posta adresini yöneticiye ilet; yetkilendirilince “Durumu yenile”ye bas.':'Önce e-postanı doğrulaman gerekiyor: gelen kutundaki bağlantıya bas, sonra “Durumu yenile”ye bas.'}),
    el('div',{class:'lb-tabs'},el('button',{class:'btn',type:'button',text:'Durumu yenile',onclick:()=>{if(S)S.exp=0;check()}}),resend,el('button',{class:'btn line',type:'button',text:'Çıkış yap',onclick:logout})),out));
}
function showErr(e){
  gate.replaceChildren(el('div',{class:'card lb-card'},el('h3',{text:'Üyelik kontrol edilemedi'}),el('p',{class:'lb-n',text:e.message==='perm'?'Üyelik kaydı okunamadı ya da oluşturulamadı. Yönetici veritabanı kurallarını yayınlamış olmalı.':e.message}),el('div',{class:'lb-tabs'},el('button',{class:'btn',type:'button',text:'Tekrar dene',onclick:()=>check()}),el('button',{class:'btn line',type:'button',text:'Çıkış yap',onclick:logout}))));
}
async function check(){
  if(busy)return;
  if(!S){showAuth();return}
  busy=true;
  gate.replaceChildren(el('div',{class:'card lb-card'},el('p',{class:'lb-n',text:'Üyeliğin kontrol ediliyor…'})));
  let rec,ver=false;
  try{
    await tok();
    ADM=false;try{await db('uyeler','GET',undefined,'shallow=true');ADM=true}catch(e){if(e.message!=='perm')throw e}
    if(ADM){busy=false;S.n=S.n||S.e;keep();try{S.exp=0;await tok()}catch(e){showAuth('Oturum yenilenemedi, yeniden giriş yap.');return}mount({n:S.n,e:S.e,adm:true});return}
    let HC=null;try{HC=await db('hoca/'+hk(S.e))}catch(e){if(e.message!=='perm')throw e}
    if(HC){busy=false;S.n=HC.n||S.n||S.e;keep();try{S.exp=0;await tok()}catch(e){showAuth('Oturum yenilenemedi, yeniden giriş yap.');return}HOCA=true;mount({n:S.n,e:S.e,hoca:true});return}
    const lk=await idt('lookup',{idToken:S.t});ver=!!(lk.users&&lk.users[0]&&lk.users[0].emailVerified);
    if(HM){busy=false;showHocaNo(ver);return}
    rec=await db('uyeler/'+S.uid);
    if(!rec){rec={n:S.n||S.e.split('@')[0],e:S.e,b:'',c:'',s:'bekliyor',d:Date.now()};await db('uyeler/'+S.uid,'PUT',rec)}
  }catch(e){busy=false;if(e.message==='auth'||/INVALID_ID_TOKEN|TOKEN_EXPIRED/.test(e.message)){S=null;keep();showAuth('Oturum süresi doldu, yeniden giriş yap.');return}showErr(e);return}
  busy=false;S.n=rec.n;keep();
  if(rec.s==='onay'&&ver){try{S.exp=0;await tok()}catch(e){showAuth('Oturum yenilenemedi, yeniden giriş yap.');return}mount(rec);return}
  showStatus(rec,ver);
}
/* ---- onaylı üye: Veri Analizi uygulamasını başlat ---- */
let started=false;
function mount(rec){
  try{localStorage.setItem('eko_uye_ok',S.uid)}catch(e){}
  okm=true;gate.replaceChildren();document.getElementById('veri-gate-wrap').hidden=true;
  const lo=document.getElementById('veri-lo');if(lo){lo.hidden=false;lo.title=rec.adm?'Yönetici · '+rec.e:rec.hoca?'Hoca · '+(rec.n||rec.e):(rec.n?rec.n+' · ':'')+rec.e;lo.onclick=ev=>{ev.preventDefault();logout()}}
  document.body.classList.add('uye-ok');if(ADM)document.body.classList.add('adm');
  const r=document.getElementById('ekx2-root');r.hidden=false;
  if(!started){started=true;window.__startVeri()}
}
check();
})();
</script>
