<style>
:root{--red:#c4202e;--bg:#fbf6f7;--surf:#fff;--ink:#1d1526;--mut:#6a5f76;--line:#eee3e6;--soft:#f5ecef;--g1:#c4202e;--g2:#ff7a45;--glass:rgba(255,255,255,.72)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#ff6470;--bg:#120c1a;--surf:#1c1328;--ink:#f6f0fb;--mut:#b6a8c8;--line:#2f2340;--soft:#241a33;--glass:rgba(28,19,40,.72)}}
:root[data-theme="dark"]{--red:#ff6470;--bg:#120c1a;--surf:#1c1328;--ink:#f6f0fb;--mut:#b6a8c8;--line:#2f2340;--soft:#241a33;--glass:rgba(28,19,40,.72)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;line-height:1.08;margin:0;font-weight:700;letter-spacing:-.015em}
a{color:inherit}
:focus-visible{outline:3px solid var(--g2);outline-offset:3px}
header{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
.bar{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 10px 40px -12px rgba(60,10,40,.35)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 19px "Bricolage Grotesque",sans-serif}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff}
.bar .back{margin-left:auto;font-weight:600;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px}
.bar .back:hover{background:var(--soft)}
main{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
.content{padding:36px 22px}
.ttl{text-align:center;margin:0 auto 22px;max-width:520px}
.ttl h1{font-size:clamp(30px,6vw,46px)}
.ttl p{margin:10px 0 0;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;text-decoration:none;font:700 16px "Bricolage Grotesque",sans-serif;border:0;cursor:pointer;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px -10px rgba(0,0,0,.45)}
.btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.btn.line{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.card{background:var(--surf);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 14px 30px -22px rgba(60,10,40,.4)}
.lb-card{max-width:520px;margin:0 auto 24px;padding:24px}
.lb-card h3{font-size:24px;margin:0 0 6px}
.lb-n{margin:0 0 14px;font-size:14.5px;color:var(--mut)}
.lb-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.lb-tabs button[aria-pressed=true]{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:none}
label.lb-f{display:flex;flex-direction:column;gap:4px;font:600 13px "Instrument Sans",sans-serif;color:var(--mut);margin:0 0 12px}
.lb-f select{font:500 16px "Instrument Sans",sans-serif;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);width:100%}
.lb-f input{font:500 16px "Instrument Sans",sans-serif;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);width:100%}
.lb-m{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--ink);font-size:14.5px}
.lb-st{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.lb-st li{padding:10px 14px;border-radius:12px;background:var(--soft);display:flex;gap:10px;align-items:flex-start;font-size:15px}
.lb-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 12px;font-size:14.5px}
.lb-home{font-weight:700;margin-right:10px;text-decoration:none}
.lb-bar>span{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lb-bar .btn{padding:8px 16px;font-size:14.5px}
.lb-row{display:flex;gap:8px;flex-wrap:wrap}
#lab-box iframe{width:100%;border:0;min-height:560px;display:block;border-radius:16px;background:var(--surf)}
footer{background:#1a0b1f;color:#cdbfe0;padding:28px 0 34px;font-size:15px}
footer .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
/* giriş yapılmış: laboratuvar tam sayfa */
body.lab-full{overflow:hidden}
body.lab-full header,body.lab-full footer,body.lab-full .ttl{display:none!important}
body.lab-full .content{padding:0;max-width:none;margin:0}
body.lab-full #lab-box{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;background:var(--surf);padding-top:env(safe-area-inset-top,0px)}
body.lab-full #lab-box[hidden]{display:none}
body.lab-full #lab-box iframe{flex:1 1 auto;height:auto!important;min-height:0;border-radius:0}
body.lab-full #lab-box .lb-bar{margin:0;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surf)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style id="dm-css">
/* ===== Çekmece menü (Eko-Log index.html ile aynı) · laboratuvar sayfaları ===== */
html.dm-on header nav,html.dm-on header .brand,html.dm-on header .back{display:none!important}
header .mbtn{flex:none;display:grid;width:44px;height:44px;margin:-2px 0;padding:0;border:0;border-radius:50%;background:transparent;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
header .mbtn img,header .mbtn .mlogo{display:block;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,122,69,.55);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .25s;object-fit:cover}
header .mbtn .mlogo{display:grid;place-items:center;background:linear-gradient(135deg,#c4202e,#ff7a45);color:#fff;font:800 18px/1 "Bricolage Grotesque",sans-serif}
header .mbtn:active img,header .mbtn:active .mlogo{transform:scale(.9)}
header .mbtn[aria-expanded="true"] img,header .mbtn[aria-expanded="true"] .mlogo{box-shadow:0 0 0 3px #ff7a45}
header .dm-txt{flex:none;font:800 21px/1 "Bricolage Grotesque","Trebuchet MS",sans-serif;letter-spacing:-.03em;text-decoration:none;background:linear-gradient(120deg,#c4202e 10%,#ff7a45 65%,#ffa94d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 1px 5px rgba(255,255,255,.6))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header .dm-txt{background-image:linear-gradient(120deg,#ff6470 10%,#ff8f5a 65%,#ffc371);filter:drop-shadow(0 1px 5px rgba(0,0,0,.5))}}
:root[data-theme="dark"] header .dm-txt{background-image:linear-gradient(120deg,#ff6470 10%,#ff8f5a 65%,#ffc371);filter:drop-shadow(0 1px 5px rgba(0,0,0,.5))}
/* Yatay menü çubuğu kutusu yok: yalnızca yuvarlak logo (menü) ve Eko-Log (ana sayfa) kalır */
html.dm-on header{pointer-events:none!important}
header.dm-hd{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
html.dm-on header .bar{pointer-events:none;background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;margin:0!important;max-width:none!important;width:max-content!important;gap:8px!important}
html.dm-on header .mbtn,html.dm-on header .dm-txt,html.dm-on header .tbtn,html.dm-on header #th,html.dm-on header #thm{pointer-events:auto}
body.dm-lock{overflow:hidden}
.dm{position:fixed;inset:0;z-index:99990;visibility:hidden;pointer-events:none;transition:visibility 0s linear .38s}
.dm.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.dm-ov{position:absolute;inset:0;background:rgba(10,5,18,.58);opacity:0;transition:opacity .3s ease;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.dm.open .dm-ov{opacity:1}
.dm-panel{position:absolute;top:0;right:0;bottom:0;width:min(86vw,440px);display:flex;flex-direction:column;background:#1c1328;color:#f6f0fb;box-shadow:-24px 0 60px -20px rgba(0,0,0,.65);transform:translateX(100%);transition:transform .38s cubic-bezier(.22,1,.36,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dm.open .dm-panel{transform:none}
.dm-top{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 22px;border-bottom:1px solid rgba(255,255,255,.2)}
.dm-top img,.dm-top .mlogo{width:36px;height:36px;border-radius:50%;background:#fff;flex:none}
.dm-top .mlogo{display:grid;place-items:center;background:linear-gradient(135deg,#c4202e,#ff7a45);color:#fff;font:800 17px/1 "Bricolage Grotesque",sans-serif}
.dm-top b{flex:1;font:800 22px/1 "Bricolage Grotesque","Trebuchet MS",sans-serif;letter-spacing:-.03em;background:linear-gradient(120deg,#ff6470 10%,#ff8f5a 65%,#ffc371);-webkit-background-clip:text;background-clip:text;color:transparent}
.dm-x{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.09);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:background-color .2s,transform .3s cubic-bezier(.22,1,.36,1)}
.dm-x:hover{background:rgba(255,255,255,.16)}.dm-x:active{transform:scale(.9)}
.dm-x svg{width:22px;height:22px}
.dm-list{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dm-list li{margin:0;padding:0;border-bottom:1px solid rgba(255,255,255,.2)}
.dm-list a{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:12px 22px;color:#f6f0fb;text-decoration:none;font:500 20px/1.25 "Instrument Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;transition:background-color .2s}
.dm-list a:hover{background:rgba(255,255,255,.07)}
.dm-list a:active{background:rgba(255,255,255,.13)}
.dm-list a:focus-visible{outline:3px solid #ff8f5a;outline-offset:-3px}
.dm-list a.on{font-weight:700;background:rgba(255,255,255,.06)}
.dm-list a.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#ff6470,#ff8f5a)}
.dm-list svg{width:20px;height:20px;flex:none;opacity:.85;display:block}
.dm-row{display:flex;align-items:center}
.dm-row>a{flex:1 1 auto;min-width:0}
.dm-row>a:only-child{padding-right:28px}
.dm-row>a:only-child>svg{opacity:.55}
.dm-list .dm-tg{flex:none;width:40px;height:40px;margin:0 16px 0 4px;padding:0;display:grid;place-items:center;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .2s,border-color .2s,box-shadow .25s,transform .3s cubic-bezier(.22,1,.36,1)}
.dm-list .dm-tg svg{width:18px;height:18px;opacity:1;transition:transform .32s cubic-bezier(.22,1,.36,1)}
.dm-list .dm-tg:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.65)}
.dm-list .dm-tg:active{transform:scale(.9)}
.dm-list .dm-tg:focus-visible{outline:3px solid #ff8f5a;outline-offset:2px}
.dm-item.open>.dm-row .dm-tg{background:linear-gradient(135deg,#ff6470,#ff8f5a);border-color:transparent;box-shadow:0 5px 16px -5px rgba(255,100,112,.75)}
.dm-item.open>.dm-row .dm-tg svg{transform:rotate(180deg)}
.dm-sub-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.22,1,.36,1)}
.dm-item.open>.dm-sub-wrap{grid-template-rows:1fr}
.dm-list .dm-sub{position:relative;list-style:none;margin:0;padding:0;min-height:0;overflow:hidden;visibility:hidden;background:rgba(255,255,255,.035);transition:visibility 0s linear .32s}
.dm-item.open>.dm-sub-wrap>.dm-sub{visibility:visible;transition-delay:0s}
.dm-list .dm-sub::before{content:"";position:absolute;left:30px;top:8px;bottom:8px;width:2px;border-radius:2px;background:rgba(255,255,255,.16)}
.dm-list .dm-sub li{margin:0;border:0}
.dm-list .dm-sub a{min-height:48px;padding:10px 22px 10px 50px;font-size:17px;font-weight:400;color:rgba(246,240,251,.92)}
.dm-list .dm-sub a.dm-k{min-height:42px;padding-left:74px;font-size:15.5px;color:rgba(246,240,251,.8)}
.dm-list .dm-sub a.on{font-weight:700;color:#fff;background:rgba(255,255,255,.08)}
.dm-list .dm-sub a.on::before{left:28px;top:12px;bottom:12px;width:5px}
@media (prefers-reduced-motion:reduce){.dm,.dm-ov,.dm-panel,.dm-sub-wrap,.dm-list .dm-sub,.dm-list .dm-tg,.dm-list .dm-tg svg{transition:none}}
@media print{.dm,header .mbtn{display:none!important}}

function setSub(li,tg,label,open){
  li.classList.toggle('open',open);
  tg.setAttribute('aria-expanded',open?'true':'false');
  tg.setAttribute('aria-label',label+(open?' alt sayfalarını kapat':' alt sayfalarını aç'));

function setHref(a,o){
  if(o.click){
    a.href='#';a.setAttribute('role','button');
    a.addEventListener('click',function(e){e.preventDefault();closeM(false);try{o.click()}catch(x){}});
  }else{a.href=U(o.href);a.target='_top'}
}
/* o: {text, href | click, on, open, kids:[{text, href | click, on, sub}]} */
function addItem(o){
  var li=mk('li','dm-item'),row=mk('div','dm-row'),a=mk('a'),s=mk('span');
  s.textContent=o.text;a.appendChild(s);setHref(a,o);
  var kids=o.kids||[],has=kids.length>0,anyOn=false;
  if(!has)a.insertAdjacentHTML('beforeend',CHEV);
  row.appendChild(a);li.appendChild(row);
  if(has){
    var id='dms'+(++uid),tg=mk('button','dm-tg'),wrap=mk('div','dm-sub-wrap'),ul=mk('ul','dm-sub');
    tg.type='button';tg.setAttribute('aria-controls',id);tg.innerHTML=DOWN;ul.id=id;
    kids.forEach(function(k){
      var l=mk('li'),b=mk('a');b.textContent=k.text;setHref(b,k);
      if(k.sub)b.className='dm-k';
      if(k.on){b.className=(b.className?b.className+' ':'')+'on';b.setAttribute('aria-current','page');anyOn=true}
      l.appendChild(b);ul.appendChild(l);
    });
    wrap.appendChild(ul);li.appendChild(wrap);row.appendChild(tg);
    li.setAttribute('data-l',o.text);
    tg.addEventListener('click',function(){
      var will=!li.classList.contains('open');
      if(will)[].forEach.call(list.querySelectorAll('.dm-item.open'),function(x){var t=x.querySelector('.dm-tg');if(t)setSub(x,t,x.getAttribute('data-l'),false)});
      setSub(li,tg,o.text,will);
    });
    setSub(li,tg,o.text,!!(o.open||anyOn));
  }
  if(o.on||anyOn){a.className='on';if(o.on)a.setAttribute('aria-current','page')}
  list.appendChild(li);
}
function build(){
  list.textContent='';uid=0;
  var member=isMember();lastM=member;
  /* 1) Bu laboratuvarın kendi sekmeleri */
  var tabs=[];try{tabs=(CFG.tabs&&CFG.tabs())||[]}catch(e){tabs=[]}
  if(tabs.length){
    var kids=[];
    tabs.forEach(function(t){
      kids.push({text:t.text,click:t.click,href:t.href,on:t.on});
      (t.kids||[]).forEach(function(k){kids.push({text:k.text,click:k.click,href:k.href,on:k.on,sub:true})});
    });
    var m0=CFG.main||{click:tabs[0].click,href:tabs[0].href};
    addItem({text:CFG.title||'Laboratuvar',click:m0.click,href:m0.href,kids:kids,open:true});
  }
  /* 2) Site menüsü (ana sayfadakiyle aynı) */
  addItem({text:'Ana Sayfa',href:'../'});
  SITE.forEach(function(it){
    var t=it[0],h=it[1];
    if(t==='Eko Can'){addItem({text:t,click:window.EkoBotAc});return}
    if(t==='Üye Alanı'){
      if(!member)return;                       /* yalnızca onaylı üye */
      var lab=inLab();
      addItem({text:t,href:h,on:false,open:true,kids:EP.map(function(e){return{text:e[0],href:e[1],on:lab&&e[1]==='iibf-laboratuvar.html'}})});
      return;
    }
    var base=h.split('#')[0],sub=SUB[t];
    addItem({text:t,href:h,kids:sub?sub.map(function(k){return{text:k[1],href:base+'#/'+k[0]}}):null});
  });
}
function openM(){
  if(isOpen)return;build();isOpen=true;lastF=D.activeElement;
  root.classList.add('open');D.body.classList.add('dm-lock');
  btn.setAttribute('aria-expanded','true');btn.setAttribute('aria-label','Menüyü kapat');
  setTimeout(function(){var x=root.querySelector('.dm-x');if(x)x.focus()},60);
}
function closeM(restore){
  if(!isOpen)return;isOpen=false;
  root.classList.remove('open');D.body.classList.remove('dm-lock');
  btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Menüyü aç');
  if(restore&&lastF&&lastF.focus)lastF.focus();
}
btn.addEventListener('click',function(){isOpen?closeM(true):openM()});
root.querySelector('.dm-ov').addEventListener('click',function(){closeM(true)});
root.querySelector('.dm-x').addEventListener('click',function(){closeM(true)});
root.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('.dm-list a');if(a)closeM(false)});
D.addEventListener('keydown',function(e){
  if(!isOpen)return;
  if(e.key==='Escape'){e.preventDefault();closeM(true);return}
  if(e.key==='Tab'){
    var f=[].slice.call(root.querySelectorAll('.dm-x,.dm-list a,.dm-tg')).filter(function(x){return getComputedStyle(x).visibility!=='hidden'}),i=f.indexOf(D.activeElement);
    if(!f.length)return;
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&(i===-1||i===f.length-1)){e.preventDefault();f[0].focus()}
  }
});
var sx=0,sy=0;
panel.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
panel.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);if(dx>70&&dy<50)closeM(true)},{passive:true});
addEventListener('hashchange',function(){closeM(false)});

/* Üyelik durumu değişince menü kendini günceller */
function refresh(){var m=isMember();if(m!==lastM){lastM=m;if(isOpen)build()}}

D.head.appendChild(st)}

window.EkoBotAc=function(){
  prevF=D.activeElement;css();

    ov=mk('div');ov.id='ekobot';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Eko Can');
    var bar=mk('div','eb-bar'),b=mk('b');b.textContent='Eko Can';
    var r=mk('span');r.style.cssText='display:flex;gap:8px';
    var nw=mk('a');nw.href=U('../eko-bot.html');nw.target='_blank';nw.rel='noopener';nw.textContent='Yeni sekmede aç';
    var x=mk('button');x.type='button';x.textContent='\u2715 Kapat';x.addEventListener('click',kapat);

    ov.appendChild(bar);ov.appendChild(fr);D.body.appendChild(ov);

  }
  ov._o=D.documentElement.style.overflow;D.documentElement.style.overflow='hidden';ov.hidden=false;
};
})();
window.EkoMenu={open:openM,close:function(){closeM(false)}};
R.classList.add('dm-on');
})();

<script>(()=>{
const DBU=String(window.EKO_DB||'').replace(/\/+$/,''),KEY=String(window.EKO_KEY||'');
const gate=document.getElementById('lab-gate'),box=document.getElementById('lab-box');
if(!gate||!box)return;
const BACK='iibf-laboratuvar.html';
const el=(t,a,...k)=>{const e=document.createElement(t);for(const x in(a||{})){const v=a[x];if(x==='text')e.textContent=v;else if(x.slice(0,2)==='on')e.addEventListener(x.slice(2),v);else if(v===true)e.setAttribute(x,'');else if(v!==false&&v!=null)e.setAttribute(x,v)}k.flat().forEach(c=>{if(c!=null)e.append(c)});return e};
let S=null,fr=null,busy=false,ADM=false,HOCA=false,HM=false;
const hk=e=>String(e||'').trim().toLowerCase().replace(/\./g,',');
try{S=JSON.parse(localStorage.getItem('eko_uye')||'null')}catch(e){}
const keep=()=>{try{S?localStorage.setItem('eko_uye',JSON.stringify(S)):(localStorage.removeItem('eko_uye'),localStorage.removeItem('eko_uye_ok'))}catch(e){}};
const MS={EMAIL_EXISTS:'Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.',WEAK_PASSWORD:'Parola en az 6 karakter olmalı.',INVALID_LOGIN_CREDENTIALS:'E-posta ya da parola hatalı.',INVALID_PASSWORD:'E-posta ya da parola hatalı.',EMAIL_NOT_FOUND:'E-posta ya da parola hatalı.',INVALID_EMAIL:'E-posta adresi geçersiz.',TOO_MANY_ATTEMPTS_TRY_LATER:'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.',OPERATION_NOT_ALLOWED:'Üyelik girişi henüz açık değil. Yönetici Firebase’de E-posta/Parola girişini açmalı.',USER_DISABLED:'Bu hesap devre dışı bırakıldı.'};
const msg=c=>{c=String(c||'');for(const k in MS)if(c.includes(k))return MS[k];return'İşlem yapılamadı ('+c+').'};
const NET='Sunucuya ulaşılamadı. İnternetini kontrol et.';
const idt=async(p,b)=>{let r;try{r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+p+'?key='+encodeURIComponent(KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}catch(e){throw new Error(NET)}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(msg(j.error&&j.error.message));return j};
async function tok(){if(!S)throw new Error('auth');if(Date.now()<S.exp)return S.t;let r;try{r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(KEY),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(S.r)})}catch(e){throw new Error(NET)}const j=await r.json().catch(()=>({}));if(!r.ok){S=null;keep();throw new Error('auth')}S.t=j.id_token;S.r=j.refresh_token;S.exp=Date.now()+(Number(j.expires_in||3600)-90)*1e3;keep();return S.t}
const db=async(p,m,b,q)=>{const t=await tok();let r;try{r=await fetch(DBU+'/'+p+'.json?'+(q?q+'&':'')+'auth='+encodeURIComponent(t),{method:m||'GET',cache:'no-store',headers:b!==undefined?{'Content-Type':'application/json'}:{},body:b!==undefined?JSON.stringify(b):undefined})}catch(e){throw new Error('Veritabanına ulaşılamadı. İnternetini kontrol et.')}if(r.status===401||r.status===403)throw new Error('perm');if(!r.ok)throw new Error('Veritabanı beklenmedik bir yanıt verdi ('+r.status+').');return r.json()};
const setS=(j,email,name)=>{S={t:j.idToken,r:j.refreshToken,exp:Date.now()+(Number(j.expiresIn||3600)-90)*1e3,uid:j.localId,e:email,n:name||''};keep()};
const RE=/^[^@\s]+@([a-z0-9-]+\.)*inonu\.edu\.tr$/i;
const say=(o,t)=>{o.textContent=t;o.hidden=!t};
function full(){document.body.classList.toggle('lab-full',!!fr&&!box.hidden)}
function logout(){S=null;ADM=false;HOCA=false;HM=false;keep();if(fr){fr.remove();fr=null}box.hidden=true;box.replaceChildren();full();showAuth()}
/* ---- giriş / üye ol formu ---- */
function showAuth(note,tab){
  tab=tab||'in';box.hidden=true;
  const out=el('p',{class:'lb-m',role:'alert',hidden:true});if(note)say(out,note);
  const fld=(id,l,type,o)=>el('label',{class:'lb-f','for':id},l,el('input',Object.assign({id,type,required:true,autocomplete:'off'},o||{})));
  const sg=tab==='up',hc=tab==='hoca';let mkf=false;
  const btn=el('button',{class:'btn',type:'submit',text:sg?'Üye ol':'Giriş yap'});
  const mkb=hc?el('button',{class:'btn line',type:'submit',text:'Hesap oluştur',onclick:()=>{mkf=true}}):null;
  const f=el('form',{novalidate:true},
    sg?fld('lb-n','Ad soyad','text',{autocomplete:'name',maxlength:'80'}):null,
    sg?el('label',{class:'lb-f','for':'lb-b'},'Bölüm',el('select',{id:'lb-b',required:true},el('option',{value:'',text:'Bölümünü seç'}),LOPT.map(x=>el('option',{value:x[0],text:x[1]})))):null,
    sg?el('label',{class:'lb-f','for':'lb-c'},'Sınıf',el('select',{id:'lb-c',required:true},el('option',{value:'',text:'Sınıfını seç'}),['1. sınıf','2. sınıf','3. sınıf','4. sınıf'].map(x=>el('option',{value:x,text:x})))):null,
    fld('lb-e','Üniversite e-postası','email',{autocomplete:'username',inputmode:'email',placeholder:hc?'ad.soyad@inonu.edu.tr':'ad.soyad@ogr.inonu.edu.tr'}),
    fld('lb-p','Parola','password',{autocomplete:sg?'new-password':'current-password',minlength:'6'}),
    el('p',{class:'lb-n',text:hc?'Hocalar buradan girer ve doğrudan laboratuvara geçer. Hesabın yoksa “Hesap oluştur”a bas ve e-postanı doğrula; yönetici seni yetkilendirince giriş açılır.':sg?'Yalnızca inonu.edu.tr uzantılı e-postalar kabul edilir. Başvurun yönetici onayından geçince üyeliğin başlar; ayrıca e-postanı doğrulaman gerekir.':'Üyeliğin henüz onaylanmadıysa giriş yapınca durumunu görürsün.'}),
    hc?el('div',{class:'lb-row'},btn,mkb):btn,out);
  f.addEventListener('submit',async ev=>{ev.preventDefault();say(out,'');const mk=mkf;mkf=false;HM=hc;
    const v=id=>(f.querySelector('#'+id)||{value:''}).value.trim(),em=v('lb-e').toLowerCase(),pw=f.querySelector('#lb-p').value;
    if(sg&&!RE.test(em)){say(out,'Üniversite e-postanı yaz (…@inonu.edu.tr ya da …@ogr.inonu.edu.tr).');return}
    if(!/^\S+@\S+\.\S+$/.test(em)){say(out,'E-posta adresi geçersiz.');return}
    if(pw.length<6){say(out,'Parola en az 6 karakter olmalı.');return}
    if(sg&&v('lb-n').length<3){say(out,'Ad soyadını yaz.');return}
    if(sg&&!v('lb-b')){say(out,'Bölümünü seç.');return}
    if(sg&&!v('lb-c')){say(out,'Sınıfını seç.');return}
    btn.disabled=true;
    try{
      if(!KEY||!DBU)throw new Error('Üyelik henüz yapılandırılmadı.');
      if(sg||mk){const j=await idt('signUp',{email:em,password:pw,returnSecureToken:true});setS(j,em,sg?v('lb-n'):'');
        try{await idt('sendOobCode',{requestType:'VERIFY_EMAIL',idToken:j.idToken})}catch(e){}
        if(sg){try{await db('uyeler/'+S.uid,'PUT',{n:v('lb-n'),e:em,b:LPICK(v('lb-b'))[1],l:LPICK(v('lb-b'))[2][0]||'',ll:Object.fromEntries(LPICK(v('lb-b'))[2].map(k=>[k,true])),c:v('lb-c'),s:'bekliyor',d:Date.now()})}catch(e){}}}
      else{const j=await idt('signInWithPassword',{email:em,password:pw,returnSecureToken:true});setS(j,em,'')}
      await check();
      
    }catch(e){say(out,e.message==='auth'?'Oturum açılamadı.':e.message)}
    btn.disabled=false});
  const tb=(k,t)=>el('button',{class:'btn line',type:'button','aria-pressed':String(tab===k),text:t,onclick:()=>showAuth('',k)});
  gate.replaceChildren(el('div',{class:'card lb-card'},el('h3',{text:'Üyelere özel'}),el('p',{class:'lb-n',text:'İİBF Laboratuvarı yalnızca onaylı üyelere açıktır.'}),el('div',{class:'lb-tabs'},tb('in','Giriş yap'),tb('up','Üye ol'),tb('hoca','Hoca girişi')),f));
}

  try{localStorage.removeItem('eko_uye_ok')}catch(e){}
  const out=el('p',{class:'lb-m',role:'status',hidden:true});
  const st=rec.s==='onay'?['✓','Yönetici onayı: onaylandı']:rec.s==='red'?['✕','Başvurun onaylanmadı. Sorular için topluluğa yazabilirsin.']:['…','Yönetici onayı bekleniyor'];
  const li=(m,t)=>el('li',null,el('b',{text:m}),el('span',{text:t}));
  const again=el('button',{class:'btn',type:'button',text:'Durumu yenile',onclick:()=>{if(S)S.exp=0;check()}});
  const resend=ver?null:el('button',{class:'btn line',type:'button',text:'Doğrulama e-postasını tekrar gönder',onclick:async()=>{try{await idt('sendOobCode',{requestType:'VERIFY_EMAIL',idToken:await tok()});say(out,'Doğrulama e-postası gönderildi. Gelen kutunu ve gereksiz klasörünü kontrol et.')}catch(e){say(out,e.message==='auth'?'Oturum süresi doldu, yeniden giriş yap.':e.message)}}});
  gate.replaceChildren(el('div',{class:'card lb-card'},el('h3',{text:'Üyelik durumun'}),el('p',{class:'lb-n',text:rec.n+' · '+rec.e}),
    el('ul',{class:'lb-st'},li(ver?'✓':'…',ver?'E-posta doğrulandı':'E-posta doğrulaması bekleniyor: gelen kutundaki bağlantıya bas'),li(st[0],st[1])),
    el('div',{class:'lb-tabs'},again,resend,el('button',{class:'btn line',type:'button',text:'Çıkış yap',onclick:logout})),out));
}
function showHocaNo(ver){

async function check(){
  if(busy)return;
  if(!S){showAuth();return}
  busy=true;
  gate.replaceChildren(el('div',{class:'card lb-card'},el('p',{class:'lb-n',text:'Üyeliğin kontrol ediliyor…'})));
  let rec,ver=false;
  try{
    await tok();
    ADM=false;try{await db('uyeler','GET',undefined,'shallow=true');ADM=true}catch(e){if(e.message!=='perm')throw e}
    if(ADM){busy=false;S.n=S.n||S.e;keep();try{S.exp=0;await tok()}catch(e){showAuth('Oturum yenilenemedi, yeniden giriş yap.');return}mount({n:S.n,e:S.e,adm:true});return}
    let HC=null;try{HC=await db('hoca/'+hk(S.e))}catch(e){if(e.message!=='perm')throw e}
    if(HC){busy=false;S.n=HC.n||S.n||S.e;keep();try{S.exp=0;await tok()}catch(e){showAuth('Oturum yenilenemedi, yeniden giriş yap.');return}HOCA=true;mount({n:S.n,e:S.e,hoca:true});return}
    const lk=await idt('lookup',{idToken:S.t});ver=!!(lk.users&&lk.users[0]&&lk.users[0].emailVerified);
    if(HM){busy=false;showHocaNo(ver);return}
    rec=await db('uyeler/'+S.uid);
    if(!rec){rec={n:S.n||S.e.split('@')[0],e:S.e,b:'',c:'',s:'bekliyor',d:Date.now()};await db('uyeler/'+S.uid,'PUT',rec)}
  }catch(e){busy=false;if(e.message==='auth'||/INVALID_ID_TOKEN|TOKEN_EXPIRED/.test(e.message)){S=null;keep();showAuth('Oturum süresi doldu, yeniden giriş yap.');return}showErr(e);return}
  busy=false;S.n=rec.n;keep();
  if(rec.s==='onay'&&ver){try{S.exp=0;await tok()}catch(e){showAuth('Oturum yenilenemedi, yeniden giriş yap.');return}mount(rec);return}
  showStatus(rec,ver);
}

function labsOf(r){let a=[];if(r.ll&&typeof r.ll==='object')a=LKEYS.filter(k=>r.ll[k]);if(!a.length&&r.l&&LF[r.l])a=[r.l];if(a.length)return a;const b=String(r.b||'').toLocaleLowerCase('tr');for(const[k,re]of[['ekonometri',/ekonometri/],['uluslararasi',/uluslararas/],['maliye',/maliye/],['kamu',/kamu|siyaset/],['ceko',/çalışma|calisma|endüstri|ceko/],['isletme',/işletme|isletme/],['iktisat',/iktisat|ekonomi/]])if(re.test(b))return[k];return[]}

function mount(rec){
  if(!allow(rec))return;
  RECM=rec;
  try{localStorage.setItem('eko_uye_ok',S.uid)}catch(e){}

  if(fr){send();full();return}

  box.replaceChildren(profMenu(rec,who),fr);
  full();
}
