<style>
:root{--bg:#e9ebef;--card:#fff;--ink:#1b2a41;--mut:#5b6678;--acc:#7a1f2b;--ok:#1d6b4a;--no:#a3262f;--line:#d3d8e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161f;--card:#1a2230;--ink:#e8ebf1;--mut:#9aa5b8;--acc:#e08a95;--ok:#5fc795;--no:#f08a90;--line:#2d384b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Newsreader,Georgia,serif}
main{max-width:680px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:30px;line-height:1.15;margin:6px 0}h2{font-size:21px;margin:0 0 2px}
button,.k,.tag{font-family:"Public Sans",system-ui,sans-serif}
.mut{color:var(--mut);font-size:15px}.tag{font-size:13px;color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.bench{background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px;font-size:15px}
.l{margin:10px 0;padding-left:12px;border-left:3px solid var(--line)}.l.h{border-color:var(--acc)}.l.s{border-color:var(--mut);color:var(--mut);font-style:italic}
.k{font-size:13px;font-weight:600;display:block}.l.h .k{color:var(--acc)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin:8px 0;font-size:15px;line-height:1.45;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--no)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.exp{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:16px}
.sc{font-size:56px;font-weight:600;color:var(--acc);line-height:1}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 20px 22px;margin:4px 0 16px;color:#f6efe0;background:radial-gradient(circle at 85% 10%,#c9a24a55 0,transparent 45%),linear-gradient(135deg,#2a0f1d,#14213d 60%,#0b1326);box-shadow:0 10px 30px #0b132655}
.hero h1{font-size:36px;margin:6px 0;background:linear-gradient(90deg,#f6e3a1,#d9a93b,#f6e3a1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#d8cfbd}.hero .tag{color:#e7c667}
.sym{position:absolute;right:14px;top:6px;font-size:64px;opacity:.9;animation:sw 4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes sw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.fc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card) 70%);padding:14px;margin:12px 0;color:var(--ink);cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--c) 22%,transparent);transition:transform .15s,box-shadow .15s}
.fc:hover{transform:translateY(-3px);box-shadow:0 10px 22px color-mix(in srgb,var(--c) 35%,transparent)}
.fc:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.fc b{font-size:19px;display:block}.fc .mut{display:block;line-height:1.35}
.bench{background:linear-gradient(135deg,#14213d,#2a0f1d);color:#f3ead6;border:1px solid #d9a93b66;box-shadow:0 6px 18px #0b132644}
.btn{background:linear-gradient(135deg,#d9a93b,#b8832a);color:#1b1306;box-shadow:0 4px 12px #b8832a55}
.btn:hover{filter:brightness(1.08)}
.opt:hover:not(:disabled){transform:translateX(3px);box-shadow:0 3px 10px #7a1f2b33}
.opt{transition:transform .12s}
.opt.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card))}.opt.no{background:color-mix(in srgb,var(--no) 16%,var(--card))}
.l.h{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent)}
.gav{font-size:64px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
:root[data-theme="dark"]{--bg:#11161f;--card:#1a2230;--ink:#e8ebf1;--mut:#9aa5b8;--acc:#e08a95;--ok:#5fc795;--no:#f08a90;--line:#2d384b}
.bar2{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-family:"Public Sans",system-ui,sans-serif;font-size:15px}.rkb{flex:1}
.pb{height:6px;background:var(--line);border-radius:3px;margin-top:6px}.pb i{display:block;height:100%;background:linear-gradient(90deg,#d9a93b,#b8832a);border-radius:3px}
.ctl{display:flex;gap:6px}.ctl button{font-size:20px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.lv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}.lv button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer}.lv button.on{background:#7a1f2b;color:#fff;border-color:#7a1f2b}
.tm{font-family:"Public Sans",system-ui,sans-serif;font-weight:600;color:var(--no);margin:-6px 0 6px}.rk{font-weight:600;color:var(--acc);font-size:18px}
.ta{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px/1.5 Newsreader,Georgia,serif;margin:8px 0}
.dh summary{cursor:pointer;font-family:"Public Sans",system-ui,sans-serif;font-weight:600;color:var(--acc)}.dh p{white-space:pre-line;margin:8px 0 0;font-size:16px}
.tl .ti{position:relative;margin:0 0 10px 12px;padding:0 0 0 14px;border-left:2px solid var(--acc)}.tl .ti::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}.tl .ti b{font-family:"Public Sans",sans-serif;font-size:14px}.tl .ti span{color:var(--mut);font-size:14px;display:block}
.row{display:flex;justify-content:space-between;gap:8px}.rb{height:8px;border-radius:4px;background:var(--line);margin:4px 0 12px}.rb i{display:block;height:100%;border-radius:4px;background:var(--no)}
@media(prefers-reduced-motion:reduce){.sym,.gav{animation:none}.fc,.opt{transition:none}}

{ad:"İş Hukuku",mah:"İstanbul 14. İş Mahkemesi",es:"2026/412 E.",ozet:"İşe iade davası: depo müdürü A.K. / XYZ Lojistik A.Ş.",

s:[
{l:[["Katip","Duruşma açıldı. Taraf vekilleri hazır."],["Davalı vekili","Sayın Hakim, ön itirazımız var. Son tutanak 03.04’te düzenlenmiş, dava 24.04’te açılmış; süre geçmiştir. Ayrıca işyerimizde 28 işçi var."],["Davacı vekili","Süre bir aydır, esasa girilmeli. Tanıklarımız dışarıda bekliyor."]],
q:"Nasıl ilerlersin?",o:[

["Önce süre ve işçi sayısını inceler, tutanak ve SGK kayıtlarını getirtir, beyanları alırım",["Katip","Tutanak ve SGK kayıtları dosyaya alındı; taraflara beyan için söz verildi."],1,"Doğru. Ön sorunlar belgelerle çözülür; uzun tahkikata gerek kalmaz."],
["Davacıya kesin süre verip tutanak sunmasını isterim",["Davacı vekili","Tutanak zaten dosyada, Sayın Hakim."],0,"Tutanak dosyada mevcut; kesin süre vermek yersiz zaman kaybıdır."]]},
{l:[["Katip","Tutanak: 03.04.2026, davacıya aynı gün elden verildi (imza mevcut). SGK: 28 işçi, tek işyeri."],["Davacı vekili","Davacı geç kaldı ama o dönemde ağır hastaydı. Eski hale getirme talep ediyoruz."],["Davalı vekili","Hak düşürücü süredir. Mücbir sebep de belgelenmemiş."]],
q:"Eski hale getirme talebini nasıl karara bağlarsın?",o:[
["Kabul eder, davacıya yeni süre veririm",["Davalı vekili","Karara itiraz ediyoruz; hak düşürücü süre uzatılamaz."],0,"Hak düşürücü süre için eski hale getirme (kural olarak) mümkün değildir; mazeret ayrıca belgelenmemiş."],
["Reddederim; hak düşürücü süre geçmiş, mücbir sebep ispatlanmamıştır",["Katip","Talep reddedildi, tutanağa geçti."],1,"Doğru. Süre dışı açılan işe iade davasında bu aşama kapanır."],
["Hasta raporu için bilirkişi atarım",["Davacı vekili","Heyet kurulması da yeterli olur."],0,"Hak düşürücü sürede bu bile yapılmaz; mücbir sebep iddiası belgesiz."]]},
{l:[["Davalı vekili","Ayrıca madde 18 kapsamı da yok: 30 işçi şartı dolmuyor; davacı işveren vekili."],["Hakim","Sözlü yargılama tamamlandı. Son sözler alındı."]],
q:"Hükmü kur.",o:[

["Usulden ret; dava şartı yokluğu",["Davacı vekili","Arabuluculuk yapıldı Sayın Hakim."],0,"Arabuluculuk yapılmış; sorun usul değil hak düşürücü süredir (esastan red)."]]}]},
{ad:"Borçlar Hukuku",mah:"Ankara 7. Asliye Hukuk Mahkemesi",es:"2026/230 E.",ozet:"İkinci el araçta gizli ayıp ve sözleşmeden dönme",

s:[
{l:[["Satıcı vekili","Sorumsuzluk kaydı var; müvekkil ayıptan sorumlu değildir. Zamanaşımı da dolmuştur."],["Davacı vekili","Müvekkil arızayı 04.06’da fark etti, ertesi gün ihbar etti. Satıcı ayıbı biliyordu; servis faturası dosyada."]],
q:"Sorumsuzluk kaydı hakkındaki tavrın nedir?",o:[

["Tüketici hakem heyeti görevli, görevsizlik veririm",["Satıcı vekili","Fakat taraflar tüketici değil."],0,"Olayda tüketici işlemi bilgisi yok; görev ön sorunu burada gündem değil."]]},

q:"Rapora yönelik kararın?",o:[

["Sadece bedel indirimi",["Davacı vekili","Dönme talep ettik."],0,"Seçimlik hak davacıdadır; dönme koşulları mevcut."]]}]},

s:[

q:"İtirazsızlığın hukuki etkisi nedir?",o:[

{l:[["Davalı vekili","Ödeme bir faturanın sadece bir kısmı içindi."],["Katip","KDV beyannamelerinde 4 fatura da indirim konusu yapılmış; dekont dosyada."],["Davacı vekili","Bu, teslimi ve ilişkiyi fiilen kabuldür."]],

["Açıkça belli olmayan ayıpta 8 gün içinde inceleme ve ihbar gerekir (TTK m.23/1-c); 25.03’teki ihbar geçtir",["Katip","Süre hesabı tutanağa geçti."],1,"Doğru. Olağan incelemeyle anlaşılabilen ayıp gizli ayıp sayılmaz."],
["Teslimde açıkça belli ayıpta olduğu gibi 2 gün",["Satıcı vekili","İhbar yine geç."],0,"2 gün, teslimde açıkça belli ayıp içindir; burada ayıp açık değil."],
["Adi satışta olduğu gibi “uygun süre” yeterlidir (TBK m.223)",["Alıcı vekili","Bu da uygun süreydi."],0,"Ticari satışta TTK m.23/1-c özel süreler getirmiştir."],
["Ticari satışta ihbar süresi yoktur",["Alıcı vekili","İstediğimiz zaman."],0,"İhbar külfeti vardır; süresinde yapılmazsa haklar kullanılamaz."]]},
{l:[["Bilirkişi","Arıza imalat kaynaklı; ancak teslimde muayene ile görülebilir nitelikte."],["Alıcı vekili","Satıcı arızayı biliyordu, hile var."],["Katip","Dosyada hileyi gösteren delil yok."]],q:"Hükmün?",o:[
["Dava kabul; bedel iadesi",["Satıcı vekili","İhbar süresi kaçtı."],0,"Süresinde ihbar yapılmadığından alıcı seçimlik haklarını kullanamaz."],
["Dava reddedilir; süresinde ihbar yapılmadığından satılan ayıpla kabul edilmiş sayılır",["Katip","Karar: ret."],1,"Doğru. Hile kanıtlanmadığından satıcı ihbar külfetinden yararlanır."],
["Bedel indirimi kabul",["Alıcı vekili","En azından indirim."],0,"İhbar yoksa bedel indirimi de istenemez."],
["Bilirkişiden yeni rapor alırım, ihbar konusuna girmem",["Satıcı vekili","İhbar ön sorun."],0,"İhbar süresi ön sorundur, rapor beklenmez."]]}]},
{ad:"İş Hukuku",mah:"Antalya 3. İş Mahkemesi",es:"2026/931 E.",ozet:"Kullanılmayan yıllık izin ücreti",bil:"İşçi 6 yıl çalıştı, 2026’da çıkış yaptı. Kullanılmayan 42 günlük izin ücretini istiyor. İşveren “izin kullandırdık” diyor; imzalı izin belgesi yok, yalnızca tanık var.",s:[
{l:[["İşveren vekili","İşçi her yaz izin yaptı; tanıklarımız var."],["Davacı vekili","İzin belgesi yok, kullandırılmadı."]],q:"İspat yükü kimde, nasıl ispatlanır?",o:[
["İşçi izin kullanmadığını ispatlamalıdır",["İşveren vekili","Doğrusu bu."],0,"İzin kullandırıldığını ispat yükü işverendedir (yerleşik içtihat; İşK’da açık hüküm yoktur)."],
["İşveren izin kullandırdığını ispatlar; bu genellikle imzalı izin belgesiyle yapılır, belgesiz iddia yeterli olmaz",["Katip","İzin belgeleri istendi."],1,"Doğru. Yazılı belge yoksa işveren ispat yükünü yerine getirememiş sayılır."],
["Her iki taraf eşit ispat yükü taşır",["Davacı vekili","Ortak yük."],0,"Yük işverende."],
["İzin hakkı fesihle düşer",["İşveren vekili","İş ilişkisi bitti."],0,"Kullanılmayan izin ücreti fesihte ödenir (İşK m.59)."]]},
{l:[["Katip","Bilirkişi: son brüt ücret üzerinden 42 günlük izin ücreti 31.500 TL."],["Davacı vekili","Kabul talep ediyoruz."]],q:"Hükmün?",o:[
["Dava reddedilir; tanıklar izin kullanıldığını söylüyor",["İşveren vekili","Lehimize."],0,"Tanık beyanı izin belgesinin yerini tutmaz."],
["Kabul; son ücret üzerinden kullanılmayan izin ücreti hükmedilir (İşK m.59)",["Katip","Karar: kabul."],1,"Doğru. Zamanaşımı 5 yıldır (İşK Ek m.3), alacak süresindedir."],
["Kısmen kabul; yalnızca 21 gün",["Davacı vekili","42 gün sabit."],0,"Bilirkişi hesabı dosya kapsamıyla uyumludur."],
["Eski ücret üzerinden hesaplanır",["Davacı vekili","Son ücret esastır."],0,"Hesap son ücret üzerinden yapılır."]]}]},
{ad:"Borçlar Hukuku",mah:"Konya 3. Asliye Hukuk Mahkemesi",es:"2026/822 E.",ozet:"Cezai şart indirimi",bil:"İki gerçek kişi (tacir değil), 800.000 TL’lik taşınmaz satış vaadi sözleşmesi yaptı. Cezai şart 500.000 TL. Satıcı cayınca alıcı cezai şartı istiyor.",s:[
{l:[["Davalı vekili","Cezai şart fahiş; indirim istiyoruz."],["Davacı vekili","Taraflar serbestçe belirledi; indirim olmaz."]],q:"İndirim konusunda ne dersin?",o:[
["Hakim cezai şartı aşırı bulursa re’sen indirir (TBK m.182/3); tacir olmayan taraflar arasında indirim mümkündür",["Katip","İndirim değerlendirmesi için hesap istendi."],1,"Doğru. Taraf iradesi hakimi bağlamaz."],
["Taraf iradesi bağlayıcıdır, indirim olmaz",["Davacı vekili","Haklıyız."],0,"Cezai şart fahişse indirilir."],
["İndirim ancak davalı talep ederse yapılır",["Davacı vekili","Talep şart."],0,"Hakim re’sen indirim yapabilir."],
["Cezai şart tamamen geçersizdir",["Davalı vekili","Kaldırılmalı."],0,"Geçersiz değil, indirilebilir."]]},
{l:[["Katip","Bilirkişi: sözleşme bedelinin %62’si olan cezai şart, ortalama zarara göre fahiş."]],q:"Hükmün?",o:[
["500.000 TL cezai şart aynen kabul",["Davalı vekili","Fahiş."],0,"Fahiş cezai şart indirilir."],
["Cezai şart makul seviyeye indirilerek kısmen kabul",["Katip","Karar: kısmen kabul."],1,"Doğru. Hakkaniyete uygun indirim yapılır."],
["Dava reddedilir",["Davacı vekili","Caymak sabit."],0,"Cezai şart indirilir, tamamen kalkmaz."],
["Cezai şart yerine yasal faize hükmedilir",["Davacı vekili","Talebimiz cezai şart."],0,"Talep dışına çıkılamaz."]]}]},
{ad:"İdare Hukuku",mah:"Kayseri 1. İdare Mahkemesi",es:"2026/870 E.",ozet:"İhale: ivedi yargılama",bil:"İhale kararı davacıya 01.09.2026’da tebliğ edildi. Dava 05.10.2026’da açıldı. İhale işlemleri ivedi yargılamaya tabi.",s:[
{l:[["Davacı vekili","İptal davası süresi 60 gündür; süresindeyiz."],["İdare vekili","İvedi yargılamada 30 gün; süre aşımı vardır."]],q:"Süre konusunda kararın?",o:[
["60 gün; süresinde",["İdare vekili","İvedi usul."],0,"İhale işlemlerinde ivedi yargılama usulü uygulanır."],
["İvedi yargılamada dava açma süresi 30 gündür (İYUK m.20/A); son gün 01.10.2026, dava süreden reddedilir",["Katip","Süre aşımı tutanağa geçti."],1,"Doğru."],
["Süre 15 gündür",["Davacı vekili","Daha da kısa."],0,"15 gün temyiz süresidir."],
["İdari başvuru süreyi durdurduğundan süre işlemez",["Davacı vekili","Başvurmuştuk."],0,"İvedi yargılamada m.11 uygulanmaz."]]},
{l:[["Davacı vekili","Karar aleyhimize çıkarsa istinaf yolu açık değil mi?"]],q:"Kanun yolu hakkında ne dersin?",o:[
["İstinaf yoluna 30 gün içinde başvurulur",["Davacı vekili","Öyle bilirdim."],0,"İvedi yargılamada istinaf yoktur (m.45/8)."],
["İvedi yargılamada istinaf yoktur; nihai karara karşı 15 gün içinde temyiz edilebilir (m.20/A)",["Katip","Kanun yolu bilgisi verildi."],1,"Doğru."],
["Karar kesindir, hiçbir kanun yolu yoktur",["İdare vekili","Kesin."],0,"Temyiz yolu açıktır."],
["Temyiz süresi 7 gündür",["Davacı vekili","Kısa."],0,"7 günlük süreler başka durumlar içindir; ivedi yargılamada temyiz süresi 15 gündür."]]}]},
{ad:"İdare Hukuku",mah:"Ankara 12. İdare Mahkemesi",es:"2026/880 E.",ozet:"Merkezî sınav davası",bil:"ÖSYM sınav sonucu 02.07.2026’da ilan edildi. Davacı 03.07’de itiraz etti, ret cevabı sonrası dava 25.07.2026’da açıldı.",s:[
{l:[["Davacı vekili","İtirazımız süreyi durdurdu; süremiz var."],["İdare vekili","Merkezî sınavlarda dava süresi 10 gündür."]],q:"Süre hakkında kararın?",o:[
["Süre 60 gün; itiraz süreyi durdurur, süresinde",["İdare vekili","Özel usul."],0,"Merkezî sınavlarda özel süre vardır."],
["Süre 10 gündür ve idari başvuru süreyi durdurmaz (İYUK m.20/B); dava süreden reddedilir",["Katip","Süre aşımı tutanağa geçti."],1,"Doğru."],
["Süre 30 gündür",["Davacı vekili","Genel sınav süresi."],0,"30 gün vergi davasıdır; burada 10 gün."],
["Süre yoktur, her zaman açılır",["Davacı vekili","Sınav özel."],0,"Süre vardır."]]},
{l:[["Davacı vekili","Yürütmeyi durdurma talebi reddedilirse itiraz edebilir miyiz?"]],q:"Cevabın?",o:[
["7 gün içinde bölge idare mahkemesine itiraz edilebilir",["Davacı vekili","Genel kural."],0,"Merkezî sınav davasında YD kararlarına itiraz edilemez."],
["YD kararlarına itiraz edilemez; nihai karara karşı 5 gün içinde temyiz edilebilir (m.20/B)",["Katip","Not edildi."],1,"Doğru."],
["Temyiz yoktur",["İdare vekili","Kesin."],0,"5 gün içinde temyiz vardır."],
["Temyiz süresi 30 gündür",["Davacı vekili","Genel süre."],0,"Burada 5 gündür."]]}]}
);

{ad:"Borçlar Hukuku",mah:"Kocaeli 4. Asliye Hukuk Mahkemesi",es:"2026/1001 E.",ozet:"Bekletici mesele, birleştirme, karşı dava",bil:"Davacı 600.000 TL’lik senede dayanarak alacak davası açtı. Davalı, aynı senet için sahtecilik nedeniyle ceza davası açıldığını bildiriyor. Aynı mahkemede taraflar arasında ikinci bir alacak davası da var.",s:[
{l:[["Davalı vekili","Ceza davasının sonucu beklenmeli; senet sahtedir."],["Davacı vekili","Bu davayı geciktirmek için yapılıyor."]],q:"Ceza davası hakkında ne yaparsın?",o:[
["Ceza davası derdest diye hukuk davasını her hâlde durdururum",["Davacı vekili","Gecikme olur."],0,"Her derdest ceza davası bekletici mesele sayılmaz."],
["Hukuk davasının sonucu ceza davasında çözülecek sahtelik sorununa bağlıysa bekletici mesele yaparım (HMK m.165)",["Katip","Ceza dosyasının durumu istendi."],1,"Doğru. Bağlılık ilişkisi aranır."],
["Ceza kararı hakimi hiç ilgilendirmez, bekletici mesele yapmam",["Davalı vekili","Sahtelik kritik."],0,"Hükmün başka bir davaya bağlı olduğu hâlde bekletici mesele yapılabilir."],
["Bekletici mesele ancak davacı isterse yapılır",["Davacı vekili","Biz istemiyoruz."],0,"Mahkeme bağlılığı değerlendirir."]]},
{l:[["Katip","İkinci alacak davası (2026/1099 E.) aynı mahkemede, aynı taraflar arasında."],["Davalı vekili","Davaların birleştirilmesini talep ediyoruz."]],q:"Birleştirme talebinde kararın?",o:[
["Birleştirme yalnızca davacı isterse yapılır",["Davalı vekili","Talep bizden."],0,"Birleştirme taraf talebiyle ya da re’sen yapılabilir."],
["Bağlantı varsa davaları birleştiririm (HMK m.166); birleştirilen dava birlikte görülür",["Katip","Birleştirme kararı yazıldı."],1,"Doğru."],
["Aynı mahkemede olsa da birleştirilemez",["Davalı vekili","Aynı mahkeme."],0,"Aynı mahkemede bağlantılı davalar birleştirilebilir."],
["Birleştirmede ilk dava düşer",["Davacı vekili","Dava korunmalı."],0,"Davalar birlikte görülür, ilk dava düşmez."]]},
{l:[["Davalı vekili","Cevap süresi geçti ama karşı dava açıyoruz; sözlü talep ediyoruz."]],q:"Karşı dava talebine ne dersin?",o:[
["Tahkikat sonuna kadar karşı dava açılabilir",["Davalı vekili","Haklıyız."],0,"Karşı dava cevap dilekçesiyle birlikte açılır."],
["Karşı dava cevap dilekçesiyle birlikte açılır (HMK m.132); süre geçtiğinden ayrı dava açılmalıdır",["Katip","Talep reddedildi."],1,"Doğru."],
["Hakim karşı davayı resen açar",["Davalı vekili","Kolaylık."],0,"Karşı dava taraf iradesiyle açılır."],
["Islah ile karşı dava açılır",["Davalı vekili","Islah yöntemi."],0,"Islah karşı dava açmak için değildir."]]}]},
{ad:"Ticaret Hukuku",mah:"Bursa 1. Asliye Ticaret Mahkemesi",es:"2026/1002 E.",ozet:"Delil: imza inkârı",bil:"Davacı, 300.000 TL’lik bonoya dayanarak alacak istiyor. Davalı bonodaki imzayı inkâr ediyor.",s:[
{l:[["Davalı vekili","Senetteki imza müvekkilime ait değil."],["Davacı vekili","Senet açık, imza davalının."]],q:"İmza inkârı üzerine ne yaparsın?",o:[
["İnkâr yeterlidir, davayı reddederim",["Davacı vekili","İspat edilmeden olmaz."],0,"İnkâr üzerine imza incelemesi yapılır."],
["Örnek imzalar aldırır, bilirkişi incelemesi için görevlendirme yaparım",["Katip","Örnek imza alındı, bilirkişi atandı."],1,"Doğru. İmzanın aidiyeti bilirkişiyle araştırılır."],
["Tanık dinleyip imzayı tanıkla ispat ettiririm",["Davacı vekili","Tanık yok."],0,"İmza aidiyeti belge incelemesiyle çözülür."],
["Davalıyı derhal mahkûm ederim",["Davalı vekili","Haksızlık."],0,"İnkâr varken inceleme yapılmadan karar verilmez."]]},
{l:[["Katip","Bilirkişi: imza davalıya aittir."],["Davalı vekili","Borcu ödedik ama belge yok."]],q:"Hükmün?",o:[
["Dava reddedilir",["Davacı vekili","İmza sabit."],0,"İmza davalıya ait olduğundan senet geçerlidir."],
["İmza davalıya ait olduğundan senet geçerlidir; ödeme savunmasını davalı ispatlamalıdır, ispatlayamazsa dava kabul edilir",["Katip","Karar: kabul."],1,"Doğru. Ödeme savunmasını davalı ispatlar."],
["İspat yükü davacıdadır",["Davalı vekili","Davacı ispatlasın."],0,"Senet alacaklıdadır; ödeme iddiasında yük davalıdadır."],
["Davalının inkârı kötü niyetli sayıp dava reddedilir",["Davacı vekili","Anlamsız."],0,"Kötü niyet ayrı bir değerlendirmedir, ret sebebi değildir."]]}]},
{ad:"İş Hukuku",mah:"Bursa 2. İş Mahkemesi",es:"2026/1003 E.",ozet:"Duruşma düzeni",bil:"Tanık beyanı sırasında davacı vekili tanığın sözünü sürekli kesiyor; seyircilerden biri telefonla ses kaydı alıyor.",s:[
{l:[["Katip","Seyircilerden biri telefonu masaya yaslamış, kayıt ışığı yanıyor."]],q:"Ne yaparsın?",o:[

["Uyarırım; ses ve görüntü kaydına izin vermem, devam ederse salondan çıkarırım; tutanağa geçiririm",["Katip","Uyarı tutanağa geçti."],1,"Doğru. Hakim duruşma düzenini sağlar."],
["Önemsemem",["Davacı vekili","Sorun yok."],0,"Kayıt, tanık güvenliği ve düzen açısından önemlidir."],
["Telefona el koyar kalıcı olarak saklarım",["Seyirci","Hakkımı ihlal."],0,"Orantısızdır."]]},
{l:[["Davacı vekili","Tanığa soru soruyorum, sözünü kesmeye devam edeceğim."]],q:"Vekilin davranışına karşı?",o:[
["Vekili hemen salondan çıkarırım",["Davalı vekili","Çok sert."],0,"Önce uyarı gerekir."],
["Uyarır, tutanağa geçirir; devam ederse kanundaki disiplin tedbirlerini uygularım",["Katip","Tutanak yazıldı."],1,"Doğru. Orantılı kademeli yaptırım."],
["Tanığı dinlemekten vazgeçerim",["Davalı vekili","Delil kaybı."],0,"Delil toplanmaktan vazgeçilmez."],
["Baro başkanlığına yazı yazıp duruşmayı bitiririm",["Davacı vekili","Bu kadar değil."],0,"Duruşma sürdürülür, baro bildirimi ayrıca yapılabilir."]]}]},
{ad:"Ticaret Hukuku",mah:"Gaziantep 2. Asliye Ticaret Mahkemesi",es:"2026/1004 E.",ozet:"Ön inceleme ve sulh",bil:"Cevap dilekçeleri teati edildi. Dosya ön inceleme duruşmasında; taraflar arabuluculuktan anlaşmasız dönmüş.",s:[

["Dava şartları ve ilk itirazları inceler, uyuşmazlık konularını belirler, delilleri tartışır, sulh ve arabuluculuğu teşvik ederim (HMK m.137)",["Katip","Ön inceleme tutanağı tutuldu."],1,"Doğru."],
["Sadece harçları kontrol ederim",["Davacı vekili","Yetersiz."],0,"Ön inceleme çok daha geniştir."],

{l:[["Davacı vekili","Taraflar sulh olmaya hazır."]],q:"Sulh sağlanırsa ne yaparsın?",o:[

["Sulh şartlarını tutanağa geçirir, taraflara okutup imzalatırım; sulh kesin hüküm gibi sonuç doğurur (HMK m.313)",["Katip","Sulh tutanağı imzalandı."],1,"Doğru."],
["Dava düşer, harçlar iade edilir",["Davacı vekili","Hesap yanlış."],0,"Sulh hükümle sonuçlanır."],
["Mahkeme sulhu onaylamaz",["Davalı vekili","Onay gerekir."],0,"Onay değil, tutanak ve imza gerekir."]]}]},
{ad:"Borçlar Hukuku",mah:"Eskişehir 1. Asliye Hukuk Mahkemesi",es:"2026/1005 E.",ozet:"İhtiyati tedbir",bil:"Taşınmaz satış vaadi davasında davacı, davalının taşınmazı üçüncü kişiye devretmesini önlemek için ihtiyati tedbir istiyor. Tapu kaydı ve satış vaadi sözleşmesi dosyada.",s:[
{l:[["Davacı vekili","Devir olursa hakkımız boşa gidecek; tedbir istiyoruz."],["Davalı vekili","Önce duruşma yapılmalı."]],q:"Tedbir talebinde neye bakarsın?",o:[

["Yaklaşık ispat ve tedbirin gecikmesinde sakınca koşullarını değerlendiririm (HMK m.389-390)",["Katip","Delil ve tapu kaydı incelendi."],1,"Doğru."],
["Hiçbir şart aramam",["Davacı vekili","Yeter."],0,"Koşullar aranır."],

{"ad": "İdare Hukuku", "mah": "Konya 1. İdare Mahkemesi", "es": "2026/1601 E.", "ozet": "İdari makamların sükutu (m.10)", "bil": "Davacı 01.06.2026’da idareye başvurdu; idare cevap vermedi. Dava 15.10.2026’da açıldı.", "s": [{"l": [["Davacı vekili", "İdare cevap vermedi; süre işlemez, hâlâ dava açabiliriz."], ["İdare vekili", "30 günde cevap yok; istek reddedilmiş sayılır."]], "q": "Sükutun sonucu nedir?", "o": [["30 gün içinde cevap verilmezse istek reddedilmiş sayılır; dava açma süresi 30 günün bittiği tarihten itibaren işler (İYUK m.10)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["İdarenin sessizliği süreyi sonsuza uzatır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Sessizlik ret sayılır."], ["Süre ancak idarenin kesin cevabıyla başlar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Sessizlikte süre kendiliğinden işler."], ["Başvuru yapılması davayı engeller", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Başvuru dava hakkını kaldırmaz."]]}, {"l": [["Davacı vekili", "Dava 15.10.2026’da açıldı."]], "q": "Süre bakımından kararın?", "o": [["60 günlük dava süresi geçmiştir; ara verme uzaması da yetmez; dava süreden reddedilir", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Dava süresindedir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre 01.07’den itibaren 60 gündür."], ["Süre 4 aydır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "4 ay, kesin cevap beklenirken bekleme üst sınırıdır; burada cevap yok."], ["Ara verme nedeniyle 1 ay uzar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Ara verme uzaması 7 gündür."]]}]},
{"ad": "İdare Hukuku", "mah": "Isparta İdare Mahkemesi", "es": "2026/1602 E.", "ozet": "İptal kararının icrası (m.28)", "bil": "Davacı lehine iptal kararı verildi ve idareye tebliğ edildi; idare 45 gündür işlem yapmadı.", "s": [{"l": [["Davacı vekili", "İdare kararı uygulamıyor."]], "q": "İdarenin yükümlülüğü nedir?", "o": [["Karar gereğince gecikmeksizin işlem tesis etmek zorundadır; süre tebliğden başlayarak 30 günü geçemez (m.28/1)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["60 gün süresi vardır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Üst sınır 30 gündür."], ["Dilediği zaman uygulayabilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Gecikme yasaktır."], ["Kararı istinaf sonucuna kadar bekler", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İstinaf kararı kendiliğinden durdurmaz."]]}, {"l": [["Davacı vekili", "İdare 45 gündür susuyor, ne yapalım?"]], "q": "Davacının yolu nedir?", "o": [["İdare aleyhine maddi ve manevi tazminat davası açabilir; kamu görevlisine karşı değil, ilgili idareye karşı açılır (m.28/3-4)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Kamu görevlisi aleyhine tazminat davası açar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Tazminat davası ancak idareye karşı açılır."], ["Aynı konuda yeniden iptal davası açar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Yeni dava gerekmez."], ["Hiçbir yol yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Tazminat yolu açıktır."]]}]},
{"ad": "İdare Hukuku", "mah": "Ankara 5. İdare Mahkemesi", "es": "2026/1603 E.", "ozet": "Yargılamanın yenilenmesi (m.53)", "bil": "Kesinleşen karardan sonra davacı, kararın verilmesinden önce zorlayıcı sebeple elde edemediği bir belgeye ulaştı.", "s": [{"l": [["Davacı vekili", "Belgeyi şimdi bulduk; karar düzeltme isteyelim."]], "q": "Hangi yola başvurulur?", "o": [["Yargılamanın yenilenmesi istenebilir (m.53/1-a); süre sebebin gerçekleştiği günü izleyen günden 60 gündür (m.53/3)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Karar düzeltme", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Karar düzeltme yolu kaldırılmıştır."], ["Yeni dava açılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Aynı konuda yeni dava açılamaz."], ["Süre 1 yıldır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "1 yıl yalnızca AİHM kararı içindir."]]}, {"l": [["Davacı vekili", "Ayrıca AİHM, hükmün sözleşmeyi ihlal ettiğini tespit etti; karar kesinleşti."]], "q": "Bu sebeple süre nedir?", "o": [["AİHM kararının kesinleştiği tarihten itibaren 1 yıl (m.53/3)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["60 gün", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "60 gün diğer sebepler içindir."], ["10 yıl", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "10 yıl, çelişen kararlar sebebi içindir."], ["Süre yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre vardır."]]}]},
{"ad": "İdare Hukuku", "mah": "Bursa 1. İdare Mahkemesi", "es": "2026/1604 E.", "ozet": "Bağlantılı davalar (m.38)", "bil": "Aynı idari olaydan doğan iki dava var: biri sende, diğeri İzmir İdare Mahkemesinde. Bursa ve İzmir ayrı bölge idare mahkemelerinin yargı çevresindedir.", "s": [{"l": [["Davacı vekili", "İki dava aynı olaydan doğuyor."]], "q": "Bağlantı nedir?", "o": [["Aynı maddi veya hukuki sebepten doğan ya da biri hakkında verilecek hüküm diğerini etkileyen davalar bağlantılıdır (m.38/1)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Yalnızca aynı mahkemedeki davalar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Farklı mahkemelerdeki davalar da bağlantılı olabilir."], ["Taraflar aynıysa her hâlde", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Taraf aynılığı tek başına yetmez."], ["Konusu para olan davalar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bağlantı konuyla ilgili değildir."]]}, {"l": [["Katip", "İki mahkeme farklı bölge idare mahkemelerinin çevresinde."]], "q": "Dosyalar nereye gönderilir?", "o": [["Danıştaya gönderilir (m.38/4)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Bursa Bölge İdare Mahkemesine", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Aynı bölgede olsalardı BİM'e gönderilirdi."], ["İzmir idare mahkemesine", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Yetkili mahkeme Danıştaydır."], ["Davalar birleştirilmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bağlantı varsa dosyalar gönderilir."]]}]},
{"ad": "Borçlar Hukuku", "mah": "Mersin 2. Asliye Hukuk Mahkemesi", "es": "2026/1605 E.", "ozet": "Kefalet sözleşmesinin geçerliliği", "bil": "Banka, 400.000 TL kredinin kefili evli A.D.’den takip yapıyor. Kefil kefalet miktarını ve tarihi kendi eliyle yazmamış; eşinin yazılı rızası yok. Kefil, borçlu şirketin ortağı veya yöneticisi değildir.", "s": [{"l": [["Banka vekili", "Kefil bilerek imzaladı."], ["Davalı vekili", "Eşin rızası yok."]], "q": "Eş rızası konusunda ne dersin?", "o": [["Evli kişinin kefil olabilmesi için eşin yazılı rızası şarttır; rıza yoksa kefalet geçersizdir (TBK m.584)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Eşin rızası gerekmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Evli kefil için rıza şarttır."], ["Rıza sözlü de olabilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Rıza yazılı olmalıdır."], ["Rıza yalnızca tanıkla ispatlanır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Yazılı şekil aranır."]]}, {"l": [["Davalı vekili", "Miktar ve tarih bizim el yazımızla değil."]], "q": "Şekil bakımından?", "o": [["Kefilin sorumluluğunun azami miktarı ve tarih kefilin eliyle yazılmalıdır; eksiklik geçersizlik sebebidir (TBK m.583)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Daktilo/bilgisayar yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "El yazısı aranır."], ["Banka doldurabilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kefil kendisi yazar."], ["Şekil önemsizdir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kefalet şekle bağlıdır."]]}]},
{"ad": "Ticaret Hukuku", "mah": "Denizli 1. Asliye Ticaret Mahkemesi", "es": "2026/1606 E.", "ozet": "Tacirler arası cezai şart", "bil": "İki tacir şirket arasında teslim gecikmesine bağlı 300.000 TL cezai şart öngörülmüş. Gecikme 40 gün sabit. Borçlu cezai şartın fahiş olduğunu ileri sürüyor.", "s": [{"l": [["Borçlu vekili", "Cezai şart fahiş; indirim isteriz."], ["Alacaklı vekili", "Taraflar tacir; indirim olmaz."]], "q": "İndirim talebi hakkında?", "o": [["Tacirler arasında ticari işlerde cezai şart fahiş olsa bile hakim indirim yapamaz; tacir borçlu TBK m.182/3 indirimini isteyemez (TTK m.22)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["TBK m.182/3 gereği indirim yapılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Tacirler arasında bu indirim yapılmaz."], ["Hakim re’sen indirir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Tacir ilişkisinde re’sen indirim yok."], ["Yarıya indirilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İndirim sınırı yoktur, indirim yapılmaz."]]}, {"l": [["Katip", "Bilirkişi: gecikme 40 gün, cezai şart koşulları oluştu."]], "q": "Hükmün?", "o": [["Cezai şart aynen kabul edilir; indirim yapılmaz", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Cezai şart tamamen reddedilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Koşullar oluşmuştur."], ["Makul düzeye indirilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Tacirler arasında indirim yapılmaz."], ["Taraflar yeniden pazarlık eder", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Sözleşme bağlayıcıdır."]]}]},

{"ad": "Borçlar Hukuku", "mah": "Aydın 1. Asliye Hukuk Mahkemesi", "es": "2026/1701 E.", "ozet": "Aşırı yararlanma (TBK m.28)", "bil": "Davacı, borç baskısı altında evini 2.000.000 TL’ye sattı; piyasa değeri 5.000.000 TL. Satış 01.03.2026’da yapıldı, zor durum 01.05.2026’da sona erdi, dava 20.09.2026’da açıldı.", "s": [{"l": [["Davacı vekili", "Zor durumdaydık, bedel çok düşük."], ["Davalı vekili", "Taraflar serbestçe anlaştı."]], "q": "Hangi koşullar aranır?", "o": [["Edimler arasında açık oransızlık bulunması ve bunun zarar görenin zor durumundan, düşüncesizliğinden ya da deneyimsizliğinden yararlanılarak gerçekleştirilmesi (TBK m.28)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Yalnızca bedelin düşük olması yeter", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Yararlanma unsuru da aranır."], ["Taraf iradesi her hâlde bağlayıcıdır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Aşırı yararlanma sözleşmeyi bağlayıcılıktan çıkarabilir."], ["Satıcının avukatı olması şarttır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Böyle bir şart yok."]]}, {"l": [["Katip", "Zor durum 01.05.2026’da sona erdi, dava 20.09.2026’da açıldı."]], "q": "Süre ve hak?", "o": [["Hak, zor durumun ortadan kalktığından başlayarak 1 yıl ve her hâlde sözleşmeden başlayarak 5 yıl içinde kullanılır; dava süresindedir. Zarar gören ya sözleşmeyle bağlı olmadığını bildirip edimin iadesini ya da oransızlığın giderilmesini isteyebilir", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Süre 1 aydır, dava geçtir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "1 ay kira tahliyesi içindir."], ["Süre 10 yıldır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre 1 yıl/5 yıldır."], ["Yalnızca edimin iadesi istenebilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İki seçenek vardır."]]}]},
{"ad": "Borçlar Hukuku", "mah": "Elazığ 2. Asliye Hukuk Mahkemesi", "es": "2026/1702 E.", "ozet": "Temerrüt ve dönme (TBK m.123-125)", "bil": "Düğün için sipariş edilen dekor, düğün tarihi olan 05.09.2026’ya kadar teslim edilmedi. Alıcı süre vermeden sözleşmeden dönmek istiyor.", "s": [{"l": [["Alıcı vekili", "Düğün geçti, süre verilmesine gerek yok."], ["Satıcı vekili", "Süre verilmeliydi."]], "q": "Süre verilmesi gerekir mi?", "o": [["Gerekmez; ifanın belirli zamanda yapılmaması hâlinde ifanın artık kabul edilmeyeceği sözleşmeden anlaşılıyorsa süre verilmesine gerek yoktur (TBK m.124/3)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Her hâlde süre verilmelidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "m.124 istisnalar sayar."], ["Süre yalnızca hakim tarafından verilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Alacaklı da verebilir."], ["Düğün tarihi önemli değildir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Sözleşmenin amacı önemlidir."]]}, {"l": [["Alıcı vekili", "Hangi seçimlik haklarımız var?"]], "q": "Alacaklının hakları?", "o": [["Borcun ifasını ve gecikme tazminatını isteyebilir; ya da ifadan vazgeçtiğini hemen bildirerek olumlu zararını isteyebilir veya sözleşmeden dönebilir (TBK m.125)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Yalnızca ifa isteyebilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Başka haklar da var."], ["Yalnızca dönebilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Üç seçenek var."], ["Hakları yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Hakları vardır."]]}]},
{"ad": "Borçlar Hukuku", "mah": "Antalya 5. Sulh Hukuk Mahkemesi", "es": "2026/1703 E.", "ozet": "Konut kirası: uzama ve ihtiyaç", "bil": "3 yıllık belirli süreli konut kirası 31.05.2026’da sona erdi. Kiraya veren, süre bitimine dayanarak tahliye ve oğlu için konut ihtiyacı sebebiyle dava istiyor. Dava 10.07.2026’da açıldı.", "s": [{"l": [["Kiraya veren vekili", "Süre bitti, tahliye edilsin."], ["Kiracı vekili", "Sözleşme uzadı."]], "q": "Süre bitimi tahliye sebebi midir?", "o": [["Hayır; konut kirasında kiracı bildirimde bulunmadıkça sözleşme aynı koşullarla 1 yıl uzar, kiraya veren süre bitimine dayanarak sözleşmeyi sona erdiremez (TBK m.347)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Evet, süre bitimi yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Konut kirasında bu mümkün değil."], ["Yalnızca 3 ay beklenir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre 1 yıl uzar."], ["Kiracı itiraz ederse tahliye edilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İtiraz tek başına yetmez."]]}, {"l": [["Kiraya veren vekili", "Oğlum için konut ihtiyacı var."]], "q": "İhtiyaç davası süresi?", "o": [["Belirli süreli sözleşmede sürenin sonundan başlayarak 1 ay içinde dava açılmalıdır; 10.07.2026 geçtir, dava reddedilir (TBK m.350)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Dava süresindedir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Son tarih 30.06’dır."], ["Süre yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "1 aylık süre vardır."], ["Süre 6 aydır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "6 ay yeni malik içindir."]]}]},
{"ad": "Ticaret Hukuku", "mah": "Bursa 3. Asliye Ticaret Mahkemesi", "es": "2026/1704 E.", "ozet": "Genel kurul kararı: iptal ve butlan", "bil": "Pay sahibi, 15.05.2026 tarihli genel kurulda kararı karşı oy vererek tutanağa geçirtti. Karar, kendisinin genel kurula katılma hakkını ortadan kaldırıyor. İptal davası 18.09.2026’da açıldı.", "s": [{"l": [["Davalı şirket vekili", "İptal davası 3 ayı geçti."], ["Davacı vekili", "Karar batıldır."]], "q": "İptal davası süresi?", "o": [["İptal davası karar tarihinden itibaren 3 ay içinde, şirket merkezindeki asliye ticaret mahkemesinde açılır (TTK m.445); 18.09.2026 geçtir", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Süre 1 yıldır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "3 aydır."], ["Süre yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İptalde süre vardır."], ["Süre 30 gündür", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "3 aydır."]]}, {"l": [["Davacı vekili", "Karar katılma hakkımızı ortadan kaldırıyor."]], "q": "Batıllık iddiası?", "o": [["Pay sahibinin genel kurula katılma hakkını sınırlayan veya ortadan kaldıran karar batıldır (TTK m.447/1-a); iptal süresinin geçmesi batıllığı engellemez", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["İptal süresi geçtiği için her şey biter", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Batıl karar iptal süresine bağlı değildir."], ["Batıllık yalnızca yönetim kurulu isterse", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Pay sahibi de dava açabilir."], ["Batıllık sermayeyle ilgilidir, katılma hakkıyla değil", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "m.447 katılma hakkını da sayar."]]}]},
{"ad": "Ticaret Hukuku", "mah": "Trabzon 1. Asliye Ticaret Mahkemesi", "es": "2026/1705 E.", "ozet": "Tacirler arası ihtar ve ticari iş", "bil": "İki tacir arasında teslim gecikti. Alacaklı, borçluyu temerrüde düşürmek için adi e-posta gönderdi. Borçlu, işlemin ticari işletmesiyle ilgisiz olduğunu iddia ediyor.", "s": [{"l": [["Alacaklı vekili", "E-postayla ihtar ettik."], ["Borçlu vekili", "E-posta geçerli ihtar değil."]], "q": "İhtar şekli?", "o": [["Tacirler arasında temerrüde düşürmeye, feshe, dönmeye ilişkin ihtarlar noter, taahhütlü mektup, telgraf ya da güvenli elektronik imzalı KEP ile yapılır; adi e-posta yeterli değildir (TTK m.18/3)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Adi e-posta yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Şekil kanunda sayılmıştır."], ["Sözlü ihtar yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Yazılı ve belirli yollarla yapılır."], ["Whatsapp mesajı yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Şekil sayılan yollardan biri değil."]]}, {"l": [["Borçlu vekili", "Bu borç adi borçtur."]], "q": "Borcun niteliği?", "o": [["Tacirin borçlarının ticari olması asıldır; gerçek kişi tacir, işlemi yaparken ticari işletmesiyle ilgili olmadığını açıkça bildirmişse borç adi sayılır (TTK m.19)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Adi olduğu iddia edilince adi sayılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İspat/bildirim gerekir."], ["Tacirin borcu her hâlde adidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Asıl olan ticaridir."], ["Karine yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "m.19 karine koyar."]]}]},
{"ad": "İş Hukuku", "mah": "Kocaeli 1. İş Mahkemesi", "es": "2026/1706 E.", "ozet": "Toplu işçi çıkarma (m.29)", "bil": "150 işçi çalıştıran işyerinde işveren bir ay içinde 18 işçinin sözleşmesini sona erdirdi; bildirim yapmadı.", "s": [{"l": [["İşçiler vekili", "Toplu işçi çıkarma yapılmış."], ["İşveren vekili", "18 işçi azdır."]], "q": "Toplu işçi çıkarma mı?", "o": [["Evet; 101-300 işçi çalıştıran işyerinde bir ay içinde en az %10 işçinin (15) işine son verilmesi toplu işçi çıkarmadır; 18 işçi bu sınırı aşar (İşK m.29)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Hayır, 30 işçi gerekir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "301+ işçi için 30."], ["Hayır, %20 gerekir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Oran %10."], ["Süre önemli değildir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bir aylık süre aranır."]]}, {"l": [["Katip", "İşveren bildirim yapmamış."]], "q": "Usul?", "o": [["En az 30 gün önce yazıyla işyeri sendika temsilcilerine, bölge müdürlüğüne ve İŞKUR’a bildirilir; fesih bildirimleri bölge müdürlüğüne bildirimden 30 gün sonra hüküm doğurur (m.29)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Bildirim gerekmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bildirim zorunludur."], ["Yalnızca işçilere bildirim yeter", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bölge müdürlüğü ve İŞKUR’a da bildirilir."], ["Bildirim 7 gün önce yapılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "30 gündür."]]}]},
{"ad": "İş Hukuku", "mah": "Mersin 3. İş Mahkemesi", "es": "2026/1707 E.", "ozet": "İş arama izni (m.27)", "bil": "İşveren, işçinin 8 haftalık bildirim süresi boyunca iş arama izni vermedi. İşçi ücret farkı istiyor.", "s": [{"l": [["İşçi vekili", "Hiç izin kullandırılmadı."], ["İşveren vekili", "İşçi izin istemedi."]], "q": "İzin ilkesi?", "o": [["Bildirim süreleri içinde iş saatleri içinde ve ücret kesintisi yapmadan, günde iki saatten az olmamak üzere verilir; işçi isterse saatleri birleştirip toplu kullanabilir (İşK m.27)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["İşçi istemezse verilmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İşveren vermek zorundadır."], ["Yalnızca fesih sonrası verilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bildirim süresi içinde verilir."], ["Günde 1 saat yeter", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "En az 2 saat."]]}, {"l": [["Katip", "İzin kullandırılmadı, işçi çalıştırıldı."]], "q": "Sonuç?", "o": [["Verilmeyen veya eksik kullandırılan izin süresine ilişkin ücret işçiye ödenir; izin sırasında çalıştırılırsa çalışılan süre %100 zamlı ödenir (m.27)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Hiçbir ücret ödenmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Ücret ödenir."], ["Yalnızca %50 zam", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "%100 zamlı."], ["Zam %200 uygulanır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Zam %100’dür."]]}]},
{"ad": "İdare Hukuku", "mah": "Muğla 1. İdare Mahkemesi", "es": "2026/1708 E.", "ozet": "Savunma süresi (İYUK m.16)", "bil": "Dava dilekçesi idareye tebliğ edildi. İdare 30 günlük süreyi kaçırdı; 40. günde ek süre istiyor.", "s": [{"l": [["İdare vekili", "Ek süre verin."], ["Davacı vekili", "Süre geçti."]], "q": "Ek süre talebi?", "o": [["Süre geçtikten sonra yapılan uzatma talepleri kabul edilmez; haklı sebep varsa süre ancak bir defaya mahsus 30 günü geçmemek üzere süre içinde uzatılabilir (m.16/3)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Her zaman uzatılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre geçtikten sonra kabul edilmez."], ["Süre 15 gündür", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre 30 gündür."], ["Uzatma birden çok defa yapılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bir defaya mahsus."]]}, {"l": [["İdare vekili", "40. günde savunma sunduk."]], "q": "Geç savunmanın etkisi?", "o": [["Süreden sonra verilen savunmaya dayanılarak hak iddia edilemez (m.16/4); mahkeme yine de dosyayı kendiliğinden inceler (m.20)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Savunma tamamen kabul edilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Geç savunmaya dayanılamaz."], ["Dava otomatik kabul edilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İnceleme kendiliğinden yapılır."], ["Savunma yok sayılır ve dosya incelenmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İnceleme yapılır."]]}]},
{"ad": "İdare Hukuku", "mah": "Kırıkkale İdare Mahkemesi", "es": "2026/1709 E.", "ozet": "Yürütmenin durdurulması (m.27)", "bil": "Davacı, dayanak kanunun Anayasa Mahkemesinde iptali istendiğini belirterek yürütmenin durdurulmasını istiyor. Daha önce aynı sebeplerle reddedilen bir YD talebi de var.", "s": [{"l": [["Davacı vekili", "Kanun AYM’de, yürütmeyi durdurun."]], "q": "Bu gerekçe yeterli mi?", "o": [["Hayır; yalnızca ilgili kanun veya Cumhurbaşkanlığı kararnamesi hükmünün iptali istemiyle Anayasa Mahkemesine başvurulduğu gerekçesiyle YD kararı verilemez (m.27/2)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Evet, yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "m.27/2 engel koyar."], ["Yalnızca bakan isterse", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Alakasız."], ["AYM karar verene kadar bekler", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bekletme yok."]]}, {"l": [["Davacı vekili", "Aynı sebeplerle yeniden talep ediyoruz."]], "q": "Aynı sebeple ikinci talep?", "o": [["Aynı sebeplere dayanılarak ikinci kez yürütmenin durdurulması isteminde bulunulamaz (m.27/10)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["İstenebilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Yasak."], ["Her 6 ayda bir istenebilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Böyle bir süre yok."], ["Hakim re’sen verir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Aynı sebep yasak."]]}]},
{"ad": "İdare Hukuku", "mah": "Düzce İdare Mahkemesi", "es": "2026/1710 E.", "ozet": "Duruşma (m.17, 19)", "bil": "Davacı, iptal davasında duruşma yapılmasını talep etti. Duruşma 03.11.2026 için kararlaştırıldı.", "s": [{"l": [["Davacı vekili", "Dilekçede duruşma istedik."]], "q": "Duruşma talebi?", "o": [["İptal davalarında taraflardan birinin isteği üzerine duruşma yapılır; talep dava dilekçesinde veya cevap ve savunmalarda yapılabilir (m.17)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["İdari yargıda duruşma yapılmaz", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Talep üzerine yapılır."], ["Yalnızca idare isterse yapılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Taraflardan biri isteyebilir."], ["Duruşma sözlü yargılamadır, evrak incelenmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İnceleme evrak üzerinden de yapılır."]]}, {"l": [["Katip", "Duruşma yapıldı."]], "q": "Duruşma süreleri?", "o": [["Duruşma davetiyeleri duruşmadan en az 30 gün önce gönderilir (m.17/5); duruşma yapıldıktan sonra en geç 15 gün içinde karar verilir (m.19)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Davetiye 3 gün önce", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "30 gündür."], ["Karar 60 gün içinde", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "15 gündür."], ["Karar süresi yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "15 gün vardır."]]}]}

{"ad": "Borçlar Hukuku", "mah": "Malatya 2. Sulh Hukuk Mahkemesi", "es": "2026/1801 E.", "ozet": "Kira temerrüdü ve fesih ihtarı (TBK m.315)", "bil": "Konut kiracısı üç aylık kirayı ödemedi. Kiraya veren 10 gün süreli yazılı ihtar gönderip sözleşmeyi feshetti, tahliye istiyor.", "s": [{"l": [["Kiraya veren vekili", "10 gün verdik, ödenmedi, fesih geçerli."], ["Kiracı vekili", "Süre yetersiz."]], "q": "İhtar süresi yeterli mi?", "o": [["Hayır; konut ve çatılı işyeri kiralarında verilecek süre en az 30 gündür; 10 günlük süreyle yapılan fesih geçerli değildir (TBK m.315)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Evet, 10 gün yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Konutta en az 30 gün gerekir."], ["Süre 15 gündür", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Diğer kiralar için 10 gün, konutta 30 gündür."], ["Süre gerekmez, derhal feshedilir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre vermeden fesih mümkün değil."]]}, {"l": [["Kiraya veren vekili", "Süre ne zaman başlar?"]], "q": "Süre başlangıcı?", "o": [["Süre, kiracıya yazılı bildirimin yapıldığı tarihi izleyen günden itibaren işlemeye başlar (m.315)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Bildirim gününün kendisinde", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Ertesi günden başlar."], ["Kira gününden itibaren", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Bildirim tarihine bağlıdır."], ["Dava gününden itibaren", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Dava açılmadan önce verilir."]]}]},
{"ad": "Borçlar Hukuku", "mah": "Kırşehir Sulh Hukuk Mahkemesi", "es": "2026/1802 E.", "ozet": "Kira artışı sınırı (TBK m.344)", "bil": "Sözleşmede “her yıl kira %60 artar” yazıyor. Önceki kira yılında TÜFE 12 aylık ortalamalara göre değişim oranı %45. Kiracı fazla ödemeyi iade istiyor.", "s": [{"l": [["Kiracı vekili", "Artış şartı geçersiz."], ["Kiraya veren vekili", "Sözleşme serbestliği var."]], "q": "Artış şartı?", "o": [["Yenilenen kira dönemlerinde artış, bir önceki kira yılında TÜFE oniki aylık ortalamalara göre değişim oranını geçemez; fazlası geçersizdir (TBK m.344)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Artış şartı aynen geçerlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Üst sınır vardır."], ["Hakim her zaman %50’ye indirir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Sınır TÜFE’dir."], ["Artış hiç yapılamaz", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "TÜFE sınırına kadar yapılabilir."]]}, {"l": [["Kiracı vekili", "Sözleşmede hiç artış şartı olmasaydı?"]], "q": "Artış şartı yoksa?", "o": [["Anlaşma yoksa kira bedeli, bir önceki kira yılındaki TÜFE oniki aylık ortalamalara göre değişim oranında artırılarak belirlenir (m.344)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Kira hiç artmaz", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kanun artışı öngörür."], ["Kiraya veren dilediği kadar artırır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Sınır vardır."], ["Hakim taraflardan birini seçer", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "TÜFE esastır."]]}]},
{"ad": "Borçlar Hukuku", "mah": "Yozgat 1. Asliye Hukuk Mahkemesi", "es": "2026/1803 E.", "ozet": "Zamanaşımının kesilmesi (TBK m.154-156)", "bil": "Satış bedeli alacağı 2015’te muaccel oldu. Borçlu 2019’da kısmi ödeme yaptı. Alacaklı 2026’da dava açtı.", "s": [{"l": [["Borçlu vekili", "Alacak 10 yıllık zamanaşımına uğradı."], ["Alacaklı vekili", "Kısmi ödeme süreyi kesti."]], "q": "Kısmi ödemenin sonucu?", "o": [["Borçlunun kısmen ifada bulunması zamanaşımını keser (TBK m.154/1); kesilmeyle yeni bir süre işlemeye başlar (m.156)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Hiçbir etkisi yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kısmi ifa süreyi keser."], ["Süre durur, kesilmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kesilir, yeni süre başlar."], ["Zamanaşımı hemen dolar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kesilme dolmaz."]]}, {"l": [["Alacaklı vekili", "Genel süre kaçtır?"]], "q": "Genel zamanaşımı?", "o": [["Kanunda aksine hüküm yoksa her alacak 10 yıllık zamanaşımına tabidir (TBK m.146); 2019’dan itibaren yeni 10 yıl işlediğinden alacak zamanaşımına uğramamıştır", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["5 yıl", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "5 yıl dönemsel edimler içindir."], ["2 yıl", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Genel süre 10 yıldır."], ["20 yıl", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Ağır kusur gibi hâllerde bazı alacaklar için."]]}]},
{"ad": "Borçlar Hukuku", "mah": "Nevşehir 1. Asliye Hukuk Mahkemesi", "es": "2026/1804 E.", "ozet": "Eser sözleşmesi: ayıp ve zamanaşımı", "bil": "Ev tadilatı 01.2022’de teslim ve kabul edildi. 2026’da gizli bir tesisat ayıbı ortaya çıktı, işsahibi hemen bildirdi ve dava açtı. Yüklenici ayıbı kasten gizlemedi.", "s": [{"l": [["Yüklenici vekili", "Eser kabul edildi, sorumluluğumuz yok."], ["İşsahibi vekili", "Ayıp sonradan çıktı, hemen bildirdik."]], "q": "Kabulün sonucu?", "o": [["Kabulden sonra yüklenici sorumluluktan kurtulur; ancak kasten gizlenen ve gözden geçirmede fark edilemeyecek ayıplar için sorumluluğu sürer; sonradan çıkan ayıp gecikmeksizin bildirilmelidir (TBK m.477)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Kabulden sonra hiçbir ayıptan sorumlu olmaz", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kasten gizlenen ayıplar hariç."], ["Her ayıptan her zaman sorumludur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kabulden sonra sorumluluk kalkar."], ["İhbar gerekmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Sonradan çıkan ayıp ihbar edilir."]]}, {"l": [["Katip", "Teslim 01.2022, dava 05.2026."]], "q": "Zamanaşımı?", "o": [["Taşınmaz yapılarda ayıp davaları teslimden başlayarak 5 yılda zamanaşımına uğrar (m.478); 4 yıl 4 ay geçmiştir, süresindedir", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["2 yıl, geçmiştir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Taşınmaz yapıda 5 yıl."], ["20 yıl", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "20 yıl ağır kusur varsa."], ["Zamanaşımı yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre vardır."]]}]},
{"ad": "Ticaret Hukuku", "mah": "Tokat 1. Asliye Ticaret Mahkemesi", "es": "2026/1805 E.", "ozet": "Limited şirket pay devri (TTK m.595)", "bil": "Ortak, limited şirketteki payını adi yazılı sözleşmeyle devretti; noter onayı yok. Şirket sözleşmesinde devir hükmü yok. Genel kurul onay vermedi.", "s": [{"l": [["Devralan vekili", "Yazılı sözleşme yaptık."], ["Şirket vekili", "Noter onayı yok."]], "q": "Devir şekli?", "o": [["Esas sermaye payının devri ve devir borcunu doğuran işlemler yazılı şekilde yapılır ve tarafların imzaları noterce onanır (TTK m.595/1); adi yazılı sözleşme geçersizdir", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Adi yazılı sözleşme yeterlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Noter onayı şart."], ["Sözlü devir de geçerlidir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Yazılı ve noter onaylı olmalı."], ["Ticaret siciline tescil yeter", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Şekil şartı farklıdır."]]}, {"l": [["Devralan vekili", "Genel kurul onayı şart mı?"]], "q": "Genel kurul onayı?", "o": [["Şirket sözleşmesinde aksi yoksa pay devri için ortaklar genel kurulunun onayı şarttır; devir bu onayla geçerli olur; başvurudan 3 ay içinde genel kurul reddetmezse onay verilmiş sayılır (m.595/2, 7)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Onay gerekmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Aksi öngörülmemişse şarttır."], ["Onay sözlüdür", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Genel kurul kararıdır."], ["Ret kesinlikle yazılı olmalı, süre yok", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "3 ay süre vardır."]]}]},
{"ad": "Ticaret Hukuku", "mah": "Çorum 1. Asliye Ticaret Mahkemesi", "es": "2026/1811 E.", "ozet": "Ticari defterlerin ibrazı (TTK m.83-85)", "bil": "Fatura alacağı davasında taraflar defter ibrazı konusunda anlaşamıyor. Davacı tüm defterlerin ibrazını ve tamamının incelenmesini istiyor.", "s": [{"l": [["Davacı vekili", "Defterler getirilsin."], ["Davalı vekili", "Gizlilik var."]], "q": "Defter ibrazı?", "o": [["Ticari uyuşmazlıklarda mahkeme, tarafların ticari defterlerinin ibrazına resen veya taraflardan birinin istemi üzerine karar verebilir (TTK m.83/1)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["İbraz yalnızca tarafların rızasıyla olur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Mahkeme karar verebilir."], ["Defterler hiçbir hâlde ibraz edilmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İbraz mümkündür."], ["Yalnızca bilirkişi isterse", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Mahkeme resen de ister."]]}, {"l": [["Davacı vekili", "Defterlerin tamamı incelensin."]], "q": "İnceleme kapsamı?", "o": [["Defterlerin uyuşmazlıkla ilgili kısımları tarafların katılımıyla incelenir (m.84); tamamının incelenmesi malvarlığı hukukuna ilişkin özellikle miras, mal ortaklığı ve şirket tasfiyesi uyuşmazlıklarında mümkündür (m.85)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Her uyuşmazlıkta defterlerin tamamı incelenir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Genel kural ilgili kısımdır."], ["Defter incelemesi yapılamaz", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İnceleme yapılır."], ["İnceleme yalnızca davalının katılımıyla yapılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Tarafların katılımıyla yapılır."]]}]},
{"ad": "İş Hukuku", "mah": "Çankırı İş Mahkemesi", "es": "2026/1806 E.", "ozet": "Ücret ödenmemesi: iş görmekten kaçınma", "bil": "İşveren üç aydır ücreti ödemedi. İşçi bir ay sonra işe gelmedi, işveren bu nedenle işçiyi çıkardı.", "s": [{"l": [["İşçi vekili", "Ücret ödenmedi, haklı nedenle ayrıldık."], ["İşveren vekili", "İşçi izinsiz çalışmadı."]], "q": "İşçinin hakkı?", "o": [["Ücret kanun veya sözleşme şartlarına uygun ödenmezse işçi iş sözleşmesini haklı nedenle derhal feshedebilir (İşK m.24/II-e)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Ücret ödenmemesi haklı fesih sebebi değildir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "m.24/II-e haklı sebeptir."], ["Yalnızca işveren fesheder", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İşçinin de hakkıdır."], ["Önce yargı kararı gerekir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Karar gerekmez."]]}, {"l": [["İşçi vekili", "İşe gelmedik, çünkü ücret ödenmedi."]], "q": "İş görmekten kaçınma?", "o": [["Ücreti ödeme gününden itibaren 20 gün içinde mücbir neden dışında ödenmeyen işçi iş görme borcunu yerine getirmekten kaçınabilir; bu nedenle iş akdi feshedilemez (m.34)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Kaçınma hakkı yoktur", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "m.34 hak tanır."], ["Süre 60 gündür", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "20 gündür."], ["Kaçınma grev sayılır", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Grev sayılmaz."]]}]},
{"ad": "İş Hukuku", "mah": "Kırıkkale İş Mahkemesi", "es": "2026/1807 E.", "ozet": "Doğum izni (İşK m.74)", "bil": "Kadın işçi doğum öncesi 8 hafta izinli olması gerekirken doktor onayıyla 2 hafta önceye kadar çalışmak istiyor. İşveren, doğum sonrası izni kısaltmak istiyor.", "s": [{"l": [["İşçi vekili", "İzin süresi nedir?"]], "q": "Doğum izni süresi?", "o": [["Doğumdan önce sekiz, doğumdan sonra on altı hafta, toplam yirmi dört hafta çalıştırılmama esastır; çoğul gebelikte doğum öncesi sekiz haftaya iki hafta eklenir (İşK m.74)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["Toplam 12 hafta", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre 24 haftadır."], ["Doğumdan önce 4, sonra 12 hafta", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Süre 8+16 haftadır."], ["İzin süresi işverence belirlenir", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Kanunda belirlenmiştir."]]}, {"l": [["İşçi vekili", "Doktor onayıyla 2 hafta öncesine kadar çalışabilir miyiz?"]], "q": "Çalışma talebi?", "o": [["Sağlık durumu uygunsa doktor onayıyla kadın işçi isterse doğumdan önceki iki haftaya kadar çalışabilir; çalıştığı süreler doğum sonrası sürelere eklenir (m.74)", ["Katip", "Karar tutanağa geçti."], 1, "Doğru."], ["İşveren zorunlu kılar", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "İşçi isterse."], ["Doktor onayı gerekmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Doktor onayı şart."], ["Çalıştığı süre eklenmez", ["Karşı taraf vekili", "İtiraz ediyoruz."], 0, "Doğum sonrasına eklenir."]]}]},

Object.assign(ON,{"2026/1701 E.": "• 01.03.2026: Ev satılır.\n• 01.05.2026: Zor durum sona erer.\n• 20.09.2026: Dava açılır.", "2026/1702 E.": "• Düğün için dekor siparişi verilir.\n• 05.09.2026: Düğün yapılır, dekor teslim edilmez.\n• Alıcı sözleşmeden dönme ister.", "2026/1703 E.": "• Kira 3 yıl için yapılır.\n• 31.05.2026: Süre biter.\n• 10.07.2026: Dava açılır.", "2026/1704 E.": "• 15.05.2026: Genel kurul kararı alınır.\n• 18.09.2026: İptal davası açılır.", "2026/1705 E.": "• İki tacir teslim sözleşmesi yapar.\n• Teslim gecikir.\n• Alacaklı e-postayla ihtar eder.", "2026/1706 E.": "• İşyerinde 150 işçi çalışır.\n• Bir ay içinde 18 işçi çıkarılır.\n• Bildirim yapılmaz.", "2026/1707 E.": "• İşveren iş sözleşmesini 8 hafta bildirimle feshetir.\n• Bildirim süresinde iş arama izni verilmez.", "2026/1708 E.": "• Dava açılır, dilekçe idareye tebliğ edilir.\n• 30 gün geçer, savunma gelmez.\n• 40. günde ek süre istenir.", "2026/1709 E.": "• Davacı yürütmenin durdurulmasını ister.\n• Dayanak kanun AYM’de.\n• Aynı sebeple önceki talep reddedilmiştir.", "2026/1710 E.": "• Dava açılır, duruşma talep edilir.\n• Duruşma günü belirlenir."});
Object.assign(G,{"2026/1701 E.": {"k": [["m.28 koşulları", "28|oransız|yararlan"], ["1 yıl / 5 yıl", "1 yıl|bir yıl|5 yıl|beş yıl"], ["İki seçenek", "iade|oransızlık"]], "m": "Açık oransızlık ve zor durumdan yararlanma bulunduğundan TBK m.28 şartları oluşmuştur. Hak, zor durumun bitiminden itibaren 1 yıl içinde kullanıldığından dava süresindedir; zarar gören edimin iadesini ya da oransızlığın giderilmesini isteyebilir."}, "2026/1702 E.": {"k": [["m.124/3", "124"], ["m.125 seçimlik haklar", "125|dönme|tazminat"], ["Süre verilmez", "süre"]], "m": "İfanın belirli zamanda yapılmaması hâlinde artık kabul edilmeyeceği sözleşmeden anlaşıldığından süre verilmesi gerekmez (TBK m.124/3). Alıcı m.125 uyarınca ifa ve gecikme tazminatını, olumlu zararı ya da sözleşmeden dönmeyi seçebilir."}, "2026/1703 E.": {"k": [["m.347 uzama", "347|uzar|bir yıl|1 yıl"], ["m.350 ihtiyaç", "350|ihtiyaç|gereksinim"], ["1 ay süre", "1 ay|bir ay|süre"]], "m": "Konut kirasında sürenin bitimi tahliye sebebi değildir; sözleşme 1 yıl uzar (TBK m.347). İhtiyaç davası sürenin sonundan başlayarak 1 ay içinde açılmalıdır (m.350); 10.07.2026’da açılan dava süreden reddedilmiştir."}, "2026/1704 E.": {"k": [["m.445: 3 ay", "445|3 ay|üç ay"], ["m.447 batıl", "447|batıl"], ["Katılma hakkı", "katılma"]], "m": "İptal davası 3 aylık süreyle sınırlıdır (TTK m.445). Katılma hakkını ortadan kaldıran karar ise m.447/1-a uyarınca batıldır; süre geçmesi batıllığı engellemez."}, "2026/1705 E.": {"k": [["m.18/3 ihtar şekli", "18|noter|kep|taahhütlü"], ["m.19 karine", "19|karine|ticari"], ["Adi e-posta yetmez", "e-posta|yeterli değil"]], "m": "Tacirler arasında temerrüde düşürme ihtarı noter, taahhütlü mektup, telgraf ya da güvenli elektronik imzalı KEP ile yapılmalıdır (TTK m.18/3). Tacirin borçlarının ticari olması asıldır (m.19)."}, "2026/1706 E.": {"k": [["m.29 oranı", "29|%10|yüzde on|15"], ["30 gün bildirim", "30 gün|otuz gün"], ["Bölge müdürlüğü/İŞKUR", "bölge|iş kurum|işkur"]], "m": "101-300 işçi çalıştıran işyerinde bir ay içinde en az %10 işçinin çıkarılması toplu işçi çıkarmadır (İşK m.29). Bildirim en az 30 gün önceden yazıyla sendika temsilcilerine, bölge müdürlüğüne ve İŞKUR’a yapılmalıdır."}, "2026/1707 E.": {"k": [["m.27 izin", "27|iş arama"], ["Günde 2 saat", "2 saat|iki saat"], ["Ücret ve %100 zam", "ücret|%100|yüzde yüz"]], "m": "İşveren bildirim süresi boyunca günde en az iki saat iş arama izni vermek zorundadır (İşK m.27). Verilmeyen süre için ücret ödenir; çalıştırıldıysa %100 zamlı ödenir."}, "2026/1708 E.": {"k": [["m.16/3", "16|30|uzat"], ["Geç savunma", "geç|süre geçtikten"], ["m.20 inceleme", "20|kendiliğinden|resen"]], "m": "Savunma süresi 30 gündür; süre geçtikten sonra uzatma kabul edilmez (İYUK m.16/3). Geç verilen savunmaya dayanılarak hak iddia edilemez (m.16/4) fakat mahkeme dosyayı kendiliğinden inceler (m.20)."}, "2026/1709 E.": {"k": [["m.27/2 AYM", "27/2|anayasa"], ["m.27/10 ikinci talep", "27/10|ikinci"], ["Ret", "ret|reddedil"]], "m": "Dayanak hükmün iptali için AYM’ye başvurulmuş olması tek başına yürütmeyi durdurma gerekçesi değildir (İYUK m.27/2). Aynı sebeplerle ikinci kez yürütmenin durdurulması istenemez (m.27/10)."}, "2026/1710 E.": {"k": [["Talep (m.17)", "17|talep|istek"], ["30 gün davetiye", "30 gün|otuz gün"], ["15 gün karar (m.19)", "19|15 gün|onbeş"]], "m": "İptal davasında taraf isteği üzerine duruşma yapılır (İYUK m.17). Davetiyeler en az 30 gün önce gönderilir; duruşmadan sonra en geç 15 gün içinde karar verilir (m.19)."}});
Object.assign(ON,{"2026/1801 E.": "• Kiracı üç ay kira ödemez.\n• Kiraya veren 10 gün süreli ihtar gönderir.\n• Fesih bildirimi yapılır ve tahliye davası açılır.", "2026/1802 E.": "• Sözleşmede yüzde 60 artış şartı vardır.\n• Kiracı artışlı kirayı öder.\n• Fazla ödemeyi geri ister.", "2026/1803 E.": "• 2015: Satış bedeli muaccel olur.\n• 2019: Borçlu kısmi ödeme yapar.\n• 2026: Dava açılır.", "2026/1804 E.": "• 01.2022: Tadilat teslim ve kabul edilir.\n• 2026: Gizli ayıp ortaya çıkar, ihbar yapılır.\n• Dava açılır.", "2026/1805 E.": "• Ortak payını devretmek ister.\n• Adi yazılı devir yapılır.\n• Genel kurul onay vermez.", "2026/1811 E.": "• Taraflar arasında fatura uyuşmazlığı çıkar.\n• Dava açılır.\n• Defter ibrazı tartışılır.", "2026/1806 E.": "• İşveren üç aydır ücret ödemez.\n• İşçi işe gelmeyi bırakır.\n• İşveren işçiyi çıkarır.", "2026/1807 E.": "• Kadın işçi hamiledir.\n• Doğum tarihi yaklaşır.\n• İzin süresi ve çalışma talebi tartışılır.", "2026/1808 E.": "• Davacı adli yargıda dava açar.\n• 02.09.2026: Görevsizlik kesinleşir.\n• Davacı ayrıca üst makama başvurur.", "2026/1809 E.": "• Dava devam eder.\n• Delil tespiti istenir.\n• İdare hakimi reddeder.", "2026/1810 E.": "• İdare mahkemesi kesin karar verir.\n• Karar kesinleşir.\n• Bakanlık kanun yararına temyiz ister."});
Object.assign(G,{"2026/1801 E.": {"k": [["30 gün (m.315)", "315|30|otuz"], ["Süre başlangıcı", "izleyen gün|ertesi|tarih"], ["Fesih geçersiz", "geçersiz|reddedil|ret"]], "m": "Konut kirasında ihtarda süre en az 30 gündür (TBK m.315). 10 günlük süreyle yapılan fesih geçersizdir; süre bildirimi izleyen günden işler."}, "2026/1802 E.": {"k": [["TÜFE sınırı (m.344)", "344|tüfe|tüketici"], ["Fazlası geçersiz", "geçersiz|fazla"], ["İade", "iade|geri"]], "m": "Kira artışı TÜFE oniki aylık ortalamalara göre değişim oranını geçemez (TBK m.344). Fazlası geçersizdir ve iade edilir."}, "2026/1803 E.": {"k": [["m.154 kesilme", "154|kesil|kısmi"], ["m.146 10 yıl", "146|10 yıl|on yıl"], ["Yeni süre (m.156)", "156|yeni süre|yeni"]], "m": "Kısmi ifa zamanaşımını keser (TBK m.154/1) ve yeni süre işlemeye başlar (m.156). Genel süre 10 yıl olduğundan (m.146) dava süresindedir."}, "2026/1804 E.": {"k": [["m.477 kabul", "477|kabul"], ["m.478 5 yıl", "478|5 yıl|beş yıl"], ["İhbar", "ihbar|bildir"]], "m": "Kabulden sonra yüklenici sorumluluktan kurtulur; kasten gizlenen ayıplar ve gözden geçirmede fark edilemeyen ayıplar bakımından sorumluluk sürer (TBK m.477). Taşınmaz yapılarda zamanaşımı 5 yıldır (m.478)."}, "2026/1805 E.": {"k": [["m.595/1 şekil", "595|noter|yazılı"], ["Genel kurul onayı", "genel kurul|onay"], ["3 ay", "3 ay|üç ay"]], "m": "Limited şirkette pay devri yazılı yapılır ve imzalar noterce onanır; ayrıca aksi öngörülmemişse genel kurul onayı şarttır (TTK m.595)."}, "2026/1811 E.": {"k": [["m.83 ibraz", "83|ibraz"], ["İlgili kısım (m.84)", "84|ilgili"], ["m.85 istisna", "85|miras|tasfiye"]], "m": "Mahkeme, ticari uyuşmazlıklarda defterlerin ibrazına resen veya istem üzerine karar verebilir (TTK m.83). Defterlerin uyuşmazlıkla ilgili kısımları incelenir (m.84); tamamının incelenmesi m.85’teki uyuşmazlıklara özgüdür."}, "2026/1806 E.": {"k": [["m.24/II-e", "24|haklı|ücret"], ["m.34 20 gün", "34|20 gün|yirmi"], ["Fesih geçersiz", "fesih|geçersiz|çıkar"]], "m": "Ücretin ödenmemes
