<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etkinlik Katılımı · Eko-Log</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f1936;--mut:#56617f;--line:#dde3f0;--acc:#1f4fd8;--ok:#117a45;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#161e34;--ink:#eef2ff;--mut:#9aa6c8;--line:#27324f;--acc:#6f95ff;--ok:#4ad08a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px}
.brand{display:block;text-align:center;color:var(--mut);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
h1{font-size:20px;margin:0 0 4px}
.ev{margin:0 0 18px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.ev small{display:block;color:var(--mut);font-size:12px}
.ev b{font-size:17px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
button,.btn{display:block;width:100%;margin-top:18px;font:inherit;font-weight:700;text-align:center;text-decoration:none;color:#fff;background:var(--acc);border:0;border-radius:12px;padding:13px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.msg{margin:12px 0 0;font-size:14px;min-height:1.2em}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.mut{color:var(--mut)}
</style>
</head>
<body>
<main>
  <div class="brand">Eko-Log · Ekonomi ve Diyalog Topluluğu</div>
  <div class="card" id="card"><p class="mut">Yükleniyor…</p></div>
</main>
<script>
/* Veritabanı adresi: yönetim panelindeki Ayarlar’da kullanılanla aynı olmalı */
const DB='https://eko-log-b902a-default-rtdb.europe-west1.firebasedatabase.app';
const card=document.getElementById('card');
const kod=(new URLSearchParams(location.search).get('k')||'').trim().toUpperCase();
const el=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{})x==='text'?e.textContent=a[x]:e.setAttribute(x,a[x]);k.forEach(c=>c&&e.append(c));return e};
const fmt=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}):''};
const show=(...k)=>card.replaceChildren(...k);
const done=(t)=>show(el('h1',{text:'Teşekkürler'}),el('p',{class:'ok',text:t}),el('p',{class:'mut',text:'Bu sayfayı kapatabilirsin.'}));
function survey(ev){
  const key='anket_'+ev.id;
  try{if(localStorage.getItem(key)){show(el('h1',{text:'Teşekkürler'}),el('p',{class:'ok',text:'Anketin zaten kaydedildi.'}));return}}catch(e){}
  let s=0;
  const msg=el('p',{class:'msg'});
  const row=el('div',{style:'display:flex;gap:8px'});
  const bs=[1,2,3,4,5].map(n=>{const b=el('button',{type:'button',text:String(n),style:'margin:0;flex:1;color:var(--ink);background:var(--bg);border:1px solid var(--line)'});
    b.addEventListener('click',()=>{s=n;msg.textContent='';bs.forEach((x,i)=>{x.style.background=i<n?'var(--acc)':'var(--bg)';x.style.color=i<n?'#fff':'var(--ink)'})});return b});
  bs.forEach(b=>row.append(b));
  const c=el('textarea',{maxlength:'500',rows:'4',placeholder:'İstersen kısa bir yorum yaz'});
  const btn=el('button',{type:'button',text:'Anketi gönder'});
  btn.addEventListener('click',async()=>{
    if(!s){msg.className='msg bad';msg.textContent='Lütfen 1 ile 5 arasında bir puan seç.';return}
    btn.disabled=true;msg.className='msg mut';msg.textContent='Gönderiliyor…';
    const u=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(36).padStart(2,'0')).join('').slice(0,12);
    const body={s,t:Date.now()};const cv=c.value.trim();if(cv)body.c=cv.slice(0,500);
    try{
      const r=await fetch(DB+'/ekx2/fb/'+encodeURIComponent(ev.id)+'/'+u+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw 0;
      try{localStorage.setItem(key,'1')}catch(e){}
      show(el('h1',{text:'Teşekkürler'}),el('p',{class:'ok',text:'Anketin kaydedildi.'}),el('p',{class:'mut',text:'Bu sayfayı kapatabilirsin.'}));
    }catch(e){btn.disabled=false;msg.className='msg bad';msg.textContent='Gönderilemedi. Bağlantını kontrol edip tekrar dene.'}
  });
  show(el('h1',{text:'Etkinlik anketi'}),
    el('div',{class:'ev'},el('small',{text:'Katıldığın etkinlik'}),el('b',{text:ev.kat||ev.ad||'Etkinlik'})),
    el('label',{text:'Etkinliği nasıl buldun? (1 = hiç, 5 = çok iyi)'}),row,
    el('label',{text:'Yorumun (isteğe bağlı)'}),c,btn,msg);
}
async function init(){
  if(!/^[A-Z0-9]{3,10}$/.test(kod)){show(el('h1',{text:'Bağlantı geçersiz'}),el('p',{class:'mut',text:'Lütfen etkinlikteki QR kodu yeniden okut.'}));return}
  let ev=null;
  try{
    const r=await fetch(DB+'/ekx2/events.json');if(!r.ok)throw 0;
    const o=await r.json()||{};
    for(const id in o){if(String(o[id].kod||'').toUpperCase()===kod){ev=Object.assign({id},o[id]);break}}
  }catch(e){show(el('h1',{text:'Bağlanılamadı'}),el('p',{class:'mut',text:'İnternetini kontrol edip sayfayı yenile.'}));return}
  if(!ev||ev.yayin===false){show(el('h1',{text:'Etkinlik açık değil'}),el('p',{class:'mut',text:'Bu etkinlik için katılım henüz açılmadı.'}));return}
  const as=ev.asama||'yoklama';
  if(as==='kapali'){show(el('h1',{text:'Katılım kapandı'}),el('p',{class:'mut',text:'Bu etkinlik için yoklama ve anket kapandı.'}));return}
  if(as==='anket'){survey(ev);return}
  const key='katilim_'+ev.id;
  try{if(localStorage.getItem(key)){done('Bu etkinlik için katılımın zaten kaydedildi.');return}}catch(e){}
  const ad=el('input',{type:'text',id:'ad',maxlength:'60',autocomplete:'name',placeholder:'Örn. Ayşe Yılmaz',required:''});
  const msg=el('p',{class:'msg'});
  const btn=el('button',{type:'button',text:'Katılımı gönder'});
  const send=async()=>{
    const v=ad.value.replace(/\s+/g,' ').trim();
    if(v.split(' ').length<2||v.length<4){msg.className='msg bad';msg.textContent='Lütfen adını ve soyadını yaz.';return}
    btn.disabled=true;msg.className='msg mut';msg.textContent='Gönderiliyor…';
    const u=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(36).padStart(2,'0')).join('').slice(0,12);
    try{
      const r=await fetch(DB+'/ekx2/att/'+encodeURIComponent(ev.id)+'/'+u+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ad:v,t:Date.now()})});
      if(!r.ok)throw 0;
      try{localStorage.setItem(key,'1')}catch(e){}
      done('Katılımın kaydedildi.');
    }catch(e){btn.disabled=false;msg.className='msg bad';msg.textContent='Gönderilemedi. Bağlantını kontrol edip tekrar dene.'}
  };
  btn.addEventListener('click',send);
  ad.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  const d=fmt(ev.tarih);
  show(el('h1',{text:'Etkinlik katılımı'}),
    el('div',{class:'ev'},el('small',{text:'Katıldığın etkinlik'}),el('b',{text:ev.kat||ev.ad||'Etkinlik'}),d?el('small',{text:d}):null),
    el('label',{for:'ad',text:'Ad Soyad'}),ad,btn,msg);
}
init();
</script>
</body>
</html>
