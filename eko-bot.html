<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eko Asistan · Eko-Log</title>
<meta name="description" content="Eko-Log asistanı: sözlük, laboratuvar, mevzuat, hukuk bankası ve gündem içeriklerinde arama yapar.">
<style>
:root{--g1:#c4202e;--g2:#ff7a45;--bg:#fbf6f7;--surf:#fff;--soft:#f5ecef;--ink:#1d1526;--mut:#6a5f76;--line:#eee3e6}
@media (prefers-color-scheme:dark){:root{--bg:#150f1b;--surf:#1f1727;--soft:#2a2034;--ink:#f3ecf7;--mut:#b0a4bd;--line:#372b43}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:fixed;top:0;left:0;right:0;height:56px;z-index:2;display:flex;align-items:center;gap:16px;padding:0 16px;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2))}
.top a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.top .ad{font-weight:800;font-size:17px;flex:1;white-space:nowrap}
.top a:hover{text-decoration:underline}
/* Bot penceresini sayfaya yay: yüzen balon gizli, pencere hep açık ve ekranı kaplar */
#eb-fab{display:none!important}
#eb{position:fixed!important;display:flex!important;top:56px!important;bottom:0!important;left:0!important;right:0!important;transform:none!important;
 width:100%!important;max-width:none!important;height:auto!important;border-radius:0!important;box-shadow:none!important;border:0!important;z-index:1!important}
#eb header button:last-child{display:none!important}
#eb-log{font-size:16px;padding-left:max(14px,calc((100vw - 960px)/2))!important;padding-right:max(14px,calc((100vw - 960px)/2))!important}
#eb form,#eb small,#eb #eb-mod{padding-left:max(14px,calc((100vw - 960px)/2))!important;padding-right:max(14px,calc((100vw - 960px)/2))!important}

.top .ad{flex:none}.top .sy{flex:1;text-align:right;font-weight:600;font-size:14px;opacity:.9}
.mbtn{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#c4202e;font:800 20px system-ui;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 0 0 2px rgba(255,255,255,.5);-webkit-tap-highlight-color:transparent}
body.dm-lock{overflow:hidden}
.dm{position:fixed;inset:0;z-index:99990;visibility:hidden;pointer-events:none;transition:visibility 0s linear .38s}
.dm.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.dm-ov{position:absolute;inset:0;background:rgba(10,5,18,.58);opacity:0;transition:opacity .3s}
.dm.open .dm-ov{opacity:1}
.dm-panel{position:absolute;top:0;right:0;bottom:0;width:min(86vw,440px);display:flex;flex-direction:column;background:#1c1328;color:#f6f0fb;box-shadow:-24px 0 60px -20px rgba(0,0,0,.65);transform:translateX(100%);transition:transform .38s cubic-bezier(.22,1,.36,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dm.open .dm-panel{transform:none}
.dm-top{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 22px;border-bottom:1px solid rgba(255,255,255,.2)}
.dm-top b{flex:1;font:800 22px/1 system-ui,sans-serif;background:linear-gradient(120deg,#ff6470 10%,#ff8f5a 65%,#ffc371);-webkit-background-clip:text;background-clip:text;color:transparent}
.dm-x{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.09);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.dm-x svg{width:22px;height:22px}
.dm-list{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto;overscroll-behavior:contain}
.dm-list li{margin:0;border-bottom:1px solid rgba(255,255,255,.2)}
.dm-list a{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:12px 22px;color:#f6f0fb;text-decoration:none;font:500 20px/1.25 system-ui,sans-serif}
.dm-list a:active{background:rgba(255,255,255,.13)}
.dm-list a.on{font-weight:700;background:rgba(255,255,255,.06)}
.dm-list a.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#ff6470,#ff8f5a)}
.dm-list svg{width:20px;height:20px;flex:none;opacity:.7}
.dm-row{display:flex;align-items:center}.dm-row>a{flex:1 1 auto;min-width:0}
.dm-list .dm-tg{flex:none;width:40px;height:40px;margin:0 16px 0 4px;padding:0;display:grid;place-items:center;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.dm-list .dm-tg svg{opacity:1;transition:transform .3s}
.dm-item.open>.dm-row .dm-tg{background:linear-gradient(135deg,#ff6470,#ff8f5a);border-color:transparent}
.dm-item.open>.dm-row .dm-tg svg{transform:rotate(180deg)}
.dm-sub-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.dm-item.open>.dm-sub-wrap{grid-template-rows:1fr}
.dm-list .dm-sub{list-style:none;margin:0;padding:0;min-height:0;overflow:hidden;visibility:hidden;background:rgba(255,255,255,.035);transition:visibility 0s linear .3s}
.dm-item.open>.dm-sub-wrap>.dm-sub{visibility:visible;transition-delay:0s}
.dm-list .dm-sub li{border:0}
.dm-list .dm-sub a{min-height:48px;padding:10px 22px 10px 50px;font-size:17px;font-weight:400}
@media (prefers-reduced-motion:reduce){.dm,.dm-ov,.dm-panel,.dm-sub-wrap{transition:none}}
</style>
</head>
<body>
<div class="top">
 <button type="button" class="mbtn" id="mbtn" aria-label="Menüyü aç" aria-haspopup="dialog" aria-expanded="false" aria-controls="dmenu"><span>E</span></button>
 <a class="ad" href="index.html">Eko-Log</a>
 <span class="sy">Eko Asistan</span>
</div>
<noscript><p style="padding:90px 16px">Eko Asistan'ı kullanmak için JavaScript gerekir.</p></noscript>
<script>
(function(){
var D=document,btn=D.getElementById('mbtn'),isOpen=false,n=0;
var CH='<svg viewBox="0 0 24 24"><path d="M9 4.5l7.5 7.5L9 19.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var DN='<svg viewBox="0 0 24 24"><path d="M5.5 9l6.5 6.5L18.5 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var XI='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
/* [ad, adres, alt sayfa dosyası, alt sayfalar] — adresler index.html ile aynı klasöre göre */
var M=[
['Ana Sayfa','index.html'],
['Simülasyon Merkezi','simulasyon-merkezi.html','simulasyon-merkezi.html',[['vaka','Vaka Analizi'],['ppk','Başkan Simülasyonu'],['borsa','Borsa Simülasyonu'],['bakan','Bakanlık Simülasyonu'],['girisim','Girişimci'],['kur','Dış Ticaret'],['burokrat','Kamu Bürokratı'],['muzakere','Müzakere Masası'],['ihale','Kamu İhalesi'],['hakimlik','Hâkimlik Simülasyonu'],['valilik','Kaymakamlık ve Valilik'],['smmm','Mali Müşavirlik']]],
['Meslekler','index.html#/meslekler','index.html',[['meslek','Kariyer Meslek Tanıtımı'],['kadrolar','Kariyer Kadroları'],['mulakat','Mülakat Prova Modu'],['mulakat-bilgi','Kurum Mülakatı Bilgilendirme'],['mulakat-basvuru','Mülakat Simülasyonu Başvuruları'],['quiz','Terim Quiz'],['yol','Kariyer Testi']]],
['İktisadi Ansiklopedi','ansiklopedi.html#/ansiklopedi','ansiklopedi.html',[['sozluk','Ekonomi Sözlüğü'],['anatomi','Kavramın Anatomisi'],['efsane','İktisadi Şehir Efsaneleri'],['kisiler','İktisat Düşünürleri'],['tarih','Ekonomi Tarihi Çizelgesi'],['sektor','Sektör Dosyaları']]],
['Veri ve Pariteler','index.html#/piyasa','index.html',[['pariteler','Pariteler'],['veri','İktisat Grafikleri'],['hesap','Hesaplayıcılar'],['kaynak','Kaynaklar'],['ulke','Ülke Karşılaştırma'],['turkiye','Türkiye Ekonomisi Dosyaları'],['urun','Bir Ürünün Hikâyesi'],['iktisatci','İktisatçı Gözünden']]],
['Kalkınma','kalkinma/'],
['Gazete ve Dergi','index.html#/yayin','index.html',[['gazete','Diyalog Gazetesi'],['dergi','İktisadi Kalkınma Dergisi'],['makale','Makale Yazımı'],['ceviri','Çeviri Köşesi'],['arastirma','Ortak Araştırma Projeleri'],['arsiv','Arşiv']]],
['Topluluk','index.html#/etkinlik','index.html',[['paylas','Paylaşım Kartı'],['fikir','Fikir Muharebesi'],['yatay','Yatay Bakış'],['konferanslar','Konferanslar'],['arastirma','Ortak Araştırma Projeleri']]],
['Katıl','index.html#/katil'],
['Gündem','gundem.html'],
['Eko Bot','eko-bot.html']
];
function mk(t,c){var e=D.createElement(t);if(c)e.className=c;return e}
var root=mk('div','dm');root.id='dmenu';
root.innerHTML='<div class="dm-ov"></div><div class="dm-panel" role="dialog" aria-modal="true" aria-label="Ana menü"><div class="dm-top"><b>Eko-Log</b><button type="button" class="dm-x" aria-label="Menüyü kapat">'+XI+'</button></div><ul class="dm-list"></ul></div>';
D.body.appendChild(root);
var list=root.querySelector('.dm-list');
M.forEach(function(m){
  var li=mk('li','dm-item'),row=mk('div','dm-row'),a=mk('a'),s=mk('span'),kids=m[3];
  a.href=m[1];s.textContent=m[0];a.appendChild(s);
  if(m[0]==='Eko Bot'){a.className='on';a.setAttribute('aria-current','page')}
  if(!kids)a.insertAdjacentHTML('beforeend',CH);
  row.appendChild(a);li.appendChild(row);
  if(kids){
    var id='dms'+(++n),tg=mk('button','dm-tg'),w=mk('div','dm-sub-wrap'),ul=mk('ul','dm-sub');
    tg.type='button';tg.innerHTML=DN;tg.setAttribute('aria-expanded','false');tg.setAttribute('aria-label',m[0]+' alt sayfalarını aç');ul.id=id;tg.setAttribute('aria-controls',id);
    kids.forEach(function(k){var l=mk('li'),b=mk('a');b.href=m[2]+'#/'+k[0];b.textContent=k[1];l.appendChild(b);ul.appendChild(l)});
    w.appendChild(ul);li.appendChild(w);row.appendChild(tg);
    tg.onclick=function(){var o=!li.classList.contains('open');
      [].forEach.call(list.querySelectorAll('.dm-item.open'),function(x){x.classList.remove('open');x.querySelector('.dm-tg').setAttribute('aria-expanded','false')});
      li.classList.toggle('open',o);tg.setAttribute('aria-expanded',o?'true':'false')};
  }
  list.appendChild(li);
});
function openM(){isOpen=true;root.classList.add('open');D.body.classList.add('dm-lock');btn.setAttribute('aria-expanded','true')}
function closeM(){isOpen=false;root.classList.remove('open');D.body.classList.remove('dm-lock');btn.setAttribute('aria-expanded','false')}
btn.onclick=function(){isOpen?closeM():openM()};
root.querySelector('.dm-ov').onclick=closeM;root.querySelector('.dm-x').onclick=closeM;
root.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.dm-list a'))closeM()});
D.addEventListener('keydown',function(e){if(isOpen&&e.key==='Escape')closeM()});
var sx=0,sy=0,p=root.querySelector('.dm-panel');
p.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
p.addEventListener('touchend',function(e){var t=e.changedTouches[0];if(t.clientX-sx>70&&Math.abs(t.clientY-sy)<50)closeM()},{passive:true});
})();
</script>
<script src="eko-bot.js" defer></script>
<script>
/* Bot betiği yüklendikten sonra pencereyi bir kez aç (karşılama mesajı ve öneri düğmeleri gelsin) */
addEventListener('load',function(){
  var b=document.getElementById('eb'),f=document.getElementById('eb-fab');
  if(b&&f&&!b.classList.contains('on'))f.click();
  var i=b&&b.querySelector('input');if(i&&matchMedia('(min-width:700px)').matches)i.focus();
});
</script>
</body>
</html>
