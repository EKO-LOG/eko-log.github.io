name: Parite verisini güncelle
on:
  schedule:
    # Her gün 23:00 UTC (02:00 TSİ): ABD vadeli işlem günlük mumları kapandıktan sonra.
    # Kripto hafta sonu da işlem gördüğü için hafta içi/sonu ayrımı yok.
    - cron: "0 23 * * *"
  workflow_dispatch:           # Actions sekmesinden elle de çalıştırılabilir
permissions:
  contents: write
concurrency:
  group: parite-guncelle       # Aynı anda iki çalışma birbirinin push'unu bozmasın
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Veriyi üret
        env:
          PYTHONUTF8: "1"
          # TCMB EVDS anahtarı: index.html'deki gram/çeyrek/yarım altın için GRAMTL serisi.
          # Yoksa site bu üçünü ons fiyatı x USD/TRY'den hesaplar.
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
        run: |
          mkdir -p data
          python scripts/parite_guncelle.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "parite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parite-veri.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Parite verisi güncellendi"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep 5
          done
          exit 1
