name: Veri ve parite güncelle
on:
  schedule:
    - cron: "0 6 * * *"    # 09:00 TSİ
    - cron: "0 16 * * *"   # 19:00 TSİ
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veri-guncelle
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tarayıcı taklidi (Yahoo için)
        run: pip install curl_cffi || echo "::warning::curl_cffi kurulamadı"
      - name: Parite verisini üret (data/parite-veri.json)
        env:
          PYTHONUTF8: "1"
          EIA_KEY: ${{ secrets.EIA_KEY }}
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
        run: python scripts/parite_guncelle.py
      - name: TCMB verisini üret (veri.json)
        if: always()
        env:
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
        run: node scripts/veri-guncelle.mjs
      - name: Değişiklik varsa kaydet
        if: always()
        run: |
          git config user.name "veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/parite-veri.json veri.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Veri ve parite güncellendi"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep 5
          done
          exit 1
