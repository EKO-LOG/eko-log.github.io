name: Veri güncelle
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node veri-guncelle.mjs
        env:
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
      - name: Değiştiyse kaydet
        run: |
          git config user.name "veri-bot"
          git config user.email "veri-bot@users.noreply.github.com"
          git add veri.json
          if ! git diff --cached --quiet; then
            git commit -m "Veri güncellendi"
            git push
          fi
