name: Süper Lig verisi

on:
  schedule:
    - cron: '*/5 7-21 * * *'   # UTC 07–21 = TSİ 10:00–00:59, 5 dakikada bir (GitHub gecikebilir)
  workflow_dispatch:           # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: superlig
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Veriyi çek (yalnızca devre arası ve maç sonu kaydedilir)
        run: node scripts/superlig.mjs
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superlig.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Süper Lig verisi güncellendi"
          git pull --rebase
          git push
