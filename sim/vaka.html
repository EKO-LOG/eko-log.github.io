<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaka Analizi · Eko-Log</title>
<style>
:root{--bg:#0b1020;--surface:#141b34;--ink:#f1f5f9;--muted:#94a3b8;--line:#26304f;--accent:#ff7a6e;--loss:#fb7185;--chip:#0f1630;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.bva{max-width:820px;margin:0 auto;padding:28px 16px 56px}
.bva h1{font:700 1.9rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 6px}
.bva .lead{color:var(--muted);margin:0 0 20px}
.bva-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.bva-filters button{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer}
.bva-filters button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.bva-filters button:focus-visible,.bva summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bva-case{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.bva summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.bva summary::-webkit-details-marker{display:none}
.bva summary h2{font:700 1.2rem/1.3 Georgia,serif;margin:0}
.bva summary .yr{font-weight:600;color:var(--accent)}
.bva summary .sub{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.bva-case[open] summary{border-bottom:1px solid var(--line)}
.bva-body{padding:16px 18px 20px}
.bva-body h3{font-size:.95rem;margin:20px 0 6px;color:var(--accent)}
.bva-body p{margin:0 0 8px}
.bva-fig{display:flex;gap:10px;align-items:baseline;padding:10px 12px;margin:12px 0;border-left:4px solid var(--loss);background:var(--chip);border-radius:0 6px 6px 0}
.bva-fig b{font-size:1.15rem;color:var(--loss)}
.bva-tl{margin:0;padding:0;list-style:none;border-left:2px solid var(--line)}
.bva-tl li{padding:0 0 10px 14px;position:relative}
.bva-tl li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.bva-tl b{display:block;font-size:.85rem}
.bva-body ul.pl{margin:0;padding-left:20px}
.bva-q{margin-top:20px;padding:12px 14px;border:1px dashed var(--accent);border-radius:6px}
.bva-q b{color:var(--accent)}
@media (max-width:480px){.bva h1{font-size:1.5rem}.bva summary{grid-template-columns:1fr}}
.bva-sim{margin-top:20px;padding:14px;border:2px solid var(--accent);border-radius:8px}
.bva-sim h3{margin-top:0}
.bva-sim button{display:block;width:100%;text-align:left;font:inherit;font-size:.92rem;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer}
.bva-sim button:hover{border-color:var(--accent)}
.bva-sim button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bva-sim .v{font-weight:700}
.bva-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bva-cmp>div{padding:10px 12px;border-radius:6px;background:var(--chip)}
.bva-cmp .real{border-left:4px solid var(--loss)}
.bva-cmp .you{border-left:4px solid var(--accent)}
.bva-cmp p{margin:4px 0 0;font-size:.9rem}
.bva-note{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.bva-cmp{grid-template-columns:1fr}}
.bva-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.bva-chips span{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--chip)}
.bva-act{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:.9rem}
.bva-act:has(input:checked){border-color:var(--accent);background:var(--chip)}
.bva-act input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.bva-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.bva-row i{font-style:normal;font-size:.78rem;padding:2px 8px;border-radius:999px;margin-left:4px;color:#fff}
.bva-row i.you{background:var(--accent)}
.bva-row i.real{background:var(--loss)}

.bva-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none}
.bva-card:hover{border-color:var(--accent)}
.bva-card:focus-visible,.bva-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bva-card b{font:700 1.1rem/1.3 Georgia,serif;display:block}
.bva-card small{color:var(--muted)}
.bva-card .yr{font-weight:600;color:var(--accent);white-space:nowrap}
.bva-card .ok{color:var(--accent);font-size:.8rem;display:block;text-align:right}
.bva-back{display:inline-block;margin-bottom:14px;color:var(--accent);text-decoration:none;font-size:.9rem}
.bva-view-sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:12px}
.bva-big{font:700 2rem/1.1 Georgia,serif}
.bva-cmp .you .bva-big{color:var(--accent)}.bva-cmp .real .bva-big{color:var(--loss)}
.bva-m{margin:10px 0 2px;font-size:.88rem;font-weight:600}
.bva-bar{position:relative;height:16px;background:var(--chip);border-radius:4px;margin-bottom:4px;overflow:hidden}
.bva-bar i{position:absolute;left:0;top:0;bottom:0}
.bva-bar i.you{background:var(--accent)}.bva-bar i.real{background:var(--loss)}
.bva-bar em{position:absolute;right:6px;top:0;font-size:.72rem;font-style:normal;line-height:16px}
.bva-sim .bva-sec-btn{width:auto;display:inline-block;margin-right:8px}
.bva-view-sec details summary{display:block;padding:6px 0;font-weight:600;color:var(--accent)}
.bva-sim textarea{display:block;width:100%;font:inherit;font-size:.95rem;line-height:1.5;padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);resize:vertical}
.bva-sim textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bva-sim button[data-ok]{display:inline-block;width:auto;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:10px 20px}
.bva-sim button[data-ok]:disabled{opacity:.4;cursor:not-allowed}
.bva-sim button[data-ok]:disabled{opacity:.4;cursor:not-allowed}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(217,52,43,.35),transparent),var(--bg)}
.bva-filters button[aria-pressed=true],.bva-sim button[data-ok],.bva-sim .bva-sec-btn{background:#d9342b;border-color:#d9342b;color:#fff}
.bva-sim .bva-sec-btn{width:auto}
.bva-card,.bva-case,.bva-view-sec,.bva-sim{border-radius:18px}
.bva-bar i.you{background:#d9342b}
</style>
</head>

"turkiye-2001":[[-25,-15,5,-20],[5,5,-5,10],[15,20,-30,15],[20,15,-15,20],[15,10,-5,10]],
"svb":[[-35,-25,10,25],[25,20,-20,-20],[15,15,-5,-5],[5,10,-5,15],[10,10,-25,-25]],
"turkiye-1994":[[-25,-15,5,-10],[5,5,-5,10],[15,15,-15,5],[10,10,10,15],[-20,-5,5,-5]],
"anglo-irish":[[-30,-20,10,15],[20,20,-30,-20],[0,5,-5,5],[10,15,-20,10],[5,5,5,5]],
"kibris-2013":[[-35,-25,5,-15],[10,15,-10,10],[5,10,10,20],[5,5,0,-10],[5,5,5,0]],
"arjantin-2001":[[-25,-20,5,5],[-5,10,5,-5],[5,5,-5,10],[-10,10,5,-10],[5,0,5,5]],
"credit-suisse":[[10,10,-30,-25],[10,10,-5,-5],[20,20,-15,0],[-5,5,15,15],[-15,-10,5,-5]]};
const BVA_M=["Piyasa güveni","Hizmet sürekliliği","Kamu kaynağı korunumu","Piyasa disiplini"];
const BVA_T=[["Piyasa güveni ve bulaşma kontrolü güçlü kalırdı.","Güven kısmen korunur, bulaşma riski sürerdi.","Güven kaybı büyür, bulaşma riski artardı."],
["Kritik bankacılık hizmetleri kesintisiz sürerdi.","Hizmetlerde kısmi aksama olurdu.","Hizmetler ciddi biçimde kesintiye uğrardı."],
["Kamu maliyeti düşük kalırdı.","Kamu maliyeti orta düzeyde olurdu.","Kamu kaynaklarına ağır yük binerdi."],
["Ahlaki riski azaltan, caydırıcı bir emsal oluşurdu.","Emsal etkisi karışık olurdu.","Ahlaki risk ve kötü bir emsal doğardı."]];
const BVA_LV=v=>v>=62?0:v>=40?1:2;
const bvaSkor=(id,idx)=>{const m=[50,50,50,50];idx.forEach(i=>BVA_EF[id][i].forEach((x,j)=>m[j]+=x));return m.map(x=>Math.max(0,Math.min(100,x)))};
const bvaAvg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
(function(){
  const list=document.getElementById('bva-list'),fbox=document.getElementById('bva-filters'),view=document.getElementById('bva-view'),home=document.getElementById('bva-home');
  const D=Object.fromEntries(BVA_DATA.map(v=>[v.id,v])),MAX=3;
  let filt="Tümü";
  const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
  function renderList(){
    list.innerHTML=BVA_DATA.filter(v=>filt==="Tümü"||v.tema===filt).map(v=>`<a class="bva-card" href="#${v.id}"><span><b>${v.ad}</b><small>${v.ulke}, ${v.tema}</small></span><span><span class="yr">${v.yil}</span>${BVA_SEC[v.id]?'<span class="ok">Tamamlandı</span>':''}</span></a>`).join('');
  }
  const bars=(a,b)=>BVA_M.map((n,i)=>`<div class="bva-m">${n}</div><div class="bva-bar"><i class="you" style="width:${a[i]}%"></i><em>Siz ${a[i]}</em></div><div class="bva-bar"><i class="real" style="width:${b[i]}%"></i><em>Gerçek ${b[i]}</em></div>`).join('');
  function show(id){
    const v=D[id],k=BVA_KARAR[id];home.hidden=true;view.hidden=false;up();
    const head=`<a class="bva-back" href="#">← Olaylara dön</a><h1>${v.ad}</h1><p class="lead">${v.yil} · ${v.ulke} · ${v.tema}</p>`;
    const draw=()=>{
      const c=BVA_SEC[id],ri=k.a.map((x,i)=>x[3]?i:-1).filter(i=>i>=0);
      const dossier=`<section class="bva-view-sec"><h3 style="margin-top:0">Vaka dosyası</h3><p>${v.ozet}</p><div class="bva-fig"><b>${v.rakam[0]}</b><span>${v.rakam[1]}</span></div><h3>Olayların kronolojisi</h3><ul class="bva-tl">${v.kron.map(x=>`<li><b>${x[0]}</b>${x[1]}</li>`).join('')}</ul><h3>Kök nedenler</h3><ul class="pl">${v.neden.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
      if(!c){
        view.innerHTML=head+dossier+`<section class="bva-sim"><h3>Rolünüz: ${k.rol}</h3><p>${k.d}</p><div class="bva-chips">${k.g.map(x=>`<span><b>${x[0]}:</b> ${x[1]}</span>`).join('')}</div><p><b>Kararınızı verin.</b> Bu durumda ilk ve en önemli adımınız hangisi olurdu? Tek bir seçenek işaretleyin.</p>`+
        k.a.map((a,i)=>`<label class="bva-act"><input type="radio" name="bva-o" value="${i}"><span><b>${a[0]}</b><br>Artısı: ${a[1]}<br>Riski: ${a[2]}</span></label>`).join('')+
        `<button type="button" data-ok="1" disabled>Bitir</button></section>`;
      }else{
        const ch=c[0],a=k.a[ch],ok=!!a[3],you=bvaSkor(id,c),rs=bvaSkor(id,ri),ya=bvaAvg(you),ra=bvaAvg(rs),weak=you.indexOf(Math.min(...you));
        view.innerHTML=head+
        `<section class="bva-view-sec"><h3 style="margin-top:0">Seçiminiz: ${a[0]}</h3><p><i class="${ok?'you':'real'}" style="font-style:normal;color:#fff;padding:2px 8px;border-radius:999px;font-size:.8rem;background:var(${ok?'--accent':'--loss'})">${ok?'Gerçekte de uygulandı':'Gerçekte uygulanmadı'}</i></p><p>Artısı: ${a[1]}<br>Riski: ${a[2]}</p></section>`+
        `<section class="bva-view-sec"><h3 style="margin-top:0">Simülasyon sonucu</h3><div class="bva-cmp"><div class="you"><span>Seçiminiz</span><div class="bva-big">${ya}</div></div><div class="real"><span>Gerçekte uygulanan paket</span><div class="bva-big">${ra}</div></div></div>${BVA_M.map((n,i)=>`<div class="bva-m">${n}</div><div class="bva-bar"><i class="you" style="width:${you[i]}%"></i><em>Siz ${you[i]}</em></div><div class="bva-bar"><i class="real" style="width:${rs[i]}%"></i><em>Gerçek ${rs[i]}</em></div>`).join('')}<p class="bva-note">Skorlar 0-100 arasıdır; tek bir kararın etkisi, gerçekte uygulanan kararların toplam etkisiyle kıyaslanır. Basitleştirilmiş bir modeldir.</p><h3>Seçiminiz gerçekleşseydi</h3><ul class="pl">${you.map((x,i)=>`<li>${BVA_T[i][BVA_LV(x)]}</li>`).join('')}</ul><p>En kırılgan alan: <b>${BVA_M[weak]}</b>.</p></section>`+
        `<section class="bva-view-sec"><h3 style="margin-top:0">Tüm seçenekler</h3>${k.a.map((x,i)=>`<div class="bva-row"><span><b>${x[0]}</b><br><small>Artısı: ${x[1]}. Riski: ${x[2]}.</small></span><span>${i===ch?'<i class="you">Seçiminiz</i>':''}${x[3]?'<i class="real">Gerçekte uygulandı</i>':''}</span></div>`).join('')}</section>`+
        `<section class="bva-view-sec"><h3 style="margin-top:0">Gerçekte ne oldu</h3><p>${k.s}</p></section>`+
        `<section class="bva-view-sec"><h3 style="margin-top:0">Gelecek: vakanın bıraktığı sonuçlar</h3><ul class="pl">${v.ders.map(x=>`<li>${x}</li>`).join('')}</ul><div class="bva-q"><b>Tartışma sorusu:</b> ${v.soru}</div></section>`+
        `<div class="bva-sim" style="margin:0"><button type="button" class="bva-sec-btn" data-r="1">Yeniden dene</button></div>`;
      }
    };
    view.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.r){delete BVA_SEC[id];draw();up();}
      else if(b.dataset.ok){const r=view.querySelector('input[name="bva-o"]:checked');if(!r)return;BVA_SEC[id]=[+r.value];draw();up();}};
    view.onchange=e=>{if(e.target.name==='bva-o'){const b=view.querySelector('[data-ok]');if(b)b.disabled=false;}};
    draw();
  }
  function route(){
    const id=cur;
    if(D[id]&&BVA_KARAR[id])show(id);
    else{view.hidden=true;view.innerHTML='';home.hidden=false;renderList();}
  }
  [...new Set(["Tümü",...BVA_DATA.map(v=>v.tema)])].forEach((t,i)=>{
    const b=el('button','',t);b.type='button';b.setAttribute('aria-pressed',i===0);
    b.onclick=()=>{filt=t;[...fbox.children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderList()};
    fbox.appendChild(b);
  });
  document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();cur=decodeURIComponent(a.getAttribute('href').slice(1));route();fit();});
  route();
  new ResizeObserver(fit).observe(document.body);addEventListener('load',fit);fit();
})();
</script>
</body>
</html>
